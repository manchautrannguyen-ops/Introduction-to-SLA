ocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(85)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> satisfaction. However, learning a word is no simple task. One researcher (Nation, 1990, p. 31) has compiled a list of the different aspects of knowledge that must be acquired in order to know a word:<\u002Fp>\n<ul>\n<li>The meaning of the word<\u002Fli>\n<li>The written form of the word<\u002Fli>\n<li>The spoken form of the word<\u002Fli>\n<li>The grammatical behavior of the word<\u002Fli>\n<li>The collocations of the word<\u002Fli>\n<li>The register of the word<\u002Fli>\n<li>The associations of the word<\u002Fli>\n<li>The frequency of the word<\u002Fli>\n<\u002Ful>\n<p>Note that the above aspects are not acquired <span class=\"gap-wrap\" data-gap=\"86\" data-answer=\"simultaneously\"><input type=\"text\" class=\"gap-input\" data-gap=\"86\" aria-label=\"Gap 86\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(86)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. A learner may first acquire a given word’s form and meaning and only gradually come to understand the grammatical role of the word, the collocations, <span class=\"gap-wrap\" data-gap=\"87\" data-answer=\"associations\"><input type=\"text\" class=\"gap-input\" data-gap=\"87\" aria-label=\"Gap 87\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(87)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> and other aspects associated with its use. For instance, an ESL learner may first learn to associate the form “kids” with the meaning “children” and only later on discover that “kids” is normally used as part of a relatively informal language <span class=\"gap-wrap\" data-gap=\"88\" data-answer=\"register\"><input type=\"text\" class=\"gap-input\" data-gap=\"88\" aria-label=\"Gap 88\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(88)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, and would not normally be used in more formal academic contexts.<\u002Fp>\n<p>A number of factors have been identified as influencing a word’s acquisition. Factors related to a word’s form that have been identified as affecting its acquisition include its <span class=\"gap-wrap\" data-gap=\"89\" data-answer=\"pronouncability\"><input type=\"text\" class=\"gap-input\" data-gap=\"89\" aria-label=\"Gap 89\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(89)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, length, grammatical category, and morphological complexity. All other things being equal, less pronouncability, greater length, and more complex grammatical and <span class=\"gap-wrap\" data-gap=\"90\" data-answer=\"morphological\"><input type=\"text\" class=\"gap-input\" data-gap=\"90\" aria-label=\"Gap 90\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(90)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> structure tend to delay a word’s acquisition. A number of semantic factors have also been cited as affecting word acquisition: specificity of meaning, multiple meaning, <span class=\"gap-wrap\" data-gap=\"91\" data-answer=\"metaphorical\"><input type=\"text\" class=\"gap-input\" data-gap=\"91\" aria-label=\"Gap 91\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(91)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> meaning, connotational and stylistic <span class=\"gap-wrap\" data-gap=\"92\" data-answer=\"nuances\"><input type=\"text\" class=\"gap-input\" data-gap=\"92\" aria-label=\"Gap 92\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(92)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, and synonymy (e.g., Laufer, 1990; 1997).<\u002Fp>\n<p>An important first step in acquiring L2 words is mapping them to pre-<span class=\"gap-wrap\" data-gap=\"93\" data-answer=\"existing\"><input type=\"text\" class=\"gap-input\" data-gap=\"93\" aria-label=\"Gap 93\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(93)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> L1 concepts, a stage Jiang (2004) suggests is best labeled “comprehension” rather than “acquisition.” L2 words may therefore first be associated with their L1 translation <span class=\"gap-wrap\" data-gap=\"94\" data-answer=\"equivalents\"><input type=\"text\" class=\"gap-input\" data-gap=\"94\" aria-label=\"Gap 94\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(94)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (e.g., Blum &amp; Levenston, 1978; Ellis, 1997), such as associating the Spanish word “ciudad” with the word “city” in English for the native speaker of English. However, Jiang (p. 104) points out that: “accurate and idiomatic use of L2 words requires the development of semantic structures that are <span class=\"gap-wrap\" data-gap=\"95\" data-answer=\"specific\"><input type=\"text\" class=\"gap-input\" data-gap=\"95\" aria-label=\"Gap 95\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(95)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to L2 words.” Thus, developmentally, it is important that learners come to restructure semantic content so that the new words are appropriately used in the L2. For instance, the English speaker learning French may well acquire the French word “chaise” for “chair,” but in referring to an armchair, “chaise” is not the suitable French word: “fauteuil” is the <span class=\"gap-wrap\" data-gap=\"96\" data-answer=\"proper\"><input type=\"text\" class=\"gap-input\" data-gap=\"96\" aria-label=\"Gap 96\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(96)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> term for chairs with arm supports.<\u002Fp>\n<p>The existence of “chair” and “chaise” in English and French illustrates that languages can contain lexical items that are similar in form and meaning in both languages, called <span class=\"gap-wrap\" data-gap=\"97\" data-answer=\"cognates\"><input type=\"text\" class=\"gap-input\" data-gap=\"97\" aria-label=\"Gap 97\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(97)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. Studies show that cognates are usually acquired faster in a second language and are recognized faster in experimental studies (Dijkstra &amp; van Heuven, 2002).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"0fa8d9f7-3f19-432c-9884-ec8ee5d73ae0\" alt=\"image5.png\"><\u002Ffigure>\n<h4 class=\"section-h sub\">6.2.3 grammatical development<\u002Fh4>\n<p>In addition to acquiring the sound system and lexical items of a new language, there are of course the various <span class=\"gap-wrap\" data-gap=\"98\" data-answer=\"morphological\"><input type=\"text\" class=\"gap-input\" data-gap=\"98\" aria-label=\"Gap 98\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(98)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> and syntactic rules and patterns that need to be acquired. Much research has focused on studying the development of these <span class=\"gap-wrap\" data-gap=\"99\" data-answer=\"aspects\"><input type=\"text\" class=\"gap-input\" data-gap=\"99\" aria-label=\"Gap 99\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(99)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of the L2.<\u002Fp>\n<h5 class=\"section-h subsub\">6.2.3.1 Morphology<\u002Fh5>\n<p>Following Brown’s (1973) study of L1 morpheme acquisition in three children that we discussed in Chapter 2, researchers <span class=\"gap-wrap\" data-gap=\"100\" data-answer=\"undertook\"><input type=\"text\" class=\"gap-input\" data-gap=\"100\" aria-label=\"Gap 100\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(100)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to investigate morpheme acquisition patterns in L2 learners as well. What they found is that while the order of acquisition is somewhat different from that found in child L1 acquisition, learners of different L1 backgrounds acquiring English as a second language appear to acquire grammatical morphemes in a similar order (see Table 6.1).<\u002Fp>\n<p class=\"tbl-caption\">Table 6.1  Order of English L2 morpheme acquisition, based on Krashen (1977).<\u002Fp>\n<div class=\"table-wrap\"><table><tbody><tr><th><\u002Fth><th>Column 1<\u002Fth><th>Column 2<\u002Fth><th>Column 3<\u002Fth><\u002Ftr><tr><td>1st acquired:<\u002Ftd><td>“–ing” I am going home.<\u002Ftd><td>Plural “–s” The cats sleep.<\u002Ftd><td>Copula “to be” He is away.<\u002Ftd><\u002Ftr><tr><td>2nd acquired:<\u002Ftd><td>Auxiliary “be” The teacher is coming.<\u002Ftd><td>a/the The child sits down.<\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td>3rd acquired:<\u002Ftd><td>irregular past He went home.<\u002Ftd><td><\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td>4th acquired:<\u002Ftd><td>regular past “–ed” He talked too loud.<\u002Ftd><td>third person “–s” The student studies a lot.<\u002Ftd><td>possessive “–s” The teacher’s book is on the table.<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>Items grouped within each acquisition level are not ordered.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"9ad6d414-0516-4b43-ab5c-61de1d8b8ade\" alt=\"image6.png\"><\u002Ffigure>\n<p>For instance, Dulay and Burt (1973), who tested three groups of children for <span class=\"gap-wrap\" data-gap=\"101\" data-answer=\"accuracy\"><input type=\"text\" class=\"gap-input\" data-gap=\"101\" aria-label=\"Gap 101\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(101)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (with 80–90% accuracy required) on eight of Brown’s 14 grammatical <span class=\"gap-wrap\" data-gap=\"102\" data-answer=\"morphemes\"><input type=\"text\" class=\"gap-input\" data-gap=\"102\" aria-label=\"Gap 102\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(102)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (or “functors”), found that the overall rank order was similar across the three groups and differed from Brown’s L1 order (as discussed in Chapter 2). A more recent meta-analysis (Goldschneider &amp; DeKeyser, 2001), which looked at numerous morpheme studies carried out in previous years, confirmed that accuracy scores suggest there is a similar order of acquisition across adult L2 learners from different L1 backgrounds. The fact that learners from different language backgrounds appear to <span class=\"gap-wrap\" data-gap=\"103\" data-answer=\"acquire\"><input type=\"text\" class=\"gap-input\" data-gap=\"103\" aria-label=\"Gap 103\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(103)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> a basic set of morphemes in a similar order suggests that factors in addition to cross-linguistic influence play an important role for some aspects of grammatical development. Goldschneider and DeKeyser’s meta-analysis found that a combination of factors <span class=\"gap-wrap\" data-gap=\"104\" data-answer=\"associated\"><input type=\"text\" class=\"gap-input\" data-gap=\"104\" aria-label=\"Gap 104\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(104)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> with the functors (perceptual saliency, semantic complexity, morphophonological regularity, syntactic <span class=\"gap-wrap\" data-gap=\"105\" data-answer=\"category\"><input type=\"text\" class=\"gap-input\" data-gap=\"105\" aria-label=\"Gap 105\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(105)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> and frequency) explained much of the variance in acquisition order.<\u002Fp>\n<p>Still, it is important to keep in mind the dilemma pointed out in Chapter 4 in discussing Krashen’s Natural Order Hypothesis: accuracy order <span class=\"gap-wrap\" data-gap=\"106\" data-answer=\"calculated\"><input type=\"text\" class=\"gap-input\" data-gap=\"106\" aria-label=\"Gap 106\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(106)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> from various individuals at different stages of L2 development may not turn out to be identical to acquisition order measured across time in the same individual.<\u002Fp>\n<h5 class=\"section-h subsub\">6.2.3.2 Syntax<\u002Fh5>\n<p>L2 syntax, or word order, has been studied by a number of researchers. One widely cited study (Meisel, Clahsen, &amp; Pienemann, 1981) examined the <span class=\"gap-wrap\" data-gap=\"107\" data-answer=\"naturalistic\"><input type=\"text\" class=\"gap-input\" data-gap=\"107\" aria-label=\"Gap 107\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(107)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> development of L2 German among 45 immigrant workers of different L1 backgrounds (Italian, Portuguese, and Spanish) who were living in Germany in the late 1970s. This study found that learners <span class=\"gap-wrap\" data-gap=\"108\" data-answer=\"progressed\"><input type=\"text\" class=\"gap-input\" data-gap=\"108\" aria-label=\"Gap 108\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(108)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in a systematic manner in learning German word order and led to what is referred to as the Multidimensional Model. The model is multidimensional in the sense that it contains both developmental and variational features. Developmental features are proposed as being acquired in a fixed order due to processing <span class=\"gap-wrap\" data-gap=\"109\" data-answer=\"constraints\"><input type=\"text\" class=\"gap-input\" data-gap=\"109\" aria-label=\"Gap 109\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(109)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, and variational features allow for the effect of individual differences, such that they may be acquired at any time or possibly not acquired. Five distinct stages were identified based on when particular patterns <span class=\"gap-wrap\" data-gap=\"110\" data-answer=\"emerged\"><input type=\"text\" class=\"gap-input\" data-gap=\"110\" aria-label=\"Gap 110\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(110)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in the speech of the L2 learners (see Table 6.2). The first stage was labelled “canonical order;” this entailed that learners followed a SVO (subject-verb-object) word order at the earliest stage. In Stage 2, learners were found able to make some alternations to the basic sentence structure, in particular, by moving an adverb to the front of the sentence, as in “Da Kinder spielen” (“There children play”). (Note that in German, forming a grammatical sentence with an <span class=\"gap-wrap\" data-gap=\"111\" data-answer=\"initial\"><input type=\"text\" class=\"gap-input\" data-gap=\"111\" aria-label=\"Gap 111\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(111)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> adverb would normally require the main subject and verb to be inverted, as in “spielen Kinder.”) In a third stage, known as verb or particle <span class=\"gap-wrap\" data-gap=\"112\" data-answer=\"separation\"><input type=\"text\" class=\"gap-input\" data-gap=\"112\" aria-label=\"Gap 112\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(112)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, learners were found able to move verbal forms in internal sentence position to the beginning or end of sentences, as in producing “Alle kinder muss die pause machen” (“All the children must have a break”) in which the verb “machen” is moved to sentence final position. In Stage 4, inversion emerges, with learners able to invert syntactic categories in the middle of sentences when required: “Dann hat sie wieder die knoch gebringt.” (“Then she brought the bone again.”) Finally, Stage 5 appears, in which learners are able to place the verb at the end of a <span class=\"gap-wrap\" data-gap=\"113\" data-answer=\"subordinate\"><input type=\"text\" class=\"gap-input\" data-gap=\"113\" aria-label=\"Gap 113\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(113)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> clause, a relatively complex syntactic manipulation. “Er sagte, dass er nach hause kommt.” (“He said that he was coming home.”)<\u002Fp>\n<figure class=\"ch-img\"><img src=\"b1229072-2bc4-4923-aa23-c5b12c4027d5\" alt=\"image7.png\"><\u002Ffigure>\n<p>Results from this study have been <span class=\"gap-wrap\" data-gap=\"114\" data-answer=\"interpreted\"><input type=\"text\" class=\"gap-input\" data-gap=\"114\" aria-label=\"Gap 114\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(114)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in terms of the cognitive processing <span class=\"gap-wrap\" data-gap=\"115\" data-answer=\"load\"><input type=\"text\" class=\"gap-input\" data-gap=\"115\" aria-label=\"Gap 115\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(115)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> required to carry out the various syntactic manipulations at the various stages, leading to formulation of Pienemann’s Processability Theory (e.g., Pienemann, 1998). While Stage 1 requires a small processing load, the consecutive stages are suggested as requiring increasingly difficult <span class=\"gap-wrap\" data-gap=\"116\" data-answer=\"manipulations\"><input type=\"text\" class=\"gap-input\" data-gap=\"116\" aria-label=\"Gap 116\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(116)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> for the L2 learner, offering an explanation as to why they emerge at later phases. Learners are first able to make movements from a sentence-internal position to the beginnings or ends of sentences, and only later are able to manage what is <span class=\"gap-wrap\" data-gap=\"117\" data-answer=\"perceived\"><input type=\"text\" class=\"gap-input\" data-gap=\"117\" aria-label=\"Gap 117\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(117)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to be the more complex sentence-internal manipulations of word order.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"3beb78ca-73e3-493d-bdfa-02bc5840dd28\" alt=\"image8.png\"><\u002Ffigure>\n<aside class=\"practice-box\"><h5>Language learning in practice: Teachability Hypothesis<\u002Fh5><p>The findings related to studies associated with the Multidimensional Model led Pienemann (1988; 1989) to propose the Teachability Hypothesis. This hypothesis proposes that one can only successfully teach what the L2 learner is <span class=\"gap-wrap\" data-gap=\"118\" data-answer=\"cognitively\"><input type=\"text\" class=\"gap-input\" data-gap=\"118\" aria-label=\"Gap 118\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(118)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> ready to learn. He found that learners taught a grammatical structure that was determined to be only one stage beyond their current processing level indeed learned that rule, while those at an earlier stage failed to learn it.<\u002Fp><\u002Faside>\n<p class=\"tbl-caption\">Table 6.2  German L2 word-order emergence stages (Meisel, Clahsen, &amp; Pienemann, 1981; Pienemann, 1985).<\u002Fp>\n<div class=\"table-wrap\"><table><tbody><tr><th>Stage<\u002Fth><th>Description<\u002Fth><th>Example<\u002Fth><\u002Ftr><tr><td>Stage 1: Canonical order<\u002Ftd><td>usually SVO, first hypothesis<\u002Ftd><td>Die Kinder spielen mim Ball. (The children play with the ball.)<\u002Ftd><\u002Ftr><tr><td>Stage 2: Adverb preposing<\u002Ftd><td>limited to beginnings and ends of sentences; SVO (no inversion)<\u002Ftd><td>Da Kinder spielen (There children play.) (note, grammatically should be: Da spielen Kinder.)<\u002Ftd><\u002Ftr><tr><td>Stage 3: Verb separation<\u002Ftd><td>identification of internal elements, manipulation of the verbal form<\u002Ftd><td>Alle Kinder muss die Pause machen. (All children must the break have.)<\u002Ftd><\u002Ftr><tr><td>Stage 4: Verb in 2nd position “inversion”<\u002Ftd><td>manipulation of syntactic <span class=\"gap-wrap\" data-gap=\"119\" data-answer=\"categories\"><input type=\"text\" class=\"gap-input\" data-gap=\"119\" aria-label=\"Gap 119\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(119)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan><\u002Ftd><td>Dann hat sie wieder die Knoch gebringt. (Then has she again the bone brought.)<\u002Ftd><\u002Ftr><tr><td>Stage 5: Verb at the end of a subordinate clause<\u002Ftd><td>internal analysis at the phrase level; complex syntactic manipulation<\u002Ftd><td>Er sagte, dass er nach Hause kommt. (He said that he home comes.)<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h5 class=\"section-h subsub\">6.2.3.3 English L2 question development<\u002Fh5>\n<p>Pienemann and his colleagues (Johnston, 1985; Pienemann, Johnston, &amp; Brindley, 1988) investigated aspects of ESL grammatical development in 16 adults of Vietnamese and Polish L1 backgrounds, resulting in proposed stages relevant to question development. Table 6.3 reveals that learners begin with a single word, or formulaic expression, in posing a question with rising <span class=\"gap-wrap\" data-gap=\"120\" data-answer=\"intonation\"><input type=\"text\" class=\"gap-input\" data-gap=\"120\" aria-label=\"Gap 120\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(120)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (“Now?”). In Stage 2, the canonical SVO order, again with rising intonation, emerges (“You like Chinese food?”). In Stage 3, learners are found to use a question marker such as “do” or a “wh”-question word (e.g., what, where) at the beginning of a sentence (“Do he work?”). In Stage 4, inversion of a “wh”-question word and the copula or with certain auxiliaries other than “do” in yes–no questions emerges (“Have you car?”). In Stage 5, more complex inversion <span class=\"gap-wrap\" data-gap=\"121\" data-answer=\"emerges\"><input type=\"text\" class=\"gap-input\" data-gap=\"121\" aria-label=\"Gap 121\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(121)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, such as between a “wh”-question word and a sentence containing both an auxiliary and a main verb (“Did he not understand?”).<\u002Fp>\n<p>Again, this similar pattern found among learners of very different native languages (Vietnamese and Polish) provides more evidence that developmental sequences underlie much of L2 development.<\u002Fp>\n<p class=\"tbl-caption\">Table 6.3  ESL question development (based on Johnston, 1985; Pienemann, Johnston, &amp; Brindley, 1988).<\u002Fp>\n<div class=\"table-wrap\"><table><tbody><tr><th>Stage<\u002Fth><th>Example<\u002Fth><\u002Ftr><tr><td>1<\u002Ftd><td>single words; formulae Yes?<\u002Ftd><\u002Ftr><tr><td>2<\u002Ftd><td>SVO and question intonation You like Chinese food?<\u002Ftd><\u002Ftr><tr><td>3<\u002Ftd><td>“Do” fronting Do he work?<\u002Ftd><\u002Ftr><tr><td>4<\u002Ftd><td>a) Yes/no inversion Have you car? b) Inversion “wh” and copula Where is my purse?<\u002Ftd><\u002Ftr><tr><td>5<\u002Ftd><td>Inversion with auxiliaries Did he not understand?<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h4 class=\"section-h sub\">6.2.4 sociolinguistic variation and pragmatics<\u002Fh4>\n<p>Research examining this issue has revealed L2 learners’ patterns often <span class=\"gap-wrap\" data-gap=\"122\" data-answer=\"diverge\"><input type=\"text\" class=\"gap-input\" data-gap=\"122\" aria-label=\"Gap 122\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(122)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> substantially from that of native speakers. For instance, one study (Rehner, Mougeon, &amp; Nadasdi, 2003) looked at how English speaking students in French <span class=\"gap-wrap\" data-gap=\"123\" data-answer=\"immersion\"><input type=\"text\" class=\"gap-input\" data-gap=\"123\" aria-label=\"Gap 123\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(123)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> classes acquired the subject pronouns “nous” and “on” (equivalent to “we” in their L1 English) and found they used the more informal (or “mildly marked”) “on” much less than French Canadian native speakers, who use it almost <span class=\"gap-wrap\" data-gap=\"124\" data-answer=\"categorically\"><input type=\"text\" class=\"gap-input\" data-gap=\"124\" aria-label=\"Gap 124\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(124)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in spoken French (e.g., “On s’en va,” is more common than “Nous partons;” in English: “We’re going”). Another study (van Compernolle &amp; Williams, 2009) that similarly <span class=\"gap-wrap\" data-gap=\"125\" data-answer=\"examined\"><input type=\"text\" class=\"gap-input\" data-gap=\"125\" aria-label=\"Gap 125\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(125)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> learning of the French “on” and “nous,” in an online format, found the more advanced (third year) learners were more likely to adopt native-like usage patterns (i.e., opting for on) than less advanced students (first and second year).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"118c5b3f-a4ef-4478-9aba-bb299aaa3110\" alt=\"image9.png\"><\u002Ffigure>\n<p>There are diverse views about whether and to what extent such <span class=\"gap-wrap\" data-gap=\"126\" data-answer=\"sociolinguistic\"><input type=\"text\" class=\"gap-input\" data-gap=\"126\" aria-label=\"Gap 126\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(126)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> variation should be explicitly acknowledged and taught in the classroom (e.g., Gutierrez &amp; Fairclough, 2006). However, most teachers would agree that being able to use L2 linguistic features in contextually <span class=\"gap-wrap\" data-gap=\"127\" data-answer=\"appropriate\"><input type=\"text\" class=\"gap-input\" data-gap=\"127\" aria-label=\"Gap 127\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(127)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> situations is part and parcel of L2 communicative competence.<\u002Fp>\n<p>Closely related to the study of sociolinguistic variation is pragmatics. Pragmatics is the study of factors that determine how we choose certain language patterns in social interaction and what effects these choices have on our <span class=\"gap-wrap\" data-gap=\"128\" data-answer=\"conversational\"><input type=\"text\" class=\"gap-input\" data-gap=\"128\" aria-label=\"Gap 128\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(128)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> partners. The study of pragmatics includes speech acts such as requests and commands as well as the study of forms of <span class=\"gap-wrap\" data-gap=\"129\" data-answer=\"address\"><input type=\"text\" class=\"gap-input\" data-gap=\"129\" aria-label=\"Gap 129\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(129)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> and politeness, among others. For instance, if someone asks whether you can close the door, it is likely that you are actually being asked to close the door, and the individual is not expecting a yes or no answer as to whether you are physically <span class=\"gap-wrap\" data-gap=\"130\" data-answer=\"capable\"><input type=\"text\" class=\"gap-input\" data-gap=\"130\" aria-label=\"Gap 130\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(130)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of closing the door. Interlanguage pragmatics (ILP) is the term given to the study of pragmatics in L2 acquisition. Kasper (1998, p. 184) defines interlanguage pragmatics as “the study of nonnative speakers’ comprehension, production, and acquisition of linguistic action in L2, or put briefly, ILP investigates how to do things with words in a second language.” Language patterns and structures used to <span class=\"gap-wrap\" data-gap=\"131\" data-answer=\"convey\"><input type=\"text\" class=\"gap-input\" data-gap=\"131\" aria-label=\"Gap 131\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(131)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> pragmatic information are likely to vary greatly from one cultural context and language to another. For instance, in some languages, the polite form in a formal context requires an indirect <span class=\"gap-wrap\" data-gap=\"132\" data-answer=\"formulation\"><input type=\"text\" class=\"gap-input\" data-gap=\"132\" aria-label=\"Gap 132\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(132)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, as in the English example referred to earlier: “Could you close the door?” rather than the more direct “Close the door,” or as found in the question “Could you give me a hand?” which does not mean you want your friend to literally offer you a body part! Learning the interlanguage pragmatics of a new language is therefore a challenging task.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"d1568fd9-1147-4735-bc07-a30457809a67\" alt=\"image10.png\"><\u002Ffigure>\n<figure class=\"ch-img\"><img src=\"d641247d-f56d-4051-9663-ec7208e84b45\" alt=\"image11.png\"><\u002Ffigure>\n<p>We have already mentioned the role that formulaic sequences appear to play in L2 development. Pragmatic development can be illustrated through reference to these sequences as well. For instance, in Chapter 4 we referred to Schmidt’s (1983) study of Wes, a Japanese L1 individual learning English as a second language in Hawai‘i. Wes began by making requests, a pragmatic function, in a restaurant context using <span class=\"gap-wrap\" data-gap=\"133\" data-answer=\"formulaic\"><input type=\"text\" class=\"gap-input\" data-gap=\"133\" aria-label=\"Gap 133\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(133)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> expressions such as “Can I get?” which were later used in a more productive manner, although not always correctly.<\u002Fp>\n<p>In general, it seems some pragmatic distinctions are not acquired rapidly. Cook (2001) found that English native speakers learning Japanese were <span class=\"gap-wrap\" data-gap=\"134\" data-answer=\"strikingly\"><input type=\"text\" class=\"gap-input\" data-gap=\"134\" aria-label=\"Gap 134\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(134)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> unable to detect <span class=\"gap-wrap\" data-gap=\"135\" data-answer=\"inappropriate\"><input type=\"text\" class=\"gap-input\" data-gap=\"135\" aria-label=\"Gap 135\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(135)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> language style choices when listening to taped interviews. The learners applied their L1 language and cultural standards in evaluating the interviews, despite the very different style expectations for the Japanese context. In this regard, it has been noted that more <span class=\"gap-wrap\" data-gap=\"136\" data-answer=\"subtle\"><input type=\"text\" class=\"gap-input\" data-gap=\"136\" aria-label=\"Gap 136\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(136)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> aspects of pragmatics are acquired late in both L1 and L2 (Kasper &amp; Schmidt, 1996).<\u002Fp>\n<p>The question has also been asked as to whether there is a natural route of development of interlanguage pragmatics. A developmental route for acquiring requests was proposed by Kasper and Rose (2002), who indicated a five-stage <span class=\"gap-wrap\" data-gap=\"137\" data-answer=\"progression\"><input type=\"text\" class=\"gap-input\" data-gap=\"137\" aria-label=\"Gap 137\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(137)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> based on longitudinal studies by other researchers (Achiba, 2003; Ellis, 1992). This request sequence was described as: 1) “pre-basic” an elementary stage where language forms are linked to specific contexts; 2) formulaic (using formulaic sequences); 3) “unpacking” (formulas analyzed and used productively); 4) pragmatic expansion; and 5) fine-<span class=\"gap-wrap\" data-gap=\"138\" data-answer=\"tuning\"><input type=\"text\" class=\"gap-input\" data-gap=\"138\" aria-label=\"Gap 138\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(138)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. It was proposed that the learner passes through these stages, beginning with a reliance on formulas, then using increasingly more complex forms as he or she develops the ability to use requests adapted to the context and to conversational partners. For example, a possible <span class=\"gap-wrap\" data-gap=\"139\" data-answer=\"scenario\"><input type=\"text\" class=\"gap-input\" data-gap=\"139\" aria-label=\"Gap 139\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(139)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> for the five stages underlying a learner’s stamp buying <span class=\"gap-wrap\" data-gap=\"140\" data-answer=\"excursion\"><input type=\"text\" class=\"gap-input\" data-gap=\"140\" aria-label=\"Gap 140\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(140)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> at the local post office might resemble the sequence shown in Table 6.4.<\u002Fp>\n<p>While some <span class=\"gap-wrap\" data-gap=\"141\" data-answer=\"commonalities\"><input type=\"text\" class=\"gap-input\" data-gap=\"141\" aria-label=\"Gap 141\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(141)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in pragmatic development can be identified, it is likely that there are also substantial differences in how pragmatic skills develop, depending on factors such as exposure to input and learners’ sensitivity to that input.<\u002Fp>\n<p>It is also interesting to note that disparities have been found between L2 grammatical and pragmatic development. One study (Bardovi-Harlig &amp; Dornyei, 1998) found that Hungarian L1 learners of English as a foreign language in a classroom setting were less able to <span class=\"gap-wrap\" data-gap=\"142\" data-answer=\"detect\"><input type=\"text\" class=\"gap-input\" data-gap=\"142\" aria-label=\"Gap 142\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(142)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> pragmatic errors than they were grammatical errors, while ESL learners in the US had the opposite pattern. In a study of Cantonese speaking children learning English in a primary school in Hong Kong, Rose (2000) found that their pragmatic responses, when responding to cartoon-based scenarios, showed that there was little indication of transfer from Cantonese. There was also little variation according to contextual factors such as the status of the conversation partner and topic, even when the language forms they used showed increased <span class=\"gap-wrap\" data-gap=\"143\" data-answer=\"complexity\"><input type=\"text\" class=\"gap-input\" data-gap=\"143\" aria-label=\"Gap 143\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(143)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. For example, “requests” were coded (Rose, 2000, p. 40) as direct (e.g., “Give me your notes”), conventionally indirect (e.g., “Can I borrow your notes?”), or as a hint (e.g., “I missed class yesterday. Did you go?”). The most common response was indirect, <span class=\"gap-wrap\" data-gap=\"144\" data-answer=\"regardless\"><input type=\"text\" class=\"gap-input\" data-gap=\"144\" aria-label=\"Gap 144\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(144)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of contextual factors such as social status of the person to whom the request was addressed. In general, one would expect a greater use of “hint” forms in interactions where the request was an important one and with higher status conversational partners.<\u002Fp>\n<p class=\"tbl-caption\">Table 6.4  Five stages in buying stamps.<\u002Fp>\n<div class=\"table-wrap\"><table><tbody><tr><th>Stages<\u002Fth><th>Example<\u002Fth><\u002Ftr><tr><td>1<\u002Ftd><td>pre basic: “Stamps please.”<\u002Ftd><\u002Ftr><tr><td>2<\u002Ftd><td>use of a formulaic expression: “I want stamps.”<\u002Ftd><\u002Ftr><tr><td>3<\u002Ftd><td>more productive use of formulas: “Can you give me stamps?”<\u002Ftd><\u002Ftr><tr><td>4<\u002Ftd><td>more complex structures, indirectness: “Could I have some stamps?”<\u002Ftd><\u002Ftr><tr><td>5<\u002Ftd><td>further refinement, adjustment to context: “I would like to buy some stamps please.”<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h4 class=\"section-h sub\">6.2.5 reading<\u002Fh4>\n<p>Considerable attention has also been <span class=\"gap-wrap\" data-gap=\"145\" data-answer=\"devoted\"><input type=\"text\" class=\"gap-input\" data-gap=\"145\" aria-label=\"Gap 145\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(145)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to exploring the development of L2 literacy-related skills. L2 reading development has received particular attention. The study of reading, whether in an L1 or L2, <span class=\"gap-wrap\" data-gap=\"146\" data-answer=\"entails\"><input type=\"text\" class=\"gap-input\" data-gap=\"146\" aria-label=\"Gap 146\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(146)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> both lower level, or “bottom-up,” and higher level or “top-down” processing. Bottom-up processing refers to processing activities that include letter and word recognition and syntactic analysis. Top-down processing refers to aspects such as comprehension and <span class=\"gap-wrap\" data-gap=\"147\" data-answer=\"semantic\"><input type=\"text\" class=\"gap-input\" data-gap=\"147\" aria-label=\"Gap 147\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(147)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> interpretation of the text.<\u002Fp>\n<p>Word recognition is a crucial component of reading. Studies reveal that readers actually focus on the majority (80%) of content words and as many as half of function words (Perfetti, 1999; Stanovich, 2000). Grabe (2009, p. 23) points that in order for fluent word recognition to occur:<\u002Fp>\n<p>A reader must recognize the word forms on the page very rapidly, activate links between the graphic form and phonological information, activate appropriate semantic and syntactic resources, recognize morphological affixation in complex word forms, and access her or his mental lexicon.<\u002Fp>\n<p>In terms of L2 reading development, one prominent view, the Interdependence Hypothesis, articulated by Cummins (1981; 1991) particularly with regard to the acquisition of two languages in childhood, predicts that academic <span class=\"gap-wrap\" data-gap=\"148\" data-answer=\"proficiency\"><input type=\"text\" class=\"gap-input\" data-gap=\"148\" aria-label=\"Gap 148\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(148)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> will transfer across languages in such a way that students who have developed literacy in their first language will tend to make stronger progress in acquiring L2 literacy. This view therefore emphasizes that L1 reading skill transfers to L2 reading skill, providing learners have reached an L1 reading <span class=\"gap-wrap\" data-gap=\"149\" data-answer=\"threshold\"><input type=\"text\" class=\"gap-input\" data-gap=\"149\" aria-label=\"Gap 149\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(149)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> level. There have been a number of studies that support this view (e.g., Bernhardt &amp; Kamil, 1995; Cummins, 1991).<\u002Fp>\n<p>On the other hand, other studies (e.g., Droop &amp; Verhoeven, 2003; Geva, 2006) suggest that L2 proficiency, such as vocabulary and morphosyntactic knowledge, listening comprehension, and <span class=\"gap-wrap\" data-gap=\"150\" data-answer=\"orthographic\"><input type=\"text\" class=\"gap-input\" data-gap=\"150\" aria-label=\"Gap 150\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(150)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> script processing (i.e., processing spelling patterns) also plays a substantial role in L2 reading skill. Thus, while a L1 reading threshold plays an important part in transferring reading skill to the L2, another important threshold is language skill in the L2. For instance, a strong knowledge of L2 vocabulary appears to be important for L2 reading (Haynes &amp; Baker, 1993; Qian, 2002; Ulijn &amp; Strother, 1990). As discussed in Section 6.2.2 on vocabulary, it has been suggested (Nation, 2006) that knowing at least 8000 word families in English appears to be necessary to provide understanding of 98% of a given English language text.<\u002Fp>\n<p>With regard to the relative contribution of L1 reading skill and L2 <span class=\"gap-wrap\" data-gap=\"151\" data-answer=\"proficiency\"><input type=\"text\" class=\"gap-input\" data-gap=\"151\" aria-label=\"Gap 151\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(151)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, according to Alderson (2000, p. 39):<\u002Fp>\n<p>The clear conclusion of [L1 reading vs L2 language knowledge] studies is that second-language knowledge is more important than first-language reading abilities, and that a linguistic threshold exists which must be crossed before first-language reading ability can transfer to second-language reading contexts.<\u002Fp>\n<p>The emerging <span class=\"gap-wrap\" data-gap=\"152\" data-answer=\"consensus\"><input type=\"text\" class=\"gap-input\" data-gap=\"152\" aria-label=\"Gap 152\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(152)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, as expressed by Grabe (2009, p. 145), appears to be that “. . . certain skills are likely to transfer readily while other skills needed for L2 reading are more dependent on L2 language skills development.” Therefore both L1 reading skill and L2 proficiency have important contributions in L2 reading development, and the role of L2 proficiency should not be <span class=\"gap-wrap\" data-gap=\"153\" data-answer=\"underestimated\"><input type=\"text\" class=\"gap-input\" data-gap=\"153\" aria-label=\"Gap 153\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(153)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>.<\u002Fp>\n<p>Note that the extent to which writing systems differ across languages is an important factor in L2 reading. Learning to read in a second language that largely shares the same alphabetic writing system, such as moving between English and Spanish, does not <span class=\"gap-wrap\" data-gap=\"154\" data-answer=\"pose\"><input type=\"text\" class=\"gap-input\" data-gap=\"154\" aria-label=\"Gap 154\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(154)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> the same challenges as learning between English and the logographic (visual symbols representing words) system used for Mandarin Chinese. Still, in her summary of the literature on influences in L2 reading, Koda (2011, p. 479) emphasizes that even though L1 background plays an important role in L2 reading development, the strongest influence appears to be exposure to L2 input, such that it can “<span class=\"gap-wrap\" data-gap=\"155\" data-answer=\"override\"><input type=\"text\" class=\"gap-input\" data-gap=\"155\" aria-label=\"Gap 155\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(155)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>” L1 background.<\u002Fp>\n<aside class=\"practice-box\"><h5>Language learning in practice: General principles for teaching L2 reading (Grabe, 2011, pp. 453–454)<\u002Fh5><p>1.  A curricular framework . . . that should <span class=\"gap-wrap\" data-gap=\"156\" data-answer=\"integrate\"><input type=\"text\" class=\"gap-input\" data-gap=\"156\" aria-label=\"Gap 156\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(156)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> major skills instruction with extensive practice and exposure to print.2.  Reading materials and resources that need to be interesting, varied, good looking, <span class=\"gap-wrap\" data-gap=\"157\" data-answer=\"abundant\"><input type=\"text\" class=\"gap-input\" data-gap=\"157\" aria-label=\"Gap 157\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(157)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, accessible, and well-used.3.  Some degree of student choice along the way in the selection of major reading sources.4.  Reading skills . . . introduced and taught by examining the primary texts used in the reading course.5.  Lessons that are structured around pre-reading, during-reading, and post-reading activities, and these activities should be varied from one major reading to the next.6.  Instruction . . . [to] support the following developmental goals:a) promote word-<span class=\"gap-wrap\" data-gap=\"158\" data-answer=\"recognition\"><input type=\"text\" class=\"gap-input\" data-gap=\"158\" aria-label=\"Gap 158\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(158)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> skillsb) build a large recognition vocabularyc) practice comprehension skills that combine awareness of grammar, main idea identification and comprehension <span class=\"gap-wrap\" data-gap=\"159\" data-answer=\"strategies\"><input type=\"text\" class=\"gap-input\" data-gap=\"159\" aria-label=\"Gap 159\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(159)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> . . .d) build awareness of discourse structuree) promote strategic readingf) practice reading fluencyg) develop extensive readingh) develop motivationi) combine language learning with content learning.7.  Opportunities for students to experience comprehension success while reading.8.  Expectations that reading occurs in class every day and that many <span class=\"gap-wrap\" data-gap=\"160\" data-answer=\"extended\"><input type=\"text\" class=\"gap-input\" data-gap=\"160\" aria-label=\"Gap 160\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(160)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> reading opportunities are provided on a regular basis.<\u002Fp><\u002Faside>\n<h3 class=\"section-h\">6.3 investigating learner language: language corpora<\u002Fh3>\n<p>One important benefit of advances in computer technology is that researchers now have access to large sets of language data, or language corpora. Just as CHILDES has been an invaluable tool in L1 research, as discussed in Chapter 2, some L2 research is increasingly turning to L2 learner language databanks to either test <span class=\"gap-wrap\" data-gap=\"161\" data-answer=\"hypotheses\"><input type=\"text\" class=\"gap-input\" data-gap=\"161\" aria-label=\"Gap 161\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(161)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> or to assist in the development of theory. One well developed L2 corpus is the International Corpus of Learning English (ICLE) compiled by researchers in Belgium from <span class=\"gap-wrap\" data-gap=\"162\" data-answer=\"argumentative\"><input type=\"text\" class=\"gap-input\" data-gap=\"162\" aria-label=\"Gap 162\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(162)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> written texts contributed by approximately 130 different learners (Granger, Dagneaux, Meunier, &amp; Paquot, 2009). There are also oral corpora, such as the Louvain International Database of Spoken English Interlanguage (LINDSEI) developed from advanced L2 learners, as well as the French Learner Language Oral Corpora (Myles, 2005).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"8ba0f205-4bfb-4ad1-ad73-6a4c4a09223d\" alt=\"image12.png\"><\u002Ffigure>\n<p>Access to data compiled from various language learners, along with specific information about the learner (language background, proficiency, age, sex, L2 exposure, etc.) and the communication situation (how, when, and where the data were collected), can be a valuable source of information for those interested in examining the L2 learning process. For instance, such data banks make it possible to find the most frequent errors <span class=\"gap-wrap\" data-gap=\"163\" data-answer=\"involving\"><input type=\"text\" class=\"gap-input\" data-gap=\"163\" aria-label=\"Gap 163\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(163)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> a particular grammatical structure or vocabulary item across learners with a particular profile (age, proficiency level, etc.). As another example, the extent to which learners use the formulaic sequences or <span class=\"gap-wrap\" data-gap=\"164\" data-answer=\"prefabricated\"><input type=\"text\" class=\"gap-input\" data-gap=\"164\" aria-label=\"Gap 164\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(164)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> routines discussed earlier in this chapter is an additional aspect that can be and has been investigated through corpus research.<\u002Fp>\n<p>Granger (2012) points out specific insights from corpus research by citing a study (Housen, 2002) which re-<span class=\"gap-wrap\" data-gap=\"165\" data-answer=\"examined\"><input type=\"text\" class=\"gap-input\" data-gap=\"165\" aria-label=\"Gap 165\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(165)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> L2 morpheme acquisition studies through a longitudinal oral corpus. According to Granger (pp. 13–14):<\u002Fp>\n<p>While the study generally confirms the general order of emergence of morphemes, it also reveals significant variation at the level of individual learners and generally highlights a number of benefits that can be gained from investigations of large learner corpora.<\u002Fp>\n<p>The expanding possibilities for corpus research afforded by the development of computerized programs will no doubt lead to further re-examinations of this type.<\u002Fp>\n<h3 class=\"section-h\">6.4 summing up<\u002Fh3>\n<p>As we have seen, the learner’s L2 development is affected by a number of factors and predictable characteristics, including cross-<span class=\"gap-wrap\" data-gap=\"166\" data-answer=\"linguistic\"><input type=\"text\" class=\"gap-input\" data-gap=\"166\" aria-label=\"Gap 166\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(166)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> influence, the overgeneralization of rules within the L2, the effect of markedness, developmental sequences, formulaic sequences, fossilization, and <span class=\"gap-wrap\" data-gap=\"167\" data-answer=\"avoidance\"><input type=\"text\" class=\"gap-input\" data-gap=\"167\" aria-label=\"Gap 167\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(167)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. Such influences, along with others, affect the acquisition of L2 phonology, vocabulary, grammar, sociolinguistic variation, pragmatics, and reading in a number of <span class=\"gap-wrap\" data-gap=\"168\" data-answer=\"complex\"><input type=\"text\" class=\"gap-input\" data-gap=\"168\" aria-label=\"Gap 168\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(168)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> ways. Finally, the chapter concluded by acknowledging the growing importance of learner language <span class=\"gap-wrap\" data-gap=\"169\" data-answer=\"databanks\"><input type=\"text\" class=\"gap-input\" data-gap=\"169\" aria-label=\"Gap 169\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(169)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, or language corpora, which have vastly <span class=\"gap-wrap\" data-gap=\"170\" data-answer=\"facilitated\"><input type=\"text\" class=\"gap-input\" data-gap=\"170\" aria-label=\"Gap 170\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(170)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> research into learner language and its development.<\u002Fp>\n<h3 class=\"section-h\">key concepts<\u002Fh3>\n<ul>\n<li>Markedness<\u002Fli>\n<li>Marked vs unmarked<\u002Fli>\n<li>Markedness Differential Hypothesis (MDH)<\u002Fli>\n<li>Developmental sequences<\u002Fli>\n<li>Fossilization<\u002Fli>\n<li>Speech learning model<\u002Fli>\n<li>Cognates<\u002Fli>\n<li>Multidimensional Model<\u002Fli>\n<li>Processability Theory<\u002Fli>\n<li>Teachability Hypothesis<\u002Fli>\n<li>Pragmatics<\u002Fli>\n<li>Interlanguage Pragmatics (ILP)<\u002Fli>\n<li>Language corpora<\u002Fli>\n<\u002Ful>\n<h3 class=\"section-h\">self-assessment questions<\u002Fh3>\n<div class=\"saq\"><p class=\"saq-q\"><strong>1.<\u002Fstrong> An L2 learner who uses one of his/her L1 structures to form a sentence in the L2 can be said to be demonstrating<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>fossilization<\u002Fli><li>markedness<\u002Fli><li>cross-linguistic influence<\u002Fli><li>formulaic sequences<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>2.<\u002Fstrong> Flege’s Speech Learning Model (SLM) predicts that<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>sounds that are similar between the L1 and L2 will be difficult to both perceive and produce since learners already have created sound categories in their L1<\u002Fli><li>new sounds (not in the L1) will be more difficult for learners to perceive and produce than sounds that are similar in L1 and L2<\u002Fli><li>older learners will excel in producing new sounds<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>3.<\u002Fstrong> Markedness theory suggests that<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>if a given language contains a marked structure, it is likely to contain the unmarked equivalent as well<\u002Fli><li>if a language contains an unmarked structure, it is likely to contain the marked equivalent as well<\u002Fli><li>voiced and voiceless stops are both considered marked<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>4.<\u002Fstrong> Studies of L2 morpheme acquisition in adults of different L1 backgrounds reveal<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>learners have very different orders of acquisition<\u002Fli><li>learners appear to acquire a basic set of morphemes in a similar order<\u002Fli><li>learners acquire morphemes in the same order as children learning their L1<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>5.<\u002Fstrong> The Multidimensional Model describes<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>a sequence of L2 word order acquisition<\u002Fli><li>the dimensions of meaning acquired in reading<\u002Fli><li>pragmatic aspects of language development<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<p>6. To learn a new word from a written text, approximately what percentage of words in that text must already be familiar to the reader? a. 20% b. 50% c. 75% d. 95%<\u002Fp>\n<h3 class=\"section-h\">discussion questions<\u002Fh3>\n<p>1. Can you think of examples of cross-linguistic influence (CLI) in your own learning of an L2? Are there specific ways in which your L1 appears to influence aspects of your L2 learning?<\u002Fp>\n<p>2. Are there any aspects of your mastery of an L2 that you consider to have “fossilized?” Can you think of explanations as to why you think this has happened?<\u002Fp>\n<p>3. Are there L2 structures or patterns that you knowingly avoid? Why?<\u002Fp>\n<p>4. How do you think you best learn the vocabulary of a second language? Do you have the impression that you learn more new words by reading in that language, by listening to L2 conversations, or by memorizing lists of new words?<\u002Fp>\n<p>5. How are/were you taught vocabulary in your L2 class? Was there a systematic presentation of items? In your opinion how effective was the method used?<\u002Fp>\n<h3 class=\"section-h\">exercises/project ideas<\u002Fh3>\n<p>1. Prepare a scenario in which you will be able to engage an ESL learner in conversation and record his/her utterances. Find ways to elicit questions. Compare the learner’s question structures with the Pienemann et al. (1988) series of question stages in Table 6.3. Does the learner produce all question types or only certain types? What does this tell you about the learner’s stage of question development?<\u002Fp>\n<p>2. Find a second language learner and ask him/her to write a short essay in the L2. Examine the vocabulary used in terms of accuracy. Which items appear to pose the greatest problem? Are cognates used correctly?<\u002Fp>\n<p>3. Arrange to get writing samples from two ESL learners, one at a fairly early stage and another at a fairly advanced stage. Check the writing samples for the grammatical morphemes or functors reported in Table 6.1. Do the two learners differ in terms of the functors they appear to have correctly acquired? If not, do the functors acquired only by the more advanced learner correspond to those reported as generally the last functors to be acquired (for example, third person “s” or possessive “s”)?<\u002Fp>\n<h3 class=\"section-h\">further reading and viewing<\u002Fh3>\n<p>Coady, J., &amp; Huckin, T. (Eds.) (1997). Second language vocabulary acquisition. Cambridge: Cambridge University Press.<\u002Fp>\n<p>Edited volume offering excellent overview of important aspects of L2 vocabulary acquisition.<\u002Fp>\n<p>De Angelis, G., &amp; Dewaele, J-M. (Eds.) (2011). New trends in crosslinguistic influence and multilingualism research. Bristol: Multilingual Matters.<\u002Fp>\n<p>Edited volume discussing a variety of CLI studies.<\u002Fp>\n<p>Grabe, W. (2009). Reading in a second language. Cambridge: Cambridge University Press.<\u002Fp>\n<p>A comprehensive discussion of the reading process and important issues in reading in a second language.<\u002Fp>\n<p>Nation, I.S.P. (2001). Learning vocabulary in another language. Cambridge: Cambridge University Press.<\u002Fp>\n<p>Well written introduction to L2 vocabulary acquisition.<\u002Fp>\n<p>Odlin, T. (2003). Cross-linguistic influence. In C. J. Doughty &amp; M.H. Long (Eds.), The handbook of second language acquisition (pp. 436–486). Oxford: Blackwell.<\u002Fp>\n<p>This chapter from Doughty and Long is a very good overview of cross-linguistic influence.<\u002Fp>\n<p>Pienemann, M. (2007). Processability theory. In B. VanPatten &amp; J. Williams (Eds.), Theories in second language acquisition: An introduction (pp. 137–154). Mahwah, NJ: Lawrence Erlbaum Associates.<\u002Fp>\n<p>A succinct description of Pienemann’s processability theory.<\u002Fp>\n<p>Rose, K.R., &amp; Kasper, G. (2001). Pragmatics in language teaching. Cambridge: Cambridge University Press.<\u002Fp>\n<p>An edited volume with chapters discussing various aspects of pragmatics in classroom instruction.<\u002Fp>\n<p>Schmitt, N. (2000). Vocabulary in language teaching. Cambridge: Cambridge University Press.<\u002Fp>\n<p>A good introduction to issues in vocabulary acquisition from the language classroom perspective. Includes relevant exercises.<\u002Fp>\n<h3 class=\"section-h\">Video links<\u002Fh3>\n<p>Wiley &amp; Sons Ltd (2013). “Developing L2 pragmatics,” by Kathleen Bardovi-Harlig. Available at: http://www.youtube.com/watch?v=3KWQsfQoxqc<\u002Fp>\n<p>Floating University (2011). Steven Pinker on language pragmatics. Available at: http://www.youtube.com/watch?v=VKbp4hEHV-s&amp;feature=player_detailpage<\u002Fp>\n<p>The ER Foundation (2011) Developing fluency in reading. Available in four parts:<\u002Fp>\n<p>Part 1: http://www.youtube.com/watch?v=-RgcY3Ka97Y<\u002Fp>\n<p>Part 2: http://www.youtube.com/watch?v=v9rMKSYEp48<\u002Fp>\n<p>Part 4: http://www.youtube.com/watch?v=ZVJMr8xBgIA<\u002Fp>\n<p>A lecture by Paul Nation at Compass Day, Seoul.<\u002Fp>\n<h3 class=\"section-h\">references<\u002Fh3>\n<p>Achiba, M. (2003). Learning to request in a second language: A study of child interlanguage pragmatics. Clevedon, UK: Multilingual Matters.<\u002Fp>\n<p>Alderson, J.C. (2000). Assessing reading. New York: Cambridge University Press.<\u002Fp>\n<p>Bardovi- 114.<\u002Fp>\n<p>Wilkins, D.A. (1972). Linguistics and language teaching. London: Edward Arnold.<\u002Fp>\n<p>Wood, D. (2010). Formulaic language and second language speech fluency. New York: Continuum.<\u002Fp>\n<p>Wray, A. (2000). Formulaic sequences in second language teaching: principle and practice. Applied Linguistics, 21(4), 463–489.<\u002Fp>\n  <\u002Fsection>\n<\u002Fdiv>\n<script>\n(function(){\n  function normalize(str){if(!str)return '';return str.toLowerCase().trim().replace(/[\\u2018\\u2019]/g,\"'\").replace(/[\\u201C\\u201D]/g,'\"').replace(/\\s+/g,' ');}\n  function checkInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');const answer=wrap.getAttribute('data-answer')||'';const value=input.value;\n    if(!value.trim()){input.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');return null;}\n    const ok=normalize(value)===normalize(answer);input.classList.toggle('correct',ok);input.classList.toggle('wrong',!ok);input.classList.remove('revealed');\n    fb.classList.toggle('ok',ok);fb.classList.toggle('no',!ok);fb.classList.remove('show');return ok;}\n  function revealInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');const answer=wrap.getAttribute('data-answer')||'';\n    input.value=answer;input.classList.remove('correct','wrong');input.classList.add('revealed');fb.classList.remove('ok','no');fb.classList.add('show');}\n  function resetInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');input.value='';input.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');}\n  function updateGlobalStats(){const inputs=document.querySelectorAll('.gap-input');let correct=0;inputs.forEach(inp=>{if(inp.classList.contains('correct'))correct++;});\n    const total=inputs.length;document.getElementById('score-text').textContent=correct+' / '+total+' correct';\n    document.getElementById('score-bar').style.width=(total?(correct/total*100):0)+'%';}\n  document.addEventListener('input',(e)=>{if(e.target.classList.contains('gap-input')){const fb=e.target.parentElement.querySelector('.gap-feedback');\n    e.target.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');updateGlobalStats();}});\n  document.addEventListener('blur',(e)=>{if(e.target.classList.contains('gap-input')&&e.target.value.trim()){checkInput(e.target);updateGlobalStats();}},true);\n  document.addEventListener('keydown',(e)=>{if(e.target.classList.contains('gap-input')&&e.key==='Enter'){e.preventDefault();checkInput(e.target);updateGlobalStats();\n    const inputs=[...document.querySelectorAll('.gap-input')];const idx=inputs.indexOf(e.target);if(idx>=0&&idx+1<inputs.length)inputs[idx+1].focus();}});\n  document.getElementById('btn-check-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(inp=>{if(inp.value.trim())checkInput(inp);});updateGlobalStats();\n    const summary=document.getElementById('summary-top');const total=document.querySelectorAll('.gap-input').length;const correct=document.querySelectorAll('.gap-input.correct').length;\n    summary.innerHTML='<strong>'+correct+' / '+total+' correct.<\u002Fstrong> Review any incorrect answers and try again.';summary.classList.add('show');});\n  document.getElementById('btn-reveal-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(revealInput);updateGlobalStats();});\n  document.getElementById('btn-reset-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(resetInput);document.getElementById('summary-top').classList.remove('show');updateGlobalStats();});\n  updateGlobalStats();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
