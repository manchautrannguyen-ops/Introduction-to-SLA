  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Gap-Fill Exercise — Chapter 6: Second Language Development<\u002Ftitle>\n\n<style>\n  :root { --bg:#f8f6f1; --surface:#fff; --ink:#1f1f1f; --ink-soft:#555; --ink-muted:#7a7a7a;\n    --border:#e5e2d8; --border-strong:#d6d2c5; --accent:#b85c2c; --accent-soft:#fbeee5;\n    --correct:#1f8a5b; --correct-soft:#e6f5ed; --wrong:#c43d3d; --wrong-soft:#fbeaea;\n    --hint:#8a6d2c; --hint-soft:#fbf4dc;\n    --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04); }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);\n    font-family:\"Charter\",\"Iowan Old Style\",\"Source Serif Pro\",Georgia,\"Times New Roman\",serif;\n    font-size:17px;line-height:1.65}\n  .page{max-width:880px;margin:0 auto;padding:40px 28px 80px}\n  header.intro{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}\n  header.intro p{margin:6px 0;color:var(--ink-soft);font-size:15px}\n  .toolbar{position:sticky;top:0;z-index:20;background:rgba(248,246,241,.92);\n    backdrop-filter:saturate(140%) blur(8px);-webkit-backdrop-filter:saturate(140%) blur(8px);\n    margin:0 -28px 24px;padding:12px 28px;border-bottom:1px solid var(--border);\n    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n  .toolbar .actions{display:flex;flex-wrap:wrap;gap:8px}\n  .toolbar .progress{font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:12px}\n  .progress-bar{width:140px;height:6px;background:var(--border);border-radius:999px;overflow:hidden}\n  .progress-bar>span{display:block;height:100%;width:0%;background:var(--accent);transition:width .3s ease}\n  button.btn{font:inherit;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n    padding:7px 14px;border-radius:8px;border:1px solid var(--border-strong);\n    background:var(--surface);color:var(--ink);cursor:pointer;transition:all .15s ease}\n  button.btn:hover{border-color:var(--accent);color:var(--accent)}\n  button.btn:active{transform:scale(.98)}\n  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}\n  button.btn.primary:hover{background:#a04f24;border-color:#a04f24;color:#fff}\n  button.btn.ghost{background:transparent}\n  section.chapter{background:var(--surface);border:1px solid var(--border);border-radius:14px;\n    padding:26px 32px 30px;margin:0 0 28px;box-shadow:var(--shadow)}\n  h1,h2,h3,h4,h5{font-weight:600;line-height:1.3;letter-spacing:-.005em}\n  h1.chap-num{font-size:16px;color:var(--accent);margin:0 0 4px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}\n  h2.chap-title{font-size:30px;margin:0 0 18px;padding-bottom:10px;border-bottom:2px solid var(--accent);color:var(--ink)}\n  h3.section-h{font-size:21px;margin:30px 0 10px;color:var(--accent)}\n  h4.section-h.sub{font-size:18px;margin:24px 0 8px;color:var(--ink)}\n  h5.section-h.subsub{font-size:16px;margin:20px 0 6px;color:var(--ink-soft);font-style:italic}\n  p{margin:12px 0;text-wrap:pretty}\n  p.fineprint{font-size:13px;color:var(--ink-muted);margin:2px 0}\n  strong{font-weight:600}\n  em{font-style:italic}\n  ul{margin:8px 0 14px;padding-left:24px}\n  ul li{margin:5px 0}\n  blockquote.quote{margin:14px 0 2px;padding:8px 0 8px 18px;border-left:3px solid var(--accent-soft);\n    color:var(--ink-soft);font-size:16px}\n  p.attribution{margin:0 0 14px 18px;color:var(--ink-muted);font-size:14px}\n  p.tbl-caption{margin:18px 0 6px;font-size:14px;font-weight:700;color:var(--accent);\n    font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n\n  aside.outline{margin:14px 0 18px;padding:16px 20px;background:#f1ede2;border:1px solid var(--border-strong);border-radius:10px}\n  aside.outline h5{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);\n    font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n  ul.outline-list{margin:0;padding-left:18px;columns:2;column-gap:28px;font-size:14px;color:var(--ink-soft)}\n  ul.outline-list li{margin:3px 0;break-inside:avoid}\n\n  aside.profile-box,aside.practice-box{margin:18px 0;padding:16px 20px;background:#f7f4ec;\n    border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px}\n  aside.practice-box{border-left-color:#2a6f9a;background:#eef4f8}\n  aside.profile-box h5,aside.practice-box h5{margin:0 0 8px;font-size:14px;font-weight:700;\n    text-transform:uppercase;letter-spacing:.06em;color:var(--accent);\n    font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n  aside.practice-box h5{color:#2a6f9a;text-transform:none;letter-spacing:0;font-size:15px}\n  aside.profile-box p,aside.practice-box p{margin:0}\n\n  figure.ch-img{margin:18px auto;text-align:center}\n  figure.ch-img img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px}\n\n  .saq{margin:14px 0;padding:12px 16px;background:#fafaf6;border:1px solid var(--border);border-radius:8px}\n  .saq-q{margin:0 0 8px}\n  ol.saq-opts{margin:6px 0 2px;padding-left:26px;font-size:16px}\n  ol.saq-opts li{margin:4px 0}\n\n  .table-wrap{overflow-x:auto;margin:8px 0 16px;border:1px solid var(--border);border-radius:10px}\n  table{border-collapse:collapse;width:100%;font-size:15px}\n  table th,table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}\n  table th{background:#f1ede2;font-weight:600}\n  table th:last-child,table td:last-child{border-right:none}\n  table tr:last-child td{border-bottom:none}\n\n  .gap-wrap{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap;margin:0 1px}\n  .gap-input{font:inherit;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n    font-size:.95em;width:13ch;padding:2px 8px;border:none;border-bottom:2px solid var(--accent);\n    background:var(--accent-soft);color:var(--ink);border-radius:4px 4px 0 0;outline:none;transition:all .15s ease}\n  .gap-input:focus{background:#fff;border-bottom-color:var(--accent);box-shadow:0 2px 0 var(--accent)}\n  .gap-input.correct{background:var(--correct-soft);border-bottom-color:var(--correct);color:var(--correct);font-weight:500}\n  .gap-input.wrong{background:var(--wrong-soft);border-bottom-color:var(--wrong);color:var(--wrong);font-weight:500}\n  .gap-input.revealed{background:var(--hint-soft);border-bottom-color:var(--hint);color:var(--hint);font-weight:500;font-style:italic}\n  .gap-num{font-size:.78em;color:var(--ink-muted);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;vertical-align:super}\n  .gap-feedback{display:inline-flex;width:16px;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;font-size:.85em;font-weight:600}\n  .gap-feedback.ok::before{content:\"\\2713\";color:var(--correct)}\n  .gap-feedback.no::before{content:\"\\2717\";color:var(--wrong)}\n  .gap-feedback.show::before{content:\"\\2605\";color:var(--hint)}\n  .summary{display:none;margin:14px 0 8px;padding:12px 16px;background:#f7f4ec;border:1px solid var(--border);\n    border-left:4px solid var(--accent);border-radius:8px;font-size:15px}\n  .summary.show{display:block}\n  .summary strong{color:var(--accent)}\n  @media print{body{background:#fff}.toolbar{display:none}\n    section.chapter{box-shadow:none;border:none;padding:0}\n    .gap-input{background:transparent;border-bottom:1px solid #999}\n    ul.outline-list{columns:2}}\n  @media (max-width:640px){.page{padding:20px 16px 60px}section.chapter{padding:20px 18px}\n    .toolbar{margin:0 -16px 16px;padding:10px 16px}h2.chap-title{font-size:23px}\n    ul.outline-list{columns:1}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"page\">\n  <header class=\"intro\">\n    <p><strong>Gap-Fill Exercise — Chapter 6 Summary<\u002Fstrong><\u002Fp>\n    <p><em>Second Language Development<\u002Fem><\u002Fp>\n    <p><strong>Instructions:<\u002Fstrong> Each numbered gap targets a key word from the chapter. Type the missing word in each input — press Enter or click out to check. Use the toolbar to check all answers, reveal them, or reset.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"toolbar\" role=\"toolbar\" aria-label=\"Exercise controls\">\n    <div class=\"actions\">\n      <button class=\"btn primary\" id=\"btn-check-all\" type=\"button\">Check all answers<\u002Fbutton>\n      <button class=\"btn\" id=\"btn-reveal-all\" type=\"button\">Reveal all<\u002Fbutton>\n      <button class=\"btn ghost\" id=\"btn-reset-all\" type=\"button\">Reset<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"progress\" aria-live=\"polite\">\n      <span id=\"score-text\">0 / 170 correct<\u002Fspan>\n      <span class=\"progress-bar\"><span id=\"score-bar\"><\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"summary-top\" class=\"summary\" role=\"status\" aria-live=\"polite\"><\u002Fdiv>\n\n  <section class=\"chapter\">\n<h1 class=\"chap-num\">Chapter 6<\u002Fh1>\n<h2 class=\"chap-title\">Second Language Development<\u002Fh2>\n<p class=\"fineprint\">Introducing Second Language Acquisition: Perspectives and Practices, First Edition.<\u002Fp>\n<p class=\"fineprint\">Kirsten M. Hummel.<\u002Fp>\n<p class=\"fineprint\">© 2014 John Wiley &amp; Sons, Inc. Published 2014 by John Wiley &amp; Sons, Inc.<\u002Fp>\n<blockquote class=\"quote\">Only by treating language learners’ language as a phenomenon to be studied in its own right can we hope to develop an understanding of the processes of second language acquisition<\u002Fblockquote>\n<p class=\"attribution\">(Corder, 1978, p. 71).<\u002Fp>\n<aside class=\"outline\"><h5>Chapter outline<\u002Fh5><ul class=\"outline-list\"><li>6.0   Chapter overview   138<\u002Fli><li>6.1   Common processes and influences   138<\u002Fli><li>         6.1.1   Cross-linguistic influence (transfer)   138<\u002Fli><li>         6.1.2   Overgeneralization   140<\u002Fli><li>         6.1.3   Markedness   140<\u002Fli><li>         6.1.4   Developmental sequences   141<\u002Fli><li>         6.1.5   Formulaic sequences   141<\u002Fli><li>         6.1.6   Fossilization   143<\u002Fli><li>         6.1.7   Avoidance   144<\u002Fli><li>6.2   L2 development across linguistic sub-areas   144<\u002Fli><li>         6.2.1   Phonology   144<\u002Fli><li>         6.2.2   Vocabulary   147<\u002Fli><li>         6.2.3   Grammatical development   149<\u002Fli><li>                  6.2.3.1   Morphology   149<\u002Fli><li>                  6.2.3.2   Syntax   151<\u002Fli><li>                  6.2.3.3   English L2 question development   153<\u002Fli><li>         6.2.4   Sociolinguistic variation and pragmatics   153<\u002Fli><li>         6.2.5   Reading   156<\u002Fli><li>6.3   Investigating learner language: Language corpora   159<\u002Fli><li>6.4   Summing up   159<\u002Fli><li>Key concepts   160<\u002Fli><li>Self-assessment questions   160<\u002Fli><li>Discussion questions   161<\u002Fli><li>Exercises/Project ideas   162<\u002Fli><li>Further reading and viewing   162<\u002Fli><li>References   163<\u002Fli><\u002Ful><\u002Faside>\n<h3 class=\"section-h\">6.0 chapter overview<\u002Fh3>\n<p>As discussed in Chapter 5, there have been a number of different approaches to teaching a second language. Each approach has tended to emphasize certain characteristics of the L2 learning process. This chapter will describe some of the common processes and influences found in L2 development. We will also examine the various linguistic <span class=\"gap-wrap\" data-gap=\"1\" data-answer=\"subsystems\"><input type=\"text\" class=\"gap-input\" data-gap=\"1\" aria-label=\"Gap 1\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(1)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, such as phonology, vocabulary, grammar, and pragmatics, as well as the reading process, in order to get an overview of how these develop in a second language.<\u002Fp>\n<h3 class=\"section-h\">6.1 common processes and influences<\u002Fh3>\n<p>A number of similar processes and influences appear to <span class=\"gap-wrap\" data-gap=\"2\" data-answer=\"characterize\"><input type=\"text\" class=\"gap-input\" data-gap=\"2\" aria-label=\"Gap 2\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(2)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>second language development. We will look at some of the more <span class=\"gap-wrap\" data-gap=\"3\" data-answer=\"prominent\"><input type=\"text\" class=\"gap-input\" data-gap=\"3\" aria-label=\"Gap 3\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(3)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>of these in this section.<\u002Fp>\n<h4 class=\"section-h sub\">6.1.1 cross-linguistic influence (transfer)<\u002Fh4>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>Walid, the language learner living in Detroit attending heritage language classes, introduced in Chapter 3, occasionally found himself making errors in English that <span class=\"gap-wrap\" data-gap=\"4\" data-answer=\"reflected\"><input type=\"text\" class=\"gap-input\" data-gap=\"4\" aria-label=\"Gap 4\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(4)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> the influence of his native Arabic. For instance, since in Arabic adjectives agree in number with the nouns they modify, he would tend to produce sentences such as: “We called others kids to come.”<\u002Fp><\u002Faside>\n<p>Language transfer has been defined as “. . . the influence resulting from the similarities and differences between the target language and any other language that has been previously (and perhaps imperfectly) acquired” (Odlin, 1989, p. 27). Odlin (2003, p. 437) points out that language transfer “affects all linguistic subsystems including pragmatics and <span class=\"gap-wrap\" data-gap=\"5\" data-answer=\"rhetoric\"><input type=\"text\" class=\"gap-input\" data-gap=\"5\" aria-label=\"Gap 5\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(5)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, semantics, syntax morphology, phonology, phonetics, and orthography.” The contrastive analysis approach highlighted the role of transfer from the L1 to the L2 and pointed out that interference was a major source of errors in the L2 learner’s developing system. Although, as pointed out in Chapter 4, <span class=\"gap-wrap\" data-gap=\"6\" data-answer=\"substantial\"><input type=\"text\" class=\"gap-input\" data-gap=\"6\" aria-label=\"Gap 6\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(6)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>evidence (e.g., Odlin, 1989) has been found that interference is not the only source of errors in the L2, it remains that the L1 inevitably plays a non-negligible role in L2 acquisition. As is the case in other <span class=\"gap-wrap\" data-gap=\"7\" data-answer=\"domains\"><input type=\"text\" class=\"gap-input\" data-gap=\"7\" aria-label=\"Gap 7\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(7)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, prior knowledge is likely to affect learning in a related area. As was pointed out in Chapter 4, the study of effects of transfer between two languages is increasingly referred to as the study of cross-linguistic influence (CLI). Note that CLI can affect comprehension as well as production.<\u002Fp>\n<p>The role the L1 plays may depend on a number of factors, including degree of similarity between the L1 and the target language, whether the L2 learner is at an early or more advanced stage in L2 learning, and degree of literacy in the L1, among other factors. Cross linguistic influence can result in both negative transfer, or interference, or positive transfer, as when a structure is acquired more easily based on influence from the L1.<\u002Fp>\n<p>Studies have revealed that languages that are <span class=\"gap-wrap\" data-gap=\"8\" data-answer=\"typologically\"><input type=\"text\" class=\"gap-input\" data-gap=\"8\" aria-label=\"Gap 8\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(8)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>similar tend to lead to more transfer (e.g., Ringbom, 1987). Prepositions, for instance, have been found to demonstrate cross-linguistic influence. A study by Ijaz (1986) reported that speakers of German and Urdu tended to provide English prepositions resembling the closest <span class=\"gap-wrap\" data-gap=\"9\" data-answer=\"equivalent\"><input type=\"text\" class=\"gap-input\" data-gap=\"9\" aria-label=\"Gap 9\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(9)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>in their native languages in filling in the gaps of test sentences such as “The keys are hanging ___ the hooks.” When they failed to provide the target preposition “on,” the German speakers tended to use “at” (similar to the German “an”), and Urdu speakers tended to choose “with” (similar to the Urdu word equivalent to “with,” which is “say”), <span class=\"gap-wrap\" data-gap=\"10\" data-answer=\"consistent\"><input type=\"text\" class=\"gap-input\" data-gap=\"10\" aria-label=\"Gap 10\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(10)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>with correct responses in their respective native languages. Differences between Swedish (a Germanic language like English) speakers and Finnish (a non-Germanic language) speakers learning English have been signaled in this regard. Researchers (Jarvis &amp; Odlin, 2000) found that Finnish speakers often <span class=\"gap-wrap\" data-gap=\"11\" data-answer=\"omitted\"><input type=\"text\" class=\"gap-input\" data-gap=\"11\" aria-label=\"Gap 11\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(11)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>the preposition in their written descriptions of a silent film, as in “. . . the woman go to sit the grass,” where the preposition “on” preceding “the grass” was omitted, while the Swedish speakers, whose L1 uses prepositions in a manner similar to English, did not omit the preposition. Other studies (e.g., Master, 1987) have found that learners whose L1 includes articles used similarly to the articles a, an, and the in English tend to acquire the English articles faster than learners whose L1 does not include similar articles.<\u002Fp>\n<p>However, there is also evidence that in certain circumstances learners avoid transferring similar structures even where the structures lead to <span class=\"gap-wrap\" data-gap=\"12\" data-answer=\"appropriate\"><input type=\"text\" class=\"gap-input\" data-gap=\"12\" aria-label=\"Gap 12\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(12)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>L2 use and it has been suggested that this may be due to their belief that such structures are unlikely to be transferable between languages (Kellerman, 1979). Transfer between languages is therefore <span class=\"gap-wrap\" data-gap=\"13\" data-answer=\"subject\"><input type=\"text\" class=\"gap-input\" data-gap=\"13\" aria-label=\"Gap 13\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(13)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>to multiple influences and not fully predictable.<\u002Fp>\n<h4 class=\"section-h sub\">6.1.2 overgeneralization<\u002Fh4>\n<p>In addition to the important role played by the learner’s L1, research has revealed that other factors also affect the learner’s developing system. Such factors can be considered as general developmental processes, and tend to be found in L1 acquisition as well. One such influence mentioned in previous chapters is known as overgeneralization and refers to the learner’s <span class=\"gap-wrap\" data-gap=\"14\" data-answer=\"tendency\"><input type=\"text\" class=\"gap-input\" data-gap=\"14\" aria-label=\"Gap 14\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(14)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>to over apply rules of the target language where they are not <span class=\"gap-wrap\" data-gap=\"15\" data-answer=\"warranted\"><input type=\"text\" class=\"gap-input\" data-gap=\"15\" aria-label=\"Gap 15\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(15)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. For example, it is common to find learners of English overapplying the “–ed” past tense marker on verbs that constitute exceptions to the rule, a specific type of overgeneralization that is often <span class=\"gap-wrap\" data-gap=\"16\" data-answer=\"referred\"><input type=\"text\" class=\"gap-input\" data-gap=\"16\" aria-label=\"Gap 16\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(16)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>to as overregularization: “I eated,” rather than “I ate.” Instances of overgeneralizations are indications that learners have <span class=\"gap-wrap\" data-gap=\"17\" data-answer=\"internalized\"><input type=\"text\" class=\"gap-input\" data-gap=\"17\" aria-label=\"Gap 17\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(17)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>certain rules and are applying them even when inappropriate. Such examples also reveal that learners are not merely <span class=\"gap-wrap\" data-gap=\"18\" data-answer=\"imitating\"><input type=\"text\" class=\"gap-input\" data-gap=\"18\" aria-label=\"Gap 18\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(18)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>the input to which they are exposed, as instances such as “eated” would not normally be heard in the environment. Nor is it likely that a form such as “eated” results from L1 influence. Just as learners build from previous knowledge, as when applying rules from their L1, L2 overgeneralization shows that learners also use the knowledge they are acquiring about the target language in their attempts to further develop their <span class=\"gap-wrap\" data-gap=\"19\" data-answer=\"interlanguage\"><input type=\"text\" class=\"gap-input\" data-gap=\"19\" aria-label=\"Gap 19\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(19)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>.<\u002Fp>\n<h4 class=\"section-h sub\">6.1.3 markedness<\u002Fh4>\n<p>Another concept that has been invoked to explain L2 development is that of markedness, the notion that certain features are more natural, frequent, or basic than others across languages, or unmarked, such as voiceless stops (p, t, k), while others are less natural, frequent, or basic across languages, or marked, such as voiced stops (b, d, g). Specific <span class=\"gap-wrap\" data-gap=\"20\" data-answer=\"predictions\"><input type=\"text\" class=\"gap-input\" data-gap=\"20\" aria-label=\"Gap 20\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(20)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>about markedness stem from Eckman’s (1977) Markedness Differential Hypothesis (MDH). In this view, the areas of difficulty that a language learner will have can be predicted on the basis of a systematic comparison of the grammars of the native language, the target language and markedness <span class=\"gap-wrap\" data-gap=\"21\" data-answer=\"relations\"><input type=\"text\" class=\"gap-input\" data-gap=\"21\" aria-label=\"Gap 21\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(21)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, such that (Eckman, 1977, p. 321):<\u002Fp>\n<p>(a) Those areas of the target language which differ from the native language and are more marked than the native language will be difficult.<\u002Fp>\n<p>(b) The relative degree of difficulty of the areas of the target language which are more marked than the native language will correspond to the relative degree of markedness.<\u002Fp>\n<p>(c) Those areas of the target language which are different from the native language, but are not more marked than the native language will not be difficult.<\u002Fp>\n<p>The MDH was formulated to account for weaknesses in the Contrastive Analysis Hypothesis. As discussed in the section on the CAH in Chapter 4, differences in structures between two languages were not found to <span class=\"gap-wrap\" data-gap=\"22\" data-answer=\"systematically\"><input type=\"text\" class=\"gap-input\" data-gap=\"22\" aria-label=\"Gap 22\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(22)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>lead to predictable difficulties. The MDH took into account the notion of markedness to better predict areas of difficulty. This approach stems from <span class=\"gap-wrap\" data-gap=\"23\" data-answer=\"typological\"><input type=\"text\" class=\"gap-input\" data-gap=\"23\" aria-label=\"Gap 23\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(23)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>markedness theory, developed largely by Greenberg (1966).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"b791ed25-61b4-462c-a69f-b16cd0cbde39\" alt=\"image1.png\"><\u002Ffigure>\n<p>In general terms, markedness theory states that if a given language contains a marked structure, it is likely to contain the unmarked equivalent as well. For instance, if a language contains voiced stops (considered more marked), it will also contain voiceless stops (considered unmarked). Markedness theory in L2 development suggests that a learner will find it easier to <span class=\"gap-wrap\" data-gap=\"24\" data-answer=\"acquire\"><input type=\"text\" class=\"gap-input\" data-gap=\"24\" aria-label=\"Gap 24\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(24)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>an unmarked feature than the marked equivalent.<\u002Fp>\n<h4 class=\"section-h sub\">6.1.4 developmental sequences<\u002Fh4>\n<figure class=\"ch-img\"><img src=\"014535c0-185a-4254-b420-dca0e3484609\" alt=\"image2.png\"><\u002Ffigure>\n<p>As we will see later in this chapter in an examination of word order or syntax, another common finding in L2 development is that there are recognizable patterns, or developmental sequences, that learners go through. Long (2011, p. 378) defines developmental sequences as “. . . fixed series of stages in the evolution of grammatical (as well as phonological and semantic) systems and sub-systems, such as the four-stage <span class=\"gap-wrap\" data-gap=\"25\" data-answer=\"sequence\"><input type=\"text\" class=\"gap-input\" data-gap=\"25\" aria-label=\"Gap 25\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(25)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>—No V, don’t V, aux-neg, and analyzed don’t—for negation in ESL.” The preceding pattern of negation development was found in a study of five Spanish learners of ESL (Cancino, Rosansky, &amp; Schumann, 1978). The learners in this study began by adding a “no” before a verb, as in “No go,” similar to how <span class=\"gap-wrap\" data-gap=\"26\" data-answer=\"negation\"><input type=\"text\" class=\"gap-input\" data-gap=\"26\" aria-label=\"Gap 26\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(26)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>is expressed in their L1 Spanish, followed by using “don’t” as a unit (i.e., “don’t” used regardless of person or tense, failing to use, for example, “doesn’t” or “didn’t”) to replace “no.” Most of the learners ultimately reached a stage where they were able to form the negative properly, with <span class=\"gap-wrap\" data-gap=\"27\" data-answer=\"auxiliaries\"><input type=\"text\" class=\"gap-input\" data-gap=\"27\" aria-label=\"Gap 27\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(27)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>and contractions as required grammatically (as in “He didn’t go”). The Cancino et al. study, along with others carried out since, reveals that identifiable developmental sequences appear to <span class=\"gap-wrap\" data-gap=\"28\" data-answer=\"underlie\"><input type=\"text\" class=\"gap-input\" data-gap=\"28\" aria-label=\"Gap 28\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(28)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>L2 development regardless of the learner’s L1, although the L1 does exert some effect. For instance, in the Cancino et al. study, the influence of Spanish may have allowed learners to remain longer in the first stage where the pattern resembles that of the L1. Note that a similar pattern has been found in studies of learning German as an L2 (Eubank, 1990), with the negative form “nein” first appearing at the beginning of a phrase or sentence (“nein gehen Hause” “I’m not going home”).<\u002Fp>\n<h4 class=\"section-h sub\">6.1.5 formulaic sequences<\u002Fh4>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>Linda, the school teacher studying Italian, enjoyed her Italian courses. During her stay in Tuscany, she delighted in speaking Italian as much as possible. Still, she found herself resorting to certain lexicalized routines or <span class=\"gap-wrap\" data-gap=\"29\" data-answer=\"formulaic\"><input type=\"text\" class=\"gap-input\" data-gap=\"29\" aria-label=\"Gap 29\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(29)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> sequences at times when she couldn’t remember the appropriate words or expressions. For instance, she often inserted the phrase “Non so come si dice . . .” (“I don’t know how to say . . .”) before an English word whose Italian equivalent she didn’t know, when she was stuck for a word and wanted some assistance. She found herself using “Non so . . .” (“I don’t know . . .”) productively, in a number of contexts, such as “non so che fare” (“I don’t know what to do”) or “non so dove vado” (“I don’t know where to go”). Another common routine she found herself using was “Va bene” (“I’m fine”) as a response when greeted by an acquaintance or passerby and she didn’t fully understand the greeting or question.<\u002Fp><\u002Faside>\n<p>Just as is the case in L1 acquisition, one way in which new L2 vocabulary and expressions are learned is in the form of what are sometimes referred to as formulaic sequences or language routines, which learners appear to acquire as single <span class=\"gap-wrap\" data-gap=\"30\" data-answer=\"unanalyzed\"><input type=\"text\" class=\"gap-input\" data-gap=\"30\" aria-label=\"Gap 30\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(30)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>units, or ready-made chunks. These appear to serve as “building blocks” in L2 development. A formulaic sequence has been defined by Wray (2000, p. 465) as:<\u002Fp>\n<p>A sequence, continuous or discontinuous, of words or other meaning elements, which is, or appears to be, prefabricated: that is stored and retrieved whole from the memory at the time of use, rather than being subject to generation or analysis by the language grammar.<\u002Fp>\n<p>In a sense, these units may serve to simplify the complex learning task, since a single unit can be used to express a complex thought or idea that otherwise would require more <span class=\"gap-wrap\" data-gap=\"31\" data-answer=\"attentional\"><input type=\"text\" class=\"gap-input\" data-gap=\"31\" aria-label=\"Gap 31\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(31)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>resources. Just as Linda resorted to routines such as “Non so como si dice . . .” on many occasions, L2 learners of English might use phrases such as “I don’t understand,” “Wait a minute,” or “What’s that?” at beginning learning stages, before understanding how to use the <span class=\"gap-wrap\" data-gap=\"32\" data-answer=\"individual\"><input type=\"text\" class=\"gap-input\" data-gap=\"32\" aria-label=\"Gap 32\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(32)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>verbal forms found in those patterns.<\u002Fp>\n<p>In this regard, a longitudinal study of L2 learners of Swedish (Bolander, 1989) found that the adult learners tended to use formulaic expressions that contained language structures that were beyond their current level of <span class=\"gap-wrap\" data-gap=\"33\" data-answer=\"mastery\"><input type=\"text\" class=\"gap-input\" data-gap=\"33\" aria-label=\"Gap 33\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(33)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>of Swedish, as if the units allowed the learners to bootstrap into more complex language. It has been suggested that by using formulaic language, learners ease somewhat the language learning task. Wood (2010, p. 59) points out that formulaic language lightens the “attentional and processing burdens of utterance construction” and enables “fast and <span class=\"gap-wrap\" data-gap=\"34\" data-answer=\"fluid\"><input type=\"text\" class=\"gap-input\" data-gap=\"34\" aria-label=\"Gap 34\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(34)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>communication.” Some studies (Boers, Eyckmans, Kappel, Stengers, &amp; Demecheleer, 2006; McGuire 2009) suggest that increased facility with formulaic language enhances L2 fluency. By acquiring a formulaic sequence, more processing resources can be <span class=\"gap-wrap\" data-gap=\"35\" data-answer=\"devoted\"><input type=\"text\" class=\"gap-input\" data-gap=\"35\" aria-label=\"Gap 35\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(35)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>to learning other linguistic aspects of the target language.<\u002Fp>\n<p>Therefore there is increasing attention being given to the important role played by formulaic language in L2 development. Noting the productivity of a sequence such as “put it in” in English (e.g., “put it in the oven,” “put it in the back,” as well as the related “put it on,” and “put it onto,” etc.), Ellis (2012, p. 37) argues that formulaic sequences are a <span class=\"gap-wrap\" data-gap=\"36\" data-answer=\"pathway\"><input type=\"text\" class=\"gap-input\" data-gap=\"36\" aria-label=\"Gap 36\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(36)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>to L2 development: “Phrsal teddy bears, formulaic phrases with routine functional purposes, play a large part in this experience, and the analysis of their components gives rise to abstract linguistic structure and creativity.”<\u002Fp>\n<p>The Lexical Approach is a teaching approach that attempts to build on learners’ <span class=\"gap-wrap\" data-gap=\"37\" data-answer=\"reliance\"><input type=\"text\" class=\"gap-input\" data-gap=\"37\" aria-label=\"Gap 37\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(37)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>on formulaic expressions.<\u002Fp>\n<aside class=\"practice-box\"><h5>Language learning in practice: The Lexical Approach<\u002Fh5><p>The Lexical Approach, developed by Lewis (e.g., 1997a; 1997b), emphasizes the learning of vocabulary, collocations, and formulaic language in the language classroom, rather than the learning of grammatical rules. Lewis (1997a, p. 260) suggests that “activities that raise conscious awareness of the lexical nature of language and its component <span class=\"gap-wrap\" data-gap=\"38\" data-answer=\"chunks\"><input type=\"text\" class=\"gap-input\" data-gap=\"38\" aria-label=\"Gap 38\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(38)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>can aid acquisition.” This approach gives <span class=\"gap-wrap\" data-gap=\"39\" data-answer=\"priority\"><input type=\"text\" class=\"gap-input\" data-gap=\"39\" aria-label=\"Gap 39\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(39)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>to receptive activities and drawing students’ attention to formulaic language and fixed expressions that are common in spoken English, such as “I’ll get it.”<\u002Fp><\u002Faside>\n<h4 class=\"section-h sub\">6.1.6 fossilization<\u002Fh4>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>Following her immigration from Bosnia, and even after many years living in the US, Mila continued to make certain specific errors in her English. For instance, Mila would say “You can use black cup” or “He reads local newspaper every day” <span class=\"gap-wrap\" data-gap=\"40\" data-answer=\"omitting\"><input type=\"text\" class=\"gap-input\" data-gap=\"40\" aria-label=\"Gap 40\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(40)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> the definite article since articles are generally absent in her native Bosnian.<\u002Fp><\u002Faside>\n<figure class=\"ch-img\"><img src=\"812a6474-2804-4610-9bd7-dd6eaaed004a\" alt=\"image3.png\"><\u002Ffigure>\n<p>Fossilization, a term first coined by Selinker (1972), refers to aspects of the learner’s <span class=\"gap-wrap\" data-gap=\"41\" data-answer=\"interlanguage\"><input type=\"text\" class=\"gap-input\" data-gap=\"41\" aria-label=\"Gap 41\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(41)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>(IL) that appear to “fossilize” or remain permanently <span class=\"gap-wrap\" data-gap=\"42\" data-answer=\"fixed\"><input type=\"text\" class=\"gap-input\" data-gap=\"42\" aria-label=\"Gap 42\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(42)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>as non-native-like structures or sounds, as found in some of Mila’s sentences:<\u002Fp>\n<blockquote class=\"quote\">Fossilizable linguistic phenomena are linguistic items, rules, and subsystems which speakers of a particular L1 tend to keep in their IL relative to a particular TL, no matter what the age of the learner or amount of explanation and instruction he receives in the TL . . . Fossilizable structures tend to remain as potential performance, re-emerging in the productive performance of an IL even when seemingly eradicated.<\u002Fblockquote>\n<p class=\"attribution\">(Selinker, 1972, p. 215)<\u002Fp>\n<p>For example, French or Spanish L1 learners who continue to pluralize a non-count noun in English even after many years of exposure (e.g., “homeworks” instead of “homework”) can be said to have a fossilized form. Similarly, pronunciations that continue to reflect nonnative-like <span class=\"gap-wrap\" data-gap=\"43\" data-answer=\"articulations\"><input type=\"text\" class=\"gap-input\" data-gap=\"43\" aria-label=\"Gap 43\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(43)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, as in pronouncing the English “th” sound as “t” or “z” could be considered as fossilizations. Not all researchers agree that fossilizations should be considered as permanent (see for example, Long, 2003), as there is always the possibility that learners will eventually learn to <span class=\"gap-wrap\" data-gap=\"44\" data-answer=\"incorporate\"><input type=\"text\" class=\"gap-input\" data-gap=\"44\" aria-label=\"Gap 44\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(44)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>the correct, native-like form. Long suggests the alternate term “stabilization.”<\u002Fp>\n<h4 class=\"section-h sub\">6.1.7 avoidance<\u002Fh4>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>Xia Mei, studying English in her immersion program in Hong Kong, felt that she was making good progress. However, there were certain grammatical patterns that proved particularly difficult for her. For instance, she found English relative clauses such as “The girl likes the boy to whom she sent a message” to be a challenge to produce. She found herself avoiding such <span class=\"gap-wrap\" data-gap=\"45\" data-answer=\"patterns\"><input type=\"text\" class=\"gap-input\" data-gap=\"45\" aria-label=\"Gap 45\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(45)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>; instead, she would divide sentences into two parts, resulting in sequences such as: “The girl likes the boy. She sent the boy a message.”<\u002Fp><\u002Faside>\n<p>A common occurrence in L2 development is the learner’s avoiding certain sounds, words, or grammatical structures perceived as difficult or simply not known, as we found in Xia Mei’s case. This is not unique to L2 learning as it is found in L1 acquisition as well. As was pointed out in the previous chapter, one of the limitations of the Error Analysis approach was <span class=\"gap-wrap\" data-gap=\"46\" data-answer=\"precisely\"><input type=\"text\" class=\"gap-input\" data-gap=\"46\" aria-label=\"Gap 46\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(46)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>the fact that a focus on erroneous patterns fails to take into account aspects of the L2 that the learner simply avoids by finding alternative words or paraphrases that <span class=\"gap-wrap\" data-gap=\"47\" data-answer=\"convey\"><input type=\"text\" class=\"gap-input\" data-gap=\"47\" aria-label=\"Gap 47\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(47)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>similar thoughts or messages. Schachter (1974), for example, found that Japanese and Chinese L1 learners of English L2 made fewer errors in using relative clauses than Farsi (spoken in Iran) or Arabic learners, but determined that this was due to the fact that they used them less often. An important factor in this result is the fact that the Chinese and Japanese languages structure relative clauses in a very different manner from English, while Farsi and Arabic relative clauses are structured in a more similar <span class=\"gap-wrap\" data-gap=\"48\" data-answer=\"manner\"><input type=\"text\" class=\"gap-input\" data-gap=\"48\" aria-label=\"Gap 48\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(48)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>.<\u002Fp>\n<h3 class=\"section-h\">6.2 L2 development across linguistic sub-areas<\u002Fh3>\n<p>In this section we will explore how some of the preceding general tendencies and patterns, as well as others, affect specific sub-<span class=\"gap-wrap\" data-gap=\"49\" data-answer=\"areas\"><input type=\"text\" class=\"gap-input\" data-gap=\"49\" aria-label=\"Gap 49\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(49)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of language learning: phonology, vocabulary, grammar, sociolinguistic variation, pragmatics, and reading.<\u002Fp>\n<h4 class=\"section-h sub\">6.2.1 phonology<\u002Fh4>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>Steve, introduced in Chapter 3, found that despite his many years of Mandarin study in the United States, as well as his courses and immersion experience in Beijing, his Mandarin pronunciation left much to be desired. Mandarin has four different tones, and Steve found the tonal system a constant challenge and often made mistakes. Even though he knew he was making <span class=\"gap-wrap\" data-gap=\"50\" data-answer=\"progress\"><input type=\"text\" class=\"gap-input\" data-gap=\"50\" aria-label=\"Gap 50\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(50)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> after several months in Beijing, and felt increasingly able to express ideas in simple sentences, Mandarin pronunciation remained a challenge for him.<\u002Fp><\u002Faside>\n<p>Steve’s predicament is not unusual for the L2 learner of Mandarin or of any other L2 for that matter. Pronunciation is often the area of L2 development that is the most difficult to master for L2 learners. It is also undeniably the most apparent (or audible) indicator of nonnative <span class=\"gap-wrap\" data-gap=\"51\" data-answer=\"command\"><input type=\"text\" class=\"gap-input\" data-gap=\"51\" aria-label=\"Gap 51\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(51)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>of another language, contributing to what is often referred to as a “foreign accent.” As stated by the eminent Russian phonologist Trubetzkoy (1968): “The sounds of the foreign language are given an incorrect phonological interpretation, since they are filtered through the ‘phonological sieve’ of one’s own language.”<\u002Fp>\n<p>Despite the fact that L2 phonology is undeniably the linguistic aspect most immediately revealing of transfer effects from the learner’s L1, universal processes have also been found to play a role. A substantial research <span class=\"gap-wrap\" data-gap=\"52\" data-answer=\"literature\"><input type=\"text\" class=\"gap-input\" data-gap=\"52\" aria-label=\"Gap 52\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(52)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>has examined L2 phonology in terms of pronunciation, in particular with respect to the role of the learner’s age of acquisition. We will examine this specific issue in Chapter 7. However, even without considering age effects, there are numerous studies that shed light on factors that affect L2 pronunciation <span class=\"gap-wrap\" data-gap=\"53\" data-answer=\"acquisition\"><input type=\"text\" class=\"gap-input\" data-gap=\"53\" aria-label=\"Gap 53\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(53)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>.<\u002Fp>\n<p>A first important distinction to make is with regard to perception of L2 speech vs production of L2 sounds. L2 perception tends to be more accurate than L2 production, just as in L1 acquisition. Still, there are a few studies that indicate that learners are able to produce L2 sounds that they have difficulty perceiving correctly. For instance, one study (Sheldon &amp; Strange, 1982) found that Japanese learners of English were better able to <span class=\"gap-wrap\" data-gap=\"54\" data-answer=\"differentiate\"><input type=\"text\" class=\"gap-input\" data-gap=\"54\" aria-label=\"Gap 54\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(54)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>/r/ and /l/ in production than in perception.<\u002Fp>\n<p>It is interesting to note that how L2 sounds are perceived does not <span class=\"gap-wrap\" data-gap=\"55\" data-answer=\"systematically\"><input type=\"text\" class=\"gap-input\" data-gap=\"55\" aria-label=\"Gap 55\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(55)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>translate into how those sounds are produced by the learner. For instance, Nemser (1971) found that while Hungarian learners of English tended to perceive the English th sound (voiceless interdental fricative) as /f/, they tended to produce the voiceless stop /t/ and not /f/ for the target th sound.<\u002Fp>\n<p>One well-known model of speech <span class=\"gap-wrap\" data-gap=\"56\" data-answer=\"perception\"><input type=\"text\" class=\"gap-input\" data-gap=\"56\" aria-label=\"Gap 56\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(56)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>and production is Flege’s (1995) Speech Learning Model (SLM). This model predicts that sounds that are similar between the L1 and L2 will be difficult to both perceive and produce since learners already have created sound categories in their L1, while new sounds that do not already exist in the L1 will be easier for learners to perceive and produce. This model therefore puts much of the burden for nonnative production ability on perception. (We will discuss this model further in Chapter 7.)<\u002Fp>\n<figure class=\"ch-img\"><img src=\"1bd3187e-c32f-4c65-91db-322342cb9157\" alt=\"image4.png\"><\u002Ffigure>\n<p>It is thought that L1 automatic <span class=\"gap-wrap\" data-gap=\"57\" data-answer=\"perception\"><input type=\"text\" class=\"gap-input\" data-gap=\"57\" aria-label=\"Gap 57\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(57)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>processes interfere with the ability to differentiate certain new phonetic contrasts in an L2. While L2 learners may be trained to improve this ability by means of focused tasks and other techniques, L2 phonetic perception is likely to lag behind that for native phonetic contrasts (Strange &amp; Shafer, 2008).<\u002Fp>\n<p>A major question has been to what extent does similarity between sounds in the L1 and L2 affect pronunciation? Numerous studies have investigated L2 speech production by both child and adult learners. Many of these studies show that the learner’s L1 appears to influence the pronunciation of L2 sounds. This occurs at the level of individual sounds, or segments, and also with regard to <span class=\"gap-wrap\" data-gap=\"58\" data-answer=\"suprasegmentals\"><input type=\"text\" class=\"gap-input\" data-gap=\"58\" aria-label=\"Gap 58\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(58)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, or aspects such as intonation <span class=\"gap-wrap\" data-gap=\"59\" data-answer=\"accompanying\"><input type=\"text\" class=\"gap-input\" data-gap=\"59\" aria-label=\"Gap 59\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(59)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>speech. As predicted by Flege’s Speech Learning Model referred to above, research (e.g., Major, 2008) suggests it is actually similar sounds which pose the greatest production problem. For instance, such was the case for English L1 learners of advanced French who were able to produce a new sound French /y/ sound (high rounded vowel produced in the front of the mouth rather than in the back as is the case for English /u/) authentically, but not the /u/ variant that is more similar to the English /u/ (Flege, 1987).<\u002Fp>\n<p>While there are a number of studies that back up this finding, there are exceptions: in another study (Bohn &amp; Flege, 1992) looking at vowels produced by German learners of English, it was found that <span class=\"gap-wrap\" data-gap=\"60\" data-answer=\"superior\"><input type=\"text\" class=\"gap-input\" data-gap=\"60\" aria-label=\"Gap 60\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(60)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>production of dissimilar sounds was not <span class=\"gap-wrap\" data-gap=\"61\" data-answer=\"consistently\"><input type=\"text\" class=\"gap-input\" data-gap=\"61\" aria-label=\"Gap 61\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(61)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>true for all of their participants, as some were actually better at producing similar sounds than dissimilar sounds. Similarly, other studies (e.g., Levy &amp; Strange, 2008) found the French contrast between /u/ and /y/ is poorly detected by English native speakers learning French.<\u002Fp>\n<p>In the introduction to markedness in an earlier section of this chapter, it was mentioned that the theory suggests that unmarked sounds are more easily acquired than marked sounds. In this regard, voicing contrasts (such as “pat” vs “bat”) at the beginning of words are considered relatively <span class=\"gap-wrap\" data-gap=\"62\" data-answer=\"unmarked\"><input type=\"text\" class=\"gap-input\" data-gap=\"62\" aria-label=\"Gap 62\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(62)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, while contrasts at the ends of words are considered more marked. It has been found that English speakers have little problem learning to produce voiceless stops (like “p” or “t”) at the ends of German words as in Rat (advice) and Rad (wheel), both pronounced as [rat], with a voiceless [t] at the end of the word, as English includes both voiceless and voiced stops in word-<span class=\"gap-wrap\" data-gap=\"63\" data-answer=\"final\"><input type=\"text\" class=\"gap-input\" data-gap=\"63\" aria-label=\"Gap 63\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(63)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> position (tap, tab). On the other hand, German learners of English need to learn the more marked contrast between voiceless and voiced stops at the ends of words since their L1 does not contrast these sounds in that position. They therefore tend to have difficulties producing the same <span class=\"gap-wrap\" data-gap=\"64\" data-answer=\"contrast\"><input type=\"text\" class=\"gap-input\" data-gap=\"64\" aria-label=\"Gap 64\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(64)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>at the ends of English words as in tap and tab. Instead, the German learners tend to <span class=\"gap-wrap\" data-gap=\"65\" data-answer=\"devoice\"><input type=\"text\" class=\"gap-input\" data-gap=\"65\" aria-label=\"Gap 65\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(65)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>the final voiced stop to pronounce tap for both words. Similar results have been found for the acquisition of other sounds, with marked units being acquired less easily than their unmarked <span class=\"gap-wrap\" data-gap=\"66\" data-answer=\"equivalents\"><input type=\"text\" class=\"gap-input\" data-gap=\"66\" aria-label=\"Gap 66\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(66)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. There is therefore considerable evidence that markedness is an important factor affecting L2 phonological acquisition.<\u002Fp>\n<p>It is also interesting to note that L2 learners do not follow one unique pattern when faced with learning a new sound or one that is pronounced differently from one in their L1. For instance, some of the strategies employed by an L2 learner include inserting a vowel sound in a consonant <span class=\"gap-wrap\" data-gap=\"67\" data-answer=\"cluster\"><input type=\"text\" class=\"gap-input\" data-gap=\"67\" aria-label=\"Gap 67\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(67)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>or after a word-final consonant (epenthesis), <span class=\"gap-wrap\" data-gap=\"68\" data-answer=\"deletion\"><input type=\"text\" class=\"gap-input\" data-gap=\"68\" aria-label=\"Gap 68\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(68)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, and feature change (for example, devoicing a final stop, as in pronouncing “tab” as “tap”). A study by Broselow, Chen and Wang (1998) found that all three processes played a role in L1 Mandarin learners of English when asked to produce word-final stop consonants (p, t, k, b, d, g): 1) a schwa was inserted after a stop, 2) the stop consonant was deleted, and word-final voiced stops were produced as voiceless.<\u002Fp>\n<h4 class=\"section-h sub\">6.2.2 vocabulary<\u002Fh4>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>Alberto, introduced earlier as a learner in an English–Spanish transitional bilingual education program in California, considered himself to be a fluent speaker of the Spanish he learned at home and in his surrounding community. However, since his exposure to Spanish had been gradually phased out in favor of increasing exposure to English in his bilingual education program, once enrolled at a local community college and taking advanced Spanish courses, Alberto discovered that there were many academic words that he didn’t know in Spanish. But as he spent more time reading specialized texts in Spanish, he found his vocabulary improving.<\u002Fp><\u002Faside>\n<p>In a very real sense, words are vital to the communication process: “Without grammar very little can be conveyed, without vocabulary nothing can be conveyed” (Wilkins, 1972, p. 111). Learning the vocabulary of a language is a very different <span class=\"gap-wrap\" data-gap=\"69\" data-answer=\"endeavor\"><input type=\"text\" class=\"gap-input\" data-gap=\"69\" aria-label=\"Gap 69\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(69)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> from learning the sounds that make up a language. While there is a finite set of sounds that characterize a language, in principle, there is no limit to the number of words that belong to language. Native speakers continue to add words to their vocabularies over their lifespan. As we saw in Alberto’s case, even though he had a good basic command of Spanish growing up in the language, he continued to build his vocabulary when exposed to <span class=\"gap-wrap\" data-gap=\"70\" data-answer=\"specialized\"><input type=\"text\" class=\"gap-input\" data-gap=\"70\" aria-label=\"Gap 70\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(70)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> texts in his community college courses. New words and expressions are constantly coined as new concepts and technological and other developments appear in a given culture.<\u002Fp>\n<p>One challenge associated with vocabulary acquisition from speech input is that the speech <span class=\"gap-wrap\" data-gap=\"71\" data-answer=\"stream\"><input type=\"text\" class=\"gap-input\" data-gap=\"71\" aria-label=\"Gap 71\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(71)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> is continuous, <span class=\"gap-wrap\" data-gap=\"72\" data-answer=\"entailing\"><input type=\"text\" class=\"gap-input\" data-gap=\"72\" aria-label=\"Gap 72\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(72)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> that, for both L1 and L2 vocabulary acquirers, one challenging task is to learn to <span class=\"gap-wrap\" data-gap=\"73\" data-answer=\"segment\"><input type=\"text\" class=\"gap-input\" data-gap=\"73\" aria-label=\"Gap 73\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(73)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> that continuous stream into the proper lexical units and connect them with their appropriate semantic content.<\u002Fp>\n<p>Another challenge for the L2 learner is that any given language consists of a substantial number of words. Estimates of the number of individual words in English range from 400,000 to over 2 million. Goulden, Nation and Read (1990) produced an estimate of word families, or word roots and their most common <span class=\"gap-wrap\" data-gap=\"74\" data-answer=\"derivations\"><input type=\"text\" class=\"gap-input\" data-gap=\"74\" aria-label=\"Gap 74\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(74)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> and inflected forms (for example, a word family based on “skill” would consist of “skill,” “skillfully,” “skilled,” “unskilled,” etc.), and arrived at the figure of 54 000 word families based on entries in Webster’s Third New International Dictionary (1963). On the other hand, estimates of the number of words known by native speakers of English who are university graduates amount to approximately 20 000 word families (Goulden et al., 1990; Nation &amp; Waring, 1997).<\u002Fp>\n<p>Although these estimates of numbers of word families in a given language may seem <span class=\"gap-wrap\" data-gap=\"75\" data-answer=\"overwhelming\"><input type=\"text\" class=\"gap-input\" data-gap=\"75\" aria-label=\"Gap 75\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(75)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to the beginning language learner, the actual number of word families that appear most frequently in everyday conversations and in basic written texts is much lower. Cobb and Horst report (2004, p. 16) that the 1000 most frequent words in English, along with proper nouns, tend to make up about 90% of the running words in spoken conversations and suggest (p. 18) that a minimum vocabulary of approximately 2000 word families in English is necessary to provide understanding of 80% of a given text. On the other hand, Hu and Nation (2000) <span class=\"gap-wrap\" data-gap=\"76\" data-answer=\"determined\"><input type=\"text\" class=\"gap-input\" data-gap=\"76\" aria-label=\"Gap 76\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(76)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> that adequate comprehension of a written text requires knowing as much as 98% of its vocabulary (see also Schmitt, Jiang, &amp; Grabe, 2011) and that level <span class=\"gap-wrap\" data-gap=\"77\" data-answer=\"corresponds\"><input type=\"text\" class=\"gap-input\" data-gap=\"77\" aria-label=\"Gap 77\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(77)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to knowing 8000 to 9000 word families (Nation, 2006).<\u002Fp>\n<p>Reading is one means by which new words are acquired. <span class=\"gap-wrap\" data-gap=\"78\" data-answer=\"Contrary\"><input type=\"text\" class=\"gap-input\" data-gap=\"78\" aria-label=\"Gap 78\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(78)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to earlier beliefs that readers are able to skip many words in a text and still make sense of it, studies of eye movements (for example, Raynor &amp; Balota, 1989) reveal that most words are in fact <span class=\"gap-wrap\" data-gap=\"79\" data-answer=\"fixated\"><input type=\"text\" class=\"gap-input\" data-gap=\"79\" aria-label=\"Gap 79\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(79)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> during reading: approximately 80% of content words and 40% of function words. In addition, between 5% and 20% of content words are fixated more than once during <span class=\"gap-wrap\" data-gap=\"80\" data-answer=\"backtracking\"><input type=\"text\" class=\"gap-input\" data-gap=\"80\" aria-label=\"Gap 80\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(80)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (Schmitt, 2000, p. 47). (We will discuss reading further in Section 6.2.5.)<\u002Fp>\n<p>It has been argued, however, that learning new words from reading <span class=\"gap-wrap\" data-gap=\"81\" data-answer=\"necessitates\"><input type=\"text\" class=\"gap-input\" data-gap=\"81\" aria-label=\"Gap 81\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(81)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> knowing already a substantial number of words in a given text. Nation (2001) suggests that the rate of known to unknown words necessary to enable understanding and the acquisition of a new word is 20 to 1, so that at least 95% of words would need to be known to <span class=\"gap-wrap\" data-gap=\"82\" data-answer=\"enable\"><input type=\"text\" class=\"gap-input\" data-gap=\"82\" aria-label=\"Gap 82\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(82)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> one to learn a new word from a written context.<\u002Fp>\n<p>An important distinction is between receptive knowledge of L2 vocabulary and productive knowledge. Generally, a learner’s receptive knowledge is larger than his/her productive knowledge. The general tendency is for words to be first learned <span class=\"gap-wrap\" data-gap=\"83\" data-answer=\"receptively\"><input type=\"text\" class=\"gap-input\" data-gap=\"83\" aria-label=\"Gap 83\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(83)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, i.e., recognized when the learner is exposed to the word in speech or in writing, and later on the learner becomes able to actively produce the word. Productive learning has been found to take more time than <span class=\"gap-wrap\" data-gap=\"84\" data-answer=\"receptive\"><input type=\"text\" class=\"gap-input\" data-gap=\"84\" aria-label=\"Gap 84\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(84)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> learning and generally results in faster forgetting, or decay (Waring, 1997).<\u002Fp>\n<p>For the beginning L2 learner, learning the L2 vocabulary may seem to be an insurmountable task, but at the same time, learning a word that allows the L2 learner to express an idea or communicate a need can be a source of <span class=\"gap-wrap\" data-gap=\"85\" data-answer=\"immediate\"><input type=\"text\" class=\"gap-input\" data-gap=\"85\" aria-label=\"Gap 85\" aut
