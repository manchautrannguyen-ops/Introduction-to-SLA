  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Gap-Fill Exercise — Chapter 7: The Age Factor<\u002Ftitle>\n\n<style>\n  :root { --bg:#f8f6f1; --surface:#fff; --ink:#1f1f1f; --ink-soft:#555; --ink-muted:#7a7a7a;\n    --border:#e5e2d8; --border-strong:#d6d2c5; --accent:#b85c2c; --accent-soft:#fbeee5;\n    --correct:#1f8a5b; --correct-soft:#e6f5ed; --wrong:#c43d3d; --wrong-soft:#fbeaea;\n    --hint:#8a6d2c; --hint-soft:#fbf4dc;\n    --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04); }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);\n    font-family:\"Charter\",\"Iowan Old Style\",\"Source Serif Pro\",Georgia,\"Times New Roman\",serif;\n    font-size:17px;line-height:1.65}\n  .page{max-width:880px;margin:0 auto;padding:40px 28px 80px}\n  header.intro{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}\n  header.intro p{margin:6px 0;color:var(--ink-soft);font-size:15px}\n  .toolbar{position:sticky;top:0;z-index:20;background:rgba(248,246,241,.92);\n    backdrop-filter:saturate(140%) blur(8px);-webkit-backdrop-filter:saturate(140%) blur(8px);\n    margin:0 -28px 24px;padding:12px 28px;border-bottom:1px solid var(--border);\n    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n  .toolbar .actions{display:flex;flex-wrap:wrap;gap:8px}\n  .toolbar .progress{font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:12px}\n  .progress-bar{width:140px;height:6px;background:var(--border);border-radius:999px;overflow:hidden}\n  .progress-bar>span{display:block;height:100%;width:0%;background:var(--accent);transition:width .3s ease}\n  button.btn{font:inherit;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n    padding:7px 14px;border-radius:8px;border:1px solid var(--border-strong);\n    backg transform:uppercase;letter-spacing:.08em;color:var(--accent);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n  ul.outline-list{margin:0;padding-left:18px;columns:2;column-gap:28px;font-size:14px;color:var(--ink-soft)}\n  ul.outline-list li{margin:3px 0;break-inside:avoid}\n  aside.practice-box{margin:18px 0;padding:16px 20px;background:#eef4f8;border:1px solid var(--border);border-left:4px solid #2a6f9a;border-radius:8px}\n  aside.practice-box h5{margin:0 0 8px;font-size:15px;font-weight:700;color:#2a6f9a;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n  aside.practice-box p{margin:0 0 10px}\n  aside.practice-box p:last-child{margin-bottom:0}\n  figure.ch-img{margin:18px auto;text-align:center}\n  figure.ch-img img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px}\n  .saq{margin:14px 0;padding:12px 16px;background:#fafaf6;border:1px solid var(--border);border-radius:8px}\n  .saq-q{margin:0 0 8px}\n  ol.saq-opts{margin:6px 0 2px;padding-left:26px;font-size:16px}\n  ol.saq-opts li{margin:4px 0}\n  .table-wrap{overflow-x:auto;margin:8px 0 16px;border:1px solid var(--border);border-radius:10px}\n  table{border-collapse:collapse;width:100%;font-size:14px}\n  table th,table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}\n  table th{background:#f1ede2;font-weight:600}\n  table th:last-child,table td:last-child{border-right:none}\n  table tr:last-child td{border-bottom:none}\n  .gap-wrap{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap;margin:0 1px}\n  .gap-input{font:inherit;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n    font-size:.95em;width:13ch;padding:2px 8px;border:none;border-bottom:2px solid var(--accent);\n    background:var(--accent-soft);color:var(--ink);border-radius:4px 4px 0 0;outline:none;transition:all .15s ease}\n  .gap-input:focus{background:#fff;border-bottom-color:var(--accent);box-shadow:0 2px 0 var(--accent)}\n  .gap-input.correct{background:var(--correct-soft);border-bottom-color:var(--correct);color:var(--correct);font-weight:500}\n  .gap-input.wrong{background:var(--wrong-soft);border-bottom-color:var(--wrong);color:var(--wrong);font-weight:500}\n  .gap-input.revealed{background:var(--hint-soft);border-bottom-color:var(--hint);color:var(--hint);font-weight:500;font-style:italic}\n  .gap-num{font-size:.78em;color:var(--ink-muted);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;vertical-align:super}\n  .gap-feedback{display:inline-flex;width:16px;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;font-size:.85em;font-weight:600}\n  .gap-feedback.ok::before{content:\"\\2713\";color:var(--correct)}\n  .gap-feedback.no::before{content:\"\\2717\";color:var(--wrong)}\n  .gap-feedback.show::before{content:\"\\2605\";color:var(--hint)}\n  .summary{display:none;margin:14px 0 8px;padding:12px 16px;background:#f7f4ec;border:1px solid var(--border);\n    border-left:4px solid var(--accent);border-radius:8px;font-size:15px}\n  .summary.show{display:block}\n  .summary strong{color:var(--accent)}\n  @media print{body{background:#fff}.toolbar{display:none}\n    section.chapter{box-shadow:none;border:none;padding:0}\n    .gap-input{background:transparent;border-bottom:1px solid #999}}\n  @media (max-width:640px){.page{padding:20px 16px 60px}section.chapter{padding:20px 18px}\n    .toolbar{margin:0 -16px 16px;padding:10px 16px}h2.chap-title{font-size:23px}\n    ul.outline-list{columns:1}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"page\">\n  <header class=\"intro\">\n    <p><strong>Gap-Fill Exercise — Chapter 7 Summary<\u002Fstrong><\u002Fp>\n    <p><em>The Age Factor<\u002Fem><\u002Fp>\n    <p><strong>Instructions:<\u002Fstrong> Each numbered gap targets a key word from the chapter. Type the missing word in each input — press Enter or click out to check. Use the toolbar to check all answers, reveal them, or reset.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"toolbar\" role=\"toolbar\" aria-label=\"Exercise controls\">\n    <div class=\"actions\">\n      <button class=\"btn primary\" id=\"btn-check-all\" type=\"button\">Check all answers<\u002Fbutton>\n      <button class=\"btn\" id=\"btn-reveal-all\" type=\"button\">Reveal all<\u002Fbutton>\n      <button class=\"btn ghost\" id=\"btn-reset-all\" type=\"button\">Reset<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"progress\" aria-live=\"polite\">\n      <span id=\"score-text\">0 / 51 correct<\u002Fspan>\n      <span class=\"progress-bar\"><span id=\"score-bar\"><\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"summary-top\" class=\"summary\" role=\"status\" aria-live=\"polite\"><\u002Fdiv>\n\n  <section class=\"chapter\">\n<h1 class=\"chap-num\">Chapter 7<\u002Fh1>\n<h2 class=\"chap-title\">The Age Factor<\u002Fh2>\n<p class=\"fineprint\">Introducing Second Language Acquisition: Perspectives and Practices, First Edition.<\u002Fp>\n<p class=\"fineprint\">Kirsten M. Hummel.<\u002Fp>\n<p class=\"fineprint\">© 2014 John Wiley &amp; Sons, Inc. Published 2014 by John Wiley &amp; Sons, Inc.<\u002Fp>\n<blockquote class=\"epigraph\">The accent of one’s birthplace remains in the mind and in the heart as in one’s speech.<\u002Fblockquote>\n<p class=\"epigraph-attr\">— François de la Rochefoucauld (1613–1680)<\u002Fp>\n<aside class=\"outline\"><h5>Chapter outline<\u002Fh5><ul class=\"outline-list\"><li>7.0   Chapter overview   170<\u002Fli><li>7.1   The Critical Period Hypothesis   170<\u002Fli><li>7.2   Abnormal instances: Children raised in isolation   173<\u002Fli><li>7.3   Empirical studies   174<\u002Fli><li>7.4   Exceptional cases   184<\u002Fli><li>7.5   Summing up   185<\u002Fli><li>Key concepts   186<\u002Fli><li>Self-assessment questions   186<\u002Fli><li>Discussion questions   187<\u002Fli><li>Exercises/Project ideas   188<\u002Fli><li>Further reading and viewing   188<\u002Fli><li>References   189<\u002Fli><\u002Ful><\u002Faside>\n<h3 class=\"section-h\">7.0 chapter overview<\u002Fh3>\n<p>One of the most intriguing and hotly debated issues in second language learning revolves around the issue of the role of age in acquiring an L2. It is widely believed that the earlier one begins to learn an L2, the more progress one will ultimately make. Similarly, it is often expected that beyond a certain starting age, native-like proficiency cannot be attained. In this chapter we will examine the role that age has been found to play in L2 learning and will attempt to <span class=\"gap-wrap\" data-gap=\"1\" data-answer=\"synthesize\"><input type=\"text\" class=\"gap-input\" data-gap=\"1\" aria-label=\"Gap 1\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(1)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> results from the many studies that have been carried out examining this issue.<\u002Fp>\n<h3 class=\"section-h\">7.1 the Critical Period Hypothesis<\u002Fh3>\n<p>Discussions about the role of age in SLA commonly refer to the notion of a critical period. A critical period is a period of time during which certain behaviors or skills appear to be acquired with particular speed and ease, and without <span class=\"gap-wrap\" data-gap=\"2\" data-answer=\"external\"><input type=\"text\" class=\"gap-input\" data-gap=\"2\" aria-label=\"Gap 2\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(2)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> intervention. The notion of a critical period for learning certain behaviors has been attested in a number of species and is associated with imprinting. Imprinting refers to the rapid learning occurring in a young animal which begins to pattern its behavior on an adult model. In some cases animals have been found to imprint on a human in the environment. For instance, ducklings have been found to follow a moving object (including humans) that appears in their field of vision during a period of approximately 9 to 21 hours after they hatch (see figure 7.1).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"70227478-ddb3-470b-ad5a-548a3614f78a\" alt=\"image1.png\"><\u002Ffigure>\n<p>There are some who suggest a distinction between a “critical period” and a “sensitive period.” A sensitive period is considered more general, suggesting that experiences have an effect on the brain, and this effect is especially strong during a limited period of development. A critical period is a special category of sensitive periods, resulting from <span class=\"gap-wrap\" data-gap=\"3\" data-answer=\"irreversible\"><input type=\"text\" class=\"gap-input\" data-gap=\"3\" aria-label=\"Gap 3\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(3)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> changes in the brain (Knudsen, 2004).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"dcf70bb8-ed93-4ceb-86cc-1a121dfc40b5\" alt=\"image2.png\"><\u002Ffigure>\n<p>The view that a critical period characterizes language acquisition is known as the Critical Period Hypothesis (CPH). The neuroscientists Wilder Penfield and Lamar Roberts (1959) are generally acknowledged as first proposing a “critical period” for language acquisition. They set the end of the critical period at around nine years of age, suggesting this was due to a general “<span class=\"gap-wrap\" data-gap=\"4\" data-answer=\"cognitive\"><input type=\"text\" class=\"gap-input\" data-gap=\"4\" aria-label=\"Gap 4\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(4)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> inflexibility” or loss of brain plasticity that sets in around that age.<\u002Fp>\n<p>Eric Lenneberg (1967) is usually credited with drawing substantial attention to the CPH with regard to first language acquisition in his book, Biological Foundations of Language. Lenneberg (1967, p. 176) also made <span class=\"gap-wrap\" data-gap=\"5\" data-answer=\"reference\"><input type=\"text\" class=\"gap-input\" data-gap=\"5\" aria-label=\"Gap 5\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(5)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to effects of age on second language acquisition:<\u002Fp>\n<p>Automatic acquisition from mere exposure to a given language seems to disappear [after puberty], and foreign languages have to be taught and learned through a conscious and labored effort. Foreign accents cannot be overcome easily after puberty. Moreover, a person can learn to communicate in a foreign language at the age of forty. This does not trouble our basic hypothesis . . .<\u002Fp>\n<p>Lenneberg set the onset of the “critical period” at approximately two years of age, and the end at puberty, or around 13 years of age, based on <span class=\"gap-wrap\" data-gap=\"6\" data-answer=\"neurological\"><input type=\"text\" class=\"gap-input\" data-gap=\"6\" aria-label=\"Gap 6\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(6)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> and clinical evidence.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"ad31b26f-bfbc-4ade-a983-23d00dbcda28\" alt=\"image3.png\"><\u002Ffigure>\n<p>In more recent years, David Birdsong described the CPH in the following manner (1999, p. 1):<\u002Fp>\n<p>. . . the CPH states that there is a limited developmental period during which it is possible to acquire a language, be it L1 or L2, to normal, nativelike levels. Once this window of opportunity is passed, however, the ability to learn language declines.<\u002Fp>\n<p>As a number of researchers have pointed out (e.g., Long, 1993), the notion of the critical period does not <span class=\"gap-wrap\" data-gap=\"7\" data-answer=\"stipulate\"><input type=\"text\" class=\"gap-input\" data-gap=\"7\" aria-label=\"Gap 7\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(7)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> that adult learners cannot reach very high levels of L2 proficiency; rather, it predicts that beyond a certain age, learners cannot reach native speaker levels of proficiency.<\u002Fp>\n<p>There have been a number of proposed explanations for the notion of a critical period in second language acquisition. Lenneberg (1967) proposed that the cause of the change was the brain’s cerebral lateralization, a process in which a number of cognitive activities become localized on one or the other of the brain’s two hemispheres. Language functions become lateralized to the left <span class=\"gap-wrap\" data-gap=\"8\" data-answer=\"hemisphere\"><input type=\"text\" class=\"gap-input\" data-gap=\"8\" aria-label=\"Gap 8\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(8)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of the brain in most individuals. Lenneberg associated lateralization of the brain, which he believed began at around 2 years of age and was completed around the age of puberty, with the critical period timeframe. However, other researchers have argued (e.g., Krashen, 1973) that lateralization appears to be completed much earlier than puberty.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"b84bf13c-b098-4bec-bd74-dcd0c91b9c4d\" alt=\"image4.png\"><\u002Ffigure>\n<p>Another view considers that language acquisition skill is genetically based and once it has been used in the acquisition of a first language it is lost, since it <span class=\"gap-wrap\" data-gap=\"9\" data-answer=\"constitutes\"><input type=\"text\" class=\"gap-input\" data-gap=\"9\" aria-label=\"Gap 9\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(9)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> an unnecessary burden. According to Steven Pinker (1994, p. 294): “Language-acquisition circuitry is not needed once it has been used; it should be dismantled if keeping it around incurs any costs.”<\u002Fp>\n<p>A slightly different <span class=\"gap-wrap\" data-gap=\"10\" data-answer=\"perspective\"><input type=\"text\" class=\"gap-input\" data-gap=\"10\" aria-label=\"Gap 10\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(10)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> suggests that if the language acquisition skill is not used or exercised, it is lost. Thomas Bever (1981), for instance, suggested that early L2 acquisition aids in keeping the acquisition skill intact. According to Bever (1981, p. 194):<\u002Fp>\n<p>So long as one is continually learning a new language the systems of production and perception never become fully autonomous, and closed off from each other. That is, continuous acquisition can stave off the independence of the systems, and therefore delay the apparent critical period.<\u002Fp>\n<p>Yet another view, considered from a connectionist framework, is that learning itself constitutes an impediment to further learning. Elman et al. (1996, p. 70) suggest: “. . . the ability to learn may change over time—not as a function of any explicit change in the <span class=\"gap-wrap\" data-gap=\"11\" data-answer=\"mechanism\"><input type=\"text\" class=\"gap-input\" data-gap=\"11\" aria-label=\"Gap 11\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(11)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, but rather as an intrinsic consequence of learning itself.”<\u002Fp>\n<p>Elissa Newport (e.g., Newport, 1988) suggested the “less is more” hypothesis. This view proposes that children’s more limited cognitive resources entail that they focus on smaller parts of input, which benefits them since this forces a child to attend to the small linguistic units like <span class=\"gap-wrap\" data-gap=\"12\" data-answer=\"morphemes\"><input type=\"text\" class=\"gap-input\" data-gap=\"12\" aria-label=\"Gap 12\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(12)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> or words that carry meaning. In contrast, adults, due to their more developed cognition, tend to store larger, more complex units of input, which ultimately cannot be registered as accurately.<\u002Fp>\n<p>Not all researchers adhere to the CPH to explain L2–L1 differences. As was briefly mentioned in Chapter 6, James Flege, a researcher who has carried out numerous studies on L2 perception and production issues, offered what he terms the “speech learning model” (SLM) to explain L2 perception and production and why these may diverge from native speaker performance (Flege, 1995). The SLM suggests that mechanisms underlying L1 acquisition remain intact in L2 learning, but that a number of factors affect L2 learning success. These factors include quality and quantity of L2 input, and continued exposure to the L1, among others. Flege points out that from the ages of five to seven, phonological categories appear to stabilize in the L1, which has important <span class=\"gap-wrap\" data-gap=\"13\" data-answer=\"repercussions\"><input type=\"text\" class=\"gap-input\" data-gap=\"13\" aria-label=\"Gap 13\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(13)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> on the creation of new phonological categories in the L2. One of the hypotheses he proposes from his model is that the greater the perceived dissimilarity of an L2 sound from the closest L1 sound, the more likely a new category will be formed for the L2 sound. The prediction is therefore that sounds that appear most different from the L1 of the speaker will be treated as new and different, while sounds perceived as similar to L1 sounds will be interpreted as falling into the same sound category as that L1 sound. Thus, when a category is not formed for an L2 sound because it is too similar to an L1 counterpart, the L1 and L2 categories will assimilate, leading to a “merged” L1–L2 category, and divergence from native-like production standards. For example, the English L1 learner of Spanish or French, will tend to pronounce certain consonantal sounds, such as p, t, k, as they are pronounced in English, ignoring the subtle differences in their L2 articulation.<\u002Fp>\n<h3 class=\"section-h\">7.2 abnormal instances: children raised in isolation<\u002Fh3>\n<p>There have been a number of instances that cast some light on the notion of a critical period for language acquisition, in particular for L1 acquisition. These consist of cases in which young children have been isolated from a “normal” environment, with little or no exposure to the language of their <span class=\"gap-wrap\" data-gap=\"14\" data-answer=\"surroundings\"><input type=\"text\" class=\"gap-input\" data-gap=\"14\" aria-label=\"Gap 14\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(14)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. The term feral child is sometimes used to refer to these cases.<\u002Fp>\n<p>In 1797, a young boy around 12 years of age emerged from the forest in Aveyron, France. It was determined that he had somehow been abandoned as a young child and there was speculation that he had been raised by wolves. Despite concerted efforts to teach the child, named Victor, it was reported that he was unable to learn to speak. (The film The Wild Child by the renowned French film director, François Truffaut, is a <span class=\"gap-wrap\" data-gap=\"15\" data-answer=\"fictionalized\"><input type=\"text\" class=\"gap-input\" data-gap=\"15\" aria-label=\"Gap 15\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(15)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> documentary of his life.) However, it is uncertain to what extent psychological and emotional trauma may have led to cognitive effects impairing his ability to learn to speak. There have also been speculations that Victor manifested signs of autism which could also explain his lack of progress in acquiring speech.<\u002Fp>\n<p>One of the most infamous instances of a child removed from normal language exposure in recent history is the case of Genie (not her real name), a young girl found in 1970 at the age of 13 in a Los Angeles suburb. She had been kept in a small room, tied to a potty chair, reportedly between the ages of 18 months and close to 14 years. Once freed from her captivity, she received psychological support and eventually linguists attempted to teach her English, with limited success. While she was able to acquire some vocabulary, and <span class=\"gap-wrap\" data-gap=\"16\" data-answer=\"replicate\"><input type=\"text\" class=\"gap-input\" data-gap=\"16\" aria-label=\"Gap 16\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(16)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> basic word order patterns, her grasp of syntax and morphology remained weak and her production of sentences remained basically telegraphic (“eat cookie”).<\u002Fp>\n<p>While Genie’s lack of progress has been cited in support of the CPH, it has also been pointed out that complicating factors are psychological and cognitive deficits that she may have experienced due to her traumatic early childhood experiences. No one can say with certitude that her lack of linguistic success is due solely to lack of exposure to language in the crucial early years. One speculation is that her left hemisphere atrophied and was unable to be used for the <span class=\"gap-wrap\" data-gap=\"17\" data-answer=\"critical\"><input type=\"text\" class=\"gap-input\" data-gap=\"17\" aria-label=\"Gap 17\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(17)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> grammatical functions it normally oversees.<\u002Fp>\n<aside class=\"practice-box\"><h5>Language learning in practice: Reflections on Genie’s case<\u002Fh5><p>In Rymer’s absorbing account of the attempts to study and rehabilitate Genie, he reports (1994, p. 220) his final emotional interview with Susan Curtiss, the linguist who was most closely involved in investigating her language progress, who became very attached to Genie but was not allowed to see her later on for legal reasons. Curtiss says:<\u002Fp><p>“What is it that language can do for a person? It allows us to cognize, to think and that’s important to me, because I’m that type of person. It also allows us to share ourselves with others—our ideas and thoughts. And that provides a huge part of what I consider to be human in my <span class=\"gap-wrap\" data-gap=\"18\" data-answer=\"existence\"><input type=\"text\" class=\"gap-input\" data-gap=\"18\" aria-label=\"Gap 18\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(18)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. Genie learned how to encode concepts through words. She learned language as a tool: she could label things, ideas, emotions. It afforded her a completely new way to interact with her world. If I had to choose the pieces of language that would serve me best in being human, they would be the parts Genie had. It was from her we learned of her past. She told us of her feelings. She shared her heart and mind. From that perspective, who cares about grammar?”<\u002Fp><\u002Faside>\n<h3 class=\"section-h\">7.3 empirical studies<\u002Fh3>\n<p>Walid, the heritage language learner living in a suburb of Detroit, Michigan, who was introduced in Chapter 3, grew up interacting with his parents and relatives in Arabic. Although most of his schooling was in English, he maintained strong oral fluency in the Arabic dialect that was spoken in his home and community. When Walid took an occasional trip to visit relatives still living in Lebanon, he wasn’t generally singled out as having grown up outside the country; he was able to “pass” as a native Arabic speaker. At the same time, when he spoke English at school or in other situations, his speech was <span class=\"gap-wrap\" data-gap=\"19\" data-answer=\"native\"><input type=\"text\" class=\"gap-input\" data-gap=\"19\" aria-label=\"Gap 19\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(19)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>-like, similar to those of his peers raised in English L1 homes.<\u002Fp>\n<p>Mila’s sons, Mirko and Dragan, who had moved along with their mother to the US from Eastern Europe in their teen years, continued to speak their L1, Bosnian, with a native-like accent. On the other hand, they spoke English with a <span class=\"gap-wrap\" data-gap=\"20\" data-answer=\"noticeable\"><input type=\"text\" class=\"gap-input\" data-gap=\"20\" aria-label=\"Gap 20\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(20)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> foreign accent, even after many years of residence in the US. Interestingly, some of the younger members of their Bosnian expatriate community who had immigrated before their teen years, were able to pass as native speakers, with no detectable trace of accent in their English.<\u002Fp>\n<p>The linguistic area that has received the most attention in terms of the CPH and the area in which it is widely recognized that CPH effects are most notable, is that of L2 pronunciation, or phonology. What appears to be widely <span class=\"gap-wrap\" data-gap=\"21\" data-answer=\"acknowledged\"><input type=\"text\" class=\"gap-input\" data-gap=\"21\" aria-label=\"Gap 21\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(21)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> is that individuals who begin learning a second language after early childhood are characterized by a detectable non-native-like accent in their second language. On the other hand, individuals like Walid, who are exposed to another language throughout early childhood, generally grow up having no detectable accent in either language.<\u002Fp>\n<p>While it is in speech patterns that the proposed critical period appears to have the strongest effects, other linguistic aspects, such as grammatical ability, have also been cited. In addition, it is generally acknowledged that there may be different age limits associated with different aspects of language acquisition, such as pronunciation and grammatical ability. Note that vocabulary acquisition is one linguistic area that appears to be relatively <span class=\"gap-wrap\" data-gap=\"22\" data-answer=\"immune\"><input type=\"text\" class=\"gap-input\" data-gap=\"22\" aria-label=\"Gap 22\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(22)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to age of acquisition effects.<\u002Fp>\n<p>One of the earliest studies to test the notion of a critical period with regard to pronunciation is a study by Susan Oyama (1976). Oyama examined the effect of early <span class=\"gap-wrap\" data-gap=\"23\" data-answer=\"immigration\"><input type=\"text\" class=\"gap-input\" data-gap=\"23\" aria-label=\"Gap 23\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(23)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to the L2 environment, by testing 60 Italian immigrants living in the US.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"a08ad699-959c-4dd9-95da-c51fa1bd9f90\" alt=\"image5.png\"><\u002Ffigure>\n<p>One important distinction that must be made in studies that examine the effect of age on SLA is with regard to the age of exposure to the target language environment. Some studies refer to age of arrival (AoA) while others refer to age of onset (AO). This distinction is sometimes important, since the age at which a given individual arrives in another country is not necessarily the age when he or she begins to receive intensive exposure to a new language. For various reasons, immigrants might remain largely <span class=\"gap-wrap\" data-gap=\"24\" data-answer=\"immersed\"><input type=\"text\" class=\"gap-input\" data-gap=\"24\" aria-label=\"Gap 24\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(24)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in their native language community and have few if any opportunities to learn the language of their new community. AO is therefore sometimes preferred as the index to measure the true beginning of substantial exposure to a new language. In other studies, AoA and AO are considered one and the same. Another important consideration is length of residence (LOR) in the target language environment.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"8932261a-3a01-4e2d-bdca-1f8b93f9a03b\" alt=\"image6.png\"><\u002Ffigure>\n<p>The AoA of participants in the Oyama study was between 6 and 20 years of age and their LOR varied between 5 and 18 years of age. The testing measures consisted of pronunciation evaluated from participants’ reading of short texts as well as their telling of an anecdote. The results revealed an effect for age of arrival: the youngest immigrants (AoA between 6 and 10 years of age) performed as well as native speakers. Those who arrived after 12 years of age had a <span class=\"gap-wrap\" data-gap=\"25\" data-answer=\"detectable\"><input type=\"text\" class=\"gap-input\" data-gap=\"25\" aria-label=\"Gap 25\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(25)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> accent. The study also revealed that there was no effect for number of years of residence in the country.<\u002Fp>\n<p>Another early study that tested the <span class=\"gap-wrap\" data-gap=\"26\" data-answer=\"critical\"><input type=\"text\" class=\"gap-input\" data-gap=\"26\" aria-label=\"Gap 26\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(26)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> period was one conducted by Catherine Snow and Marian Hoefnagel-Höhle (1978). This study examined English native speakers who were living in the Netherlands and were studying Dutch. They tested three different age groups of 96 learners: adults, adolescents (12–15 years old), and young children (8–10 years of age).<\u002Fp>\n<p>In the Snow and Hoefnagel-Höhle study, the learners were given a variety of tests concerning L2 pronunciation, but they were also tested on other aspects of linguistic skill: <span class=\"gap-wrap\" data-gap=\"27\" data-answer=\"morphology\"><input type=\"text\" class=\"gap-input\" data-gap=\"27\" aria-label=\"Gap 27\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(27)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, imitation, and translation. Participants were tested at three different times: after three months, after six months and after 9–10 months of residence in the Netherlands. The results revealed that the adolescents and adults performed better than the young children after three months. However, they found that the children caught up with the other two age groups on a number of the tests after the 10-month testing.<\u002Fp>\n<p>One explanation for the children’s poorer results on early testing is that a number of the tests required a certain level of metalinguistic knowledge which they lacked. Adolescents and especially adults are more cognitively advanced and certainly had more experience in performing on tests requiring some <span class=\"gap-wrap\" data-gap=\"28\" data-answer=\"metalinguistic\"><input type=\"text\" class=\"gap-input\" data-gap=\"28\" aria-label=\"Gap 28\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(28)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> skill. Nevertheless, the results appear to indicate that although adolescents and adults may experience higher proficiency gains after short periods, over the long term, in this case, a 10-month period, children catch up and may even surpass L2 proficiency levels of older learners on some tests. These results point to the importance of distinguishing between speed of learning (the aspect on which the adults excelled on many tasks) and ultimate attainment (where the children excelled).<\u002Fp>\n<p>A more recent study (Flege, Munro, &amp; Mackay, 1995) looked at the pronunciation of 240 Italian immigrants to Ontario, Canada, compared to a control group of 24 native speakers of English. The LOR of participants was 15 years or more. The pronunciation task consisted of five simple sentences in English, such as “The red book was good.” Native speaker evaluators were asked to decide whether they detected a foreign accent or not. The results revealed there was no clear threshold for AoA and no abrupt age when performance became decidedly less native-like; rather, there was a gradual <span class=\"gap-wrap\" data-gap=\"29\" data-answer=\"deterioration\"><input type=\"text\" class=\"gap-input\" data-gap=\"29\" aria-label=\"Gap 29\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(29)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> across time (see figure 7.2).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"08ae2d85-30e3-4fba-806a-eeef8e96b646\" alt=\"image7.png\"><\u002Ffigure>\n<aside class=\"practice-box\"><h5>Language learning in practice: The rule of input<\u002Fh5><p>In a keynote address at a recent conference, James Flege (Flege, 2012) reported that he and his colleague Ian Mackay went back to rerecord 160 of the original 240 Italian immigrants in the 1995 study (Flege, Munro, &amp; Mackay, 1995). They found that around one-third of the participants appeared to have regressed in terms of their pronunciation, while approximately 14% slightly improved. To further study these differences, they looked at how much English use was reported by participants and found that those who had used more English with native speakers over the years were those who showed the most improvement in pronunciation of certain consonants that are clear giveaways of non-native-like pronunciation when <span class=\"gap-wrap\" data-gap=\"30\" data-answer=\"mispronounced\"><input type=\"text\" class=\"gap-input\" data-gap=\"30\" aria-label=\"Gap 30\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(30)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (p, t, k). Flege suggests “you are what you eat, phonetically” and predicts that input (type and quantity) will ultimately be found to be the most important factor in L2 speech learning. If true, there are important implications for L2 pronunciation skill: learners can improve even at advanced ages, if they use their L2 regularly and by so doing remain exposed to large amounts of L2 input.<\u002Fp><\u002Faside>\n<p>Another set of studies (Bongaerts, 1999; Bongaerts, Van Summeren, Planken, &amp; Schils, 1997) undertook to investigate the pronunciation abilities of very advanced non-native speakers. In the first study, participants consisted of 10 Dutch L1, advanced ESL speakers; 12 Dutch L1 participants, of varying levels of English <span class=\"gap-wrap\" data-gap=\"31\" data-answer=\"proficiency\"><input type=\"text\" class=\"gap-input\" data-gap=\"31\" aria-label=\"Gap 31\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(31)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>; and 5 British English L1 speakers as controls. Participants were asked to provide speech samples, by reading a short text and a list of words. Their pronunciation was evaluated on a scale of 1 to 5 (5 equal to native speaker abilities, no accent) by four native English-speaking judges.<\u002Fp>\n<p>In a surprising outcome, half of the advanced subjects received evaluations higher than native speakers. The authors provide an explanation for this anomalous finding, by pointing out that the regional accents of native English speakers led to their being evaluated as “non-natives.” A second study was undertaken in order to <span class=\"gap-wrap\" data-gap=\"32\" data-answer=\"rectify\"><input type=\"text\" class=\"gap-input\" data-gap=\"32\" aria-label=\"Gap 32\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(32)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> the methodological flaw in the previous study. In this study, participants were 11 native Dutch speakers who were very advanced English speakers, had intensive training at the university, and who had studied English from the age of 12. Additional participants included 20 native Dutch speakers, of different English proficiency levels and 10 native British English speakers as controls. Participants were asked to read six isolated sentences aloud, three times each. Thirteen native British English evaluators scored the speech samples. Results revealed that 5 (out of 11) participants in the “advanced” group were judged as native speakers.<\u002Fp>\n<p>In a third study by the same researchers, French was chosen as the target language in order to examine whether the use of a language less typologically related to the L1 of participants (Dutch) would lead to different results (in contrast, note that the English and Dutch language pair in study 2 are both Germanic languages). Participants in this study were nine native Dutch speakers, advanced learners of French, who had begun studying French at age 12 or older, and 18 native Dutch speakers, of varying French proficiency levels. Controls consisted of nine native speakers of French. Tasks in this study were samples of discourse, 10 sentences selected for the level of pronunciation difficulty for Dutch speakers learning French. Additionally, there were 27 sentences of the form: “Je dis” (“I say”), followed by a CV (<span class=\"gap-wrap\" data-gap=\"33\" data-answer=\"consonant\"><input type=\"text\" class=\"gap-input\" data-gap=\"33\" aria-label=\"Gap 33\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(33)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>-vowel) item (a “frames” task), in order to allow for different phonetic contexts.<\u002Fp>\n<p>Results for the sentence task were as follows: Four participants (out of nine) in the “advanced” group were judged as native speakers (one participant on all sentences, two on eight sentences), while three native speakers were not judged as natives on all ten sentences. For the Frames task, four non-native speakers were judged as natives, while one native speaker was not <span class=\"gap-wrap\" data-gap=\"34\" data-answer=\"evaluated\"><input type=\"text\" class=\"gap-input\" data-gap=\"34\" aria-label=\"Gap 34\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(34)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> as native. Overall, three non-natives passed as natives on all exercises.<\u002Fp>\n<p>How does one explain the success of certain participants and not others? The authors suggest three general factors: certain individuals were particularly motivated to learn the target language, they continued to have access to <span class=\"gap-wrap\" data-gap=\"35\" data-answer=\"intensive\"><input type=\"text\" class=\"gap-input\" data-gap=\"35\" aria-label=\"Gap 35\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(35)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> L2 input, and they had received intensive training in L2 sound perception and production.<\u002Fp>\n<p>On the other hand, there are weak points in the Bongaerts et al. (1997) studies. For instance, the use of isolated sentences as the <span class=\"gap-wrap\" data-gap=\"36\" data-answer=\"stimuli\"><input type=\"text\" class=\"gap-input\" data-gap=\"36\" aria-label=\"Gap 36\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(36)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> may have made it easier for participants to pass as native speakers. Also, it is difficult to explain the fact that native speakers were judged as non-natives. Still, these results have been cited as offering evidence that critical period effects are not universal.<\u002Fp>\n<p>Other studies have undertaken to examine whether there are direct links between age and acquisition of L2 grammatical skills. One early study by Mark Patkowski (1980) hypothesized that complete acquisition of L2 syntax would only be possible if learning started before 15 years of age, an age chosen based on the researcher’s personal experiences. In this study, participants were 67 educated professionals who had immigrated to the US from various countries, and who had begun learning English at different ages and for various durations, but at least for five years. They were compared with a control group of 15 Americans who were born in the US. Grammatical <span class=\"gap-wrap\" data-gap=\"37\" data-answer=\"competence\"><input type=\"text\" class=\"gap-input\" data-gap=\"37\" aria-label=\"Gap 37\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(37)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> was measured by having native speakers evaluate 5-minute samples taken from transcriptions of oral interviews that lasted from 15 to 35 minutes. The judges were three ESL teachers who were asked to rate participants’ grammatical ability on a 0 to 5 point scale.<\u002Fp>\n<p>The variables examined were AO (AoA in the US) and the number of years that the individual had resided in the US. Informal experience in English and formal instruction in English were also considered. The number of years in the US varied from 6 to 61 years and the AO varied from 5 to 50 years. A total of 33 participants had arrived before 15 years of age and 34 had arrived after that age. The average age for the pre-puberty group was 8.6 years and 27.1 years for the post-<span class=\"gap-wrap\" data-gap=\"38\" data-answer=\"puberty\"><input type=\"text\" class=\"gap-input\" data-gap=\"38\" aria-label=\"Gap 38\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(38)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> group. The results of syntactic evaluations revealed marked differences between pre- and post-puberty groups, compatible with the notion of a critical or sensitive period for acquisition of syntax (figure 7.3).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"6d198213-9da8-4fe7-99ed-84200209a332\" alt=\"image8.png\"><\u002Ffigure>\n<p>No effects were found for instructional or practice variables. Patkowski concluded that these results provide evidence for an age effect (before and after 15 years of age) for acquiring native-like grammatical competence.<\u002Fp>\n<p>Another often-cited study that examined grammatical ability and the effect of age was conducted by Jacqueline Johnson and Elissa Newport (1989). Participants in this study consisted of 46 native speakers of Chinese or Korean who had studied English at an American university or who were professors at an American university. All had been in the US for at least five years. The controls were 23 native speakers of English. Participants were asked to complete a grammaticality judgment task which contained 12 different <span class=\"gap-wrap\" data-gap=\"39\" data-answer=\"morphosyntactic\"><input type=\"text\" class=\"gap-input\" data-gap=\"39\" aria-label=\"Gap 39\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(39)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> rules (276 items). The task required them to listen to recorded sentences and indicate whether or not each sentence was grammatical. For example, one ungrammatical sentence was: *“Two mouses ran into the house.”<\u002Fp>\n<p>The results indicated that AoA was the significant explanatory variable for success on the test: there was a strong relation between early L2 learning and L2 performance. The scores of the group that arrived at the earliest ages (3–7 years) were similar to those of native speakers. There was a negative correlation of −.87 between AoA and English performance for those who arrived between 3 and 15 years of age. On the other hand, there was a low negative correlation of −.16 for those who arrived between 17 and 39 years of age. Therefore, the older the person at arrival, the weaker the English grammaticality <span class=\"gap-wrap\" data-gap=\"40\" data-answer=\"intuitions\"><input type=\"text\" class=\"gap-input\" data-gap=\"40\" aria-label=\"Gap 40\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(40)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. Before an arrival of 15 years, and especially before 10 years, there were few individual differences in L2 competence. On the other hand, older learners (17–39 years old) did not perform like native speakers and demonstrated more differences among each other with regard to ultimate competence. In sum, the findings revealed that arriving at around 20 years of age gave no advantage over arriving at 30 years of age.<\u002Fp>\n<p>The study’s authors also noted that there was a gradual decline in ability, not an <span class=\"gap-wrap\" data-gap=\"41\" data-answer=\"abrupt\"><input type=\"text\" class=\"gap-input\" data-gap=\"41\" aria-label=\"Gap 41\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(41)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> drop (figure 7.4). They suggest therefore that the beginning of the decline begins well before 15 years of age, but does not drop off rapidly. They also note that the ability to learn an L2 continues after adolescence, but it appears to be less efficient:<\u002Fp>\n<p>For adults, later age of acquisition determines that one will most likely not become native or near-native in a language; however, there are large individual variations in ultimate ability, within the lowered range of performance. (Johnson &amp; Newport, 1989, p. 81)<\u002Fp>\n<figure class=\"ch-img\"><img src=\"808d229e-b47b-4a14-93d7-59468165e6ed\" alt=\"image9.png\"><\u002Ffigure>\n<p>There are some weaknesses in the Johnson and Newport study. DeKeyser (2000) points out, for example, that participants had resided for a minimum of five years in the target language environment, but LOR may not have been sufficient in all cases for ultimate attainment effects to occur. He also points out that the large number of items (276) required substantial <span class=\"gap-wrap\" data-gap=\"42\" data-answer=\"concentration\"><input type=\"text\" class=\"gap-input\" data-gap=\"42\" aria-label=\"Gap 42\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(42)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. Also, it can be argued that some of the sentences were so obviously ungrammatical (e.g., *“The girl cut himself with a piece of glass.”) that they allowed participants to perform better than they might have with more demanding test materials, thereby perhaps leading to an overestimation of performance abilities of some participants (e.g., Abrahamsson &amp; Hyltenstam, 2009).<\u002Fp>\n<p>Other researchers (Birdsong &amp; Molis, 2001) carried out a replication of the Johnson and Newport (1989) study, using the same grammaticality judgment items, and came up with somewhat different results. In the Birdsong and Molis replication, there were 61 Spanish L1 learners of English, whose AoA varied from 3 to 39 years of age, with a LOR of 10 years or more. In contrast to the findings of Johnson and Newport, they found no significant correlation between AoA and grammaticality judgments when the AoA was less than 16 years of age, but there was a marked effect for late learners. In the Birdsong and Molis study, scores continued to decline across the lifespan, while the Johnson and Newport study reportedly found no continuing relation after puberty. The finding of a continuing decline across time is counter evidence to the notion of a well-<span class=\"gap-wrap\" data-gap=\"43\" data-answer=\"defined\"><input type=\"text\" class=\"gap-input\" data-gap=\"43\" aria-label=\"Gap 43\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(43)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> window of opportunity, as suggested by the CPH.<\u002Fp>\n<p>Still other researchers (Hyltenstam &amp; Abrahamsson, 2003) propose that the critical period may actually begin as early as birth and that differences are simply too small to be <span class=\"gap-wrap\" data-gap=\"44\" data-answer=\"detectable\"><input type=\"text\" class=\"gap-input\" data-gap=\"44\" aria-label=\"Gap 44\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(44)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in most studies. In a large-scale study (Abrahamsson &amp; Hyltenstam, 2009) of Spanish L1–Swedish L2 bilinguals (n = 195), they found that a series of cognitively demanding linguistic tasks led to eliminating all of the late learners (AO after age 12) from the native speaker range of performance. Furthermore, only a few of the early learners (AO prior to age 12) reached native speaker levels on all L2 proficiency measures. While 25 of 31 early learners were perceived as native speakers by native speaker judges in this study, only three of these reached native speaker levels on all 10 measures of Swedish proficiency (tests of speech production and perception, grammar, and formulaic language), and none of the late learners (AO 13–19 years of age) did so, despite passing for native-like on the initial global speech evaluation test. There was also no effect for length of L2 exposure, similar to results from previous studies (e.g., Johnson &amp; Newport, 1989). The authors report (p. 289):<\u002Fp>\n<p>. . . what our data do show is that even if a nativelike mastery of any linguistic aspect of an L2 is indeed possible, even for late learners, the probability of a late learner developing a nativelike command of all (or even a majority of) relevant linguistic aspects (and across all linguistic domains, too) is close to zero.<\u002Fp>\n<p>They suggest that previous studies indicating early learners pass almost universally as native speakers is due to insufficiently demanding tests and data analyses. Hyltenstam and Abrahamsson (2003) have coined what they acknowledge is an awkward term, “non-perceivable non-nativeness,” to characterize individuals whose grasp of an L2 diverges in <span class=\"gap-wrap\" data-gap=\"45\" data-answer=\"subtle\"><input type=\"text\" class=\"gap-input\" data-gap=\"45\" aria-label=\"Gap 45\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(45)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> but distinct ways from that of a native speaker of a given language.<\u002Fp>\n<p class=\"tbl-caption\">Table 7.1 Summary of key critical period studies.<\u002Fp>\n<div class=\"table-wrap\"><table><tbody><tr><th>Researchers<\u002Fth><th>Date<\u002Fth><th>Linguistic aspect<\u002Fth><th>Number and L1 of participants<\u002Fth><th>Conclusions<\u002Fth><\u002Ftr><tr><td>Oyama<\u002Ftd><td>1976<\u002Ftd><td>Pronunciation, evaluated through reading a story and telling an anecdote<\u002Ftd><td>N = 60; L1 Italian<\u002Ftd><td>Early age of arrival (6 to 10 years old) of immigrants to US linked to native-like pronunciation<\u002Ftd><\u002Ftr><tr><td>Snow &amp; Hoefnagel-Höhle<\u002Ftd><td>1978<\u002Ftd><td>Pronunciation, morphology, translation<\u002Ftd><td>N = 96; L1 English<\u002Ftd><td>Initial advantage for teenagers and adults equaled or surpassed by children after 10 months<\u002Ftd><\u002Ftr><tr><td>Patkowski<\u002Ftd><td>1980<\u002Ftd><td>Grammar, evaluated by written transcript from oral discourse<\u002Ftd><td>N = 67; Immigrants of various L1s<\u002Ftd><td>Earlier age of arrival (under 15 years) linked to native-like grammar<\u002Ftd><\u002Ftr><tr><td>Johnson &amp; Newport<\u002Ftd><td>1989<\u002Ftd><td>Grammaticality judgments for 276 sentences, various syntactic and morphological rules<\u002Ftd><td>N = 46; L1 Chinese; L1 Korean<\u002Ftd><td>Earlier age of arrival linked to higher L2 performance<\u002Ftd><\u002Ftr><tr><td>Flege, Munro, &amp; Mackay<\u002Ftd><td>1995<\u002Ftd><td>Pronunciation of isolated sentences<\u002Ftd><td>N = 240; L1 Italian, 15+ years residence in English environment<\u002Ftd><td>Gradual deterioration of native-like evaluation over time<\u002Ftd><\u002Ftr><tr><td>Bongaerts, Van Summeren, Planken, &amp; Schils<\u002Ftd><td>1997 Study 2<\u002Ftd><td>Pronunciation evaluated by reading isolated sentences<\u002Ftd><td>N = 10 English native speakers (controls); N = 11 L1 Dutch, advanced learners of English, age of onset 12+; N = 20 L1 Dutch, various L2 levels<\u002Ftd><td>Five advanced learners were able to pass as native speakers on some tasks<\u002Ftd><\u002Ftr><tr><td>Bongaerts et al.<\u002Ftd><td>1997 Study 3<\u002Ftd><td>Pronunciation evaluated by reading isolated sentences chosen for difficulty and by pronouncing words within frames (\"je dis...\")<\u002Ftd><td>N = 9 native speakers of French (controls); N = 9 L1 Dutch, adv. learners of French, age of onset 12+; N = 18 L1 Dutch, various L2 French levels<\u002Ftd><td>Three advanced learners passed as native-like on all tests; however, some native speakers were evaluated as non-native on certain tests<\u002Ftd><\u002Ftr><tr><td>Abrahamsson &amp; Hyltenstam<\u002Ftd><td>2009<\u002Ftd><td>10 tasks: speech production and perception (e.g., voice onset time—VOT), grammaticality judgments, formulaic language<\u002Ftd><td>N = 195; L1 = Spanish; L2 = Swedish<\u002Ftd><td>No late learners passed as native-like; only three early learners performed within native speaker range on all 10 tests<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h3 class=\"section-h\">7.4 exceptional cases<\u002Fh3>\n<p>As we have seen in the preceding accounts, it is exceedingly rare that L2 learners who began learning the L2 after puberty are able to pass as native speakers in terms of morphosyntactic intuitions, grammatical production ability, and especially in terms of pronunciation. Still, there have been a few well-documented cases of individuals who appear to perform well beyond average. One such case is that of Julie, a British woman, who only began learning Egyptian Arabic at 21 years of age when she moved with her Egyptian husband to Cairo. She learned to speak and understand Arabic, without formal instruction in a naturalistic context, although she did not learn to read and write the language. Julie’s command of Arabic was examined (Ioup, Boustagoui, Tigi, &amp; Moselle, 1994) at a time when she had been living in Egypt for 26 years. The researchers found that recordings of Julie’s speech were judged as native-like by 7 of 13 native speakers. She was also able to correctly differentiate Egyptian from non-Egyptian Arabic accents. On various grammatical and translation tasks, her performance was close to native-like. While Julie’s command of Arabic is remarkable given her late exposure and lack of formal instruction, it is important to remember that almost half of the judges did not consider her speech to be native-like, and she did not perform at 100% on the various <span class=\"gap-wrap\" data-gap=\"46\" data-answer=\"morphosyntactic\"><input type=\"text\" class=\"gap-input\" data-gap=\"46\" aria-label=\"Gap 46\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(46)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> tasks (although it must be said that a number of native speakers also made some errors on these tasks). She may well be an example of an exceptional L2 learner but cannot be said to provide irrefutable support for the CPH. The role of aptitude in language learning will be discussed in the next chapter (Chapter 8).<\u002Fp>\n<p>Popular views about exceptional individuals who have managed to master a second language beyond childhood are abundant. One notable case is the renowned British author Joseph Conrad best known for the novella, Heart of Darkness, written in English, a language the native Polish-speaking Conrad learned as an adult, after 17 years of age, as a third language, after French. In fact, the term “the Joseph Conrad phenomenon” has been used to refer to an individual who seems to have acquired flawless morphosyntactic and lexical skills in a second language, while maintaining traces of a native accent in speech (e.g., Scovel, 1988). While it is generally acknowledged that Conrad had a very good grasp of English sentence structure and stylistics, <span class=\"gap-wrap\" data-gap=\"47\" data-answer=\"apparently\"><input type=\"text\" class=\"gap-input\" data-gap=\"47\" aria-label=\"Gap 47\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(47)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> his English speech was heavily accented by his native Polish.<\u002Fp>\n<p>Ford Madox Ford, a fellow writer who sometimes collaborated with Conrad wrote:<\u002Fp>\n<p>He spoke English with great fluency and distinction, with correctitude in his syntax, his words absolutely exact as to meaning but his accentuation so faulty that he was at times difficult to understand and his use of adverbs as often as not eccentric. (1924, pp. 34–35)<\u002Fp>\n<p>In addition, it appears that Conrad himself was quick to admit to his less than native-like accent. Alice Pousada (1994) refers to information from Najder (1983, p. 408) that in a letter to an American who had invited him to speak in the US, Conrad explained his refusal: “I am not very anxious to display my accent before a large gathering of people. It might affect them disagreeably.” In addition, contrary to the implications of what some have termed the “Joseph Conrad phenomenon,” there is also evidence that Conrad’s expertise in written English was less than fully native-like. Pousada (1994) reports that Conrad’s editor, Edward Garnett, spent considerable time “excising Polish and French influences from the syntax.” She also refers to reports (Najder, 1983, p. 208) that Conrad revealed to his editor that “the more I write, the less sure I am of my English.” She similarly cites information (Najder, 1983, p. 326) that Conrad revealed that for him English remained “a foreign language and its use requires a formidable effort on my part.” Pousada also draws attention to the fact that Ford’s biographer, Douglas Goldring, drew an <span class=\"gap-wrap\" data-gap=\"48\" data-answer=\"unflattering\"><input type=\"text\" class=\"gap-input\" data-gap=\"48\" aria-label=\"Gap 48\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(48)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> portrait of Conrad’s writing style: “largely pastiche Flaubert translated into English by someone with no great ease in the use of the language” (Goldring, 1943, p. 151).<\u002Fp>\n<p>Pousada (1994, p. 346) mentions in a footnote to her article on Conrad, that her first-hand examination of Conrad’s manuscripts revealed:<\u002Fp>\n<p>. . . recurrent misspellings, misused prepositions, confusions of verbs like feel and touch, redundancies, etc. But the most noticeable tendency was that of adjective placement. Conrad was very fond of inverting noun-adjective syntax in English, probably in accordance with both French and Polish syntax.<\u002Fp>\n<p>She cites examples such as “the forest, sombre and dull;” “Mokola taciturn and impenetable.”<\u002Fp>\n<p>It seems, then, that although Conrad certainly possessed a skillful grasp of literary English, he himself acknowledged the effort associated with expressing himself in what remained a foreign language to him, given his late age of acquisition, and there is considerable <span class=\"gap-wrap\" data-gap=\"49\" data-answer=\"evidence\"><input type=\"text\" class=\"gap-input\" data-gap=\"49\" aria-label=\"Gap 49\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(49)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> that his English writing was less than native-like before undergoing his editor’s attention.<\u002Fp>\n<h3 class=\"section-h\">7.5 summing up<\u002Fh3>\n<p>The enduring question as to whether there is a limited timeframe during which people can learn a second language to native speaker levels has generated a lively debate over the past decades. While a number of studies provide strong support for detectable non-native pronunciation or grammatical mastery in a language learned after early childhood, other studies report that some post-childhood L2 learners have received native speaker ratings on various tasks. Others argue that when more demanding tasks are required and more <span class=\"gap-wrap\" data-gap=\"50\" data-answer=\"scrutiny\"><input type=\"text\" class=\"gap-input\" data-gap=\"50\" aria-label=\"Gap 50\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(50)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> is given to learner performance, subtle differences are detected in late learners. It remains to be seen whether future studies will manage to provide unambiguous support for one or the other positions on this intriguing issue.<\u002Fp>\n<p>An important question relating to the debate surrounding the notion of a critical period for language learning is whether native-speaker-like linguistic control is an appropriate standard of reference when two or more languages are in contact in the same individual. Increasing evidence suggests that two languages in the mind of one speaker <span class=\"gap-wrap\" data-gap=\"51\" data-answer=\"inevitably\"><input type=\"text\" class=\"gap-input\" data-gap=\"51\" aria-label=\"Gap 51\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(51)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> influence each other to some extent. This question will be examined in Chapter 9, “Bilingualism.” In the next chapter, Chapter 8, we will examine individual learner differences other than age that may have an important impact on SLA.<\u002Fp>\n<h3 class=\"section-h\">key concepts<\u002Fh3>\n<ul>\n<li>Critical period<\u002Fli>\n<li>Imprinting<\u002Fli>\n<li>Critical Period Hypothesis (CPH)<\u002Fli>\n<li>Lateralization<\u002Fli>\n<li>Age of onset (AO) or age of arrival (AoA)<\u002Fli>\n<li>Length of residence (LOR)<\u002Fli>\n<li>Feral child<\u002Fli>\n<\u002Ful>\n<h3 class=\"section-h\">self-assessment questions<\u002Fh3>\n<div class=\"saq\"><p class=\"saq-q\"><strong>1.<\u002Fstrong> Most early research on L2 speech production tends to place the end of the hypothesized critical period around<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>2 years of age<\u002Fli><li>5 years of age<\u002Fli><li>puberty, or 12–13 years of age<\u002Fli><li>18 years of age<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>2.<\u002Fstrong> The aspect of L2 language skill that appears to be most subject to a critical period is<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>pronunciation<\u002Fli><li>grammar<\u002Fli><li>vocabulary<\u002Fli><li>reading<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>3.<\u002Fstrong> The case studies on children raised in isolation reveal<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>abnormal environments have little effect on language skills<\u002Fli><li>abnormal environments have an effect on language skills<\u002Fli><li>nothing<\u002Fli><li>that such cases have only occurred in the distant past<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>4.<\u002Fstrong> Individuals who appear to defy the predictions of the Critical Period Hypothesis<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>are numerous<\u002Fli><li>on closer investigation appear to diverge from native speaker abilities<\u002Fli><li>have never been found<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>5.<\u002Fstrong> The Joseph Conrad Phenomenon refers to<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>the effect found when literacy skills in an L2 are superior to speaking skills<\u002Fli><li>the effect found when professional writers fail to write well in an L2<\u002Fli><li>the effect found when professional writers choose to write in an L2 due to weaknesses in their L1<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>6.<\u002Fstrong> Researchers Abrahamsson and Hyltenstam (e.g., 2009) have proposed that non-native speaker speech differs from that of native speakers even in L2 learners exposed to the target language at a very early age, and that such differences are<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>easily detected by conversational partners<\u002Fli><li>difficult to perceive<\u002Fli><li>not important from a scientific point of view<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<h3 class=\"section-h\">discussion questions<\u002Fh3>\n<p>1. Can you cite examples of people you know for whom your native language is a second or third language and who appear to speak it without an accent? Do you know at what age they were exposed to their L2 and under what specific circumstances that might explain their success?<\u002Fp>\n<p>2. In contrast to the cases cited in the previous question, can you cite examples of people you know for whom your native language is a second or third language and who do have a noticeable accent in that language? Do you know at what age they were exposed to their L2 and what specific circumstances might explain their lack of nativelike skill?<\u002Fp>\n<p>3. Do you consider yourself to be able to pass as a native speaker of a language you learned after early childhood? If so, are there particular circumstances about your exposure to that language (age of onset, amount of exposure, motivation) that might explain this?<\u002Fp>\n<p>4. In your own personal experience in learning a new language, which linguistic aspect (e.g., pronunciation, grammar, vocabulary, etc.) has given you the most difficulty? Which aspect has given you the least difficulty? Do you think you will manage to reach native-like standards with regard to one linguistic aspect?<\u002Fp>\n<h3 class=\"section-h\">exercises/project ideas<\u002Fh3>\n<p>1. Find a non-native speaker of your language, but whose
