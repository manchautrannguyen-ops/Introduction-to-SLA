 command of the language is quite good and ask him/her to record several sentences or recount a short anecdote. Do the same thing with one or two native speakers of your language. Prepare a scale for individuals to rate the degree to which they consider a given recorded speaker to speak the target language fluently (e.g., on a scale of 1 to 5, 5 would be equivalent to the speech of a native speaker) and find a number of fellow students to rate the recordings. To what extent is there agreement about the ratings among the various evaluators of the recordings? What did you learn from this project?<\u002Fp>\n<p>2. Find non-native speakers of your L1 who began their intensive exposure to that language at different ages, but who have similar experiences with respect to current and recent exposure to that language (your L1). Ask them to write short paragraphs on any topic. Examine their writing for grammatical accuracy. Do you find any indications that age of exposure may have had an effect on their writing ability?<\u002Fp>\n<h3 class=\"section-h\">further reading and viewing<\u002Fh3>\n<p>Curtiss, S. (1977). Genie: A psycholinguistic study of a modern-day “wild child”. New York: Academic Press.<\u002Fp>\n<p>A description of the case of Genie written by the linguist, Susan Curtiss, the person most closely associated with Genie’s language training in the years following her rescue.<\u002Fp>\n<p>Herschensohn, J. (2007). Language development and age. Cambridge: Cambridge University Press.<\u002Fp>\n<p>A scholarly, comprehensive discussion of the role of age in both first and second language acquisition.<\u002Fp>\n<p>Rymer, R. (1994). Genie: A scientific tragedy. New York: HarperCollins.<\u002Fp>\n<p>A description of the case of Genie from a journalist’s critical view of various aspects surrounding attempts to study and rehabilitate her.<\u002Fp>\n<p>Shattuck, R. (1994) [1980]. The Forbidden Experiment: The story of the wild boy of Aveyron. New York: Kodansha Globe.<\u002Fp>\n<p>Originally published in 1980, this is a fascinating account of Victor of Aveyron’s story.<\u002Fp>\n<p>Singleton, D., &amp; Ryan, L. (2004). Second language acquisition: The age factor. Multilingual Matters.<\u002Fp>\n<p>An intriguing and comprehensive look at the role of age in SLA.<\u002Fp>\n<h3 class=\"section-h\">Film/video links<\u002Fh3>\n<p>Truffaut, F. (1970). L’enfant sauvage. (The wild child). Director: François Truffaut. Les films du Carosse.<\u002Fp>\n<p>Fi3201 (uploaded 2008) Konrad Lorenz: Imprinting. Available at: http://www.youtube.com/watch?v=eqZmW7uIPW4<\u002Fp>\n<p>PBS (NOVA) (1994). Secret of the wild child. Available at: http://www.tvmuse.eu/tv-shows/Nova_16245/season_22/episode_2/<\u002Fp>\n<p>PBS (NOVA) Secret of the wild child: Transcript. Available at: http://www.pbs.org/wgbh/nova/transcripts/2112gchild.html<\u002Fp>\n<h3 class=\"section-h\">references<\u002Fh3>\n<p>Abrahamsson, N., &amp; Hyltenstam, K. (2009). Age of onset and nativelikeness in a second language: listener perception versus linguistic scrutiny. Language Learning, 59(2), 249–306.<\u002Fp>\n<p>Bever, T. (1981). Normal acquisition processes explain the critical period in language learning. In K. Diller (Ed.), Individual differences and universals in second language aptitude (pp. 176–198). Rowley, MA: Newbury House.<\u002Fp>\n<p>Birdsong, D.P. (Ed.) (1999). Second language acquisition and the critical period hypothesis. Mahwah, NJ: Lawrence Erlbaum.<\u002Fp>\n<p>Birdsong, D., &amp; Molis, M. (2001). On the evidence for maturational effects in second language acquisition. Journal of Memory and Language, 44, 235–249.<\u002Fp>\n<p>Bongaerts, T. (1999). Ultimate attainment in L2 pronunciation: The case of very advanced late learners of Dutch as a second language. In D.P. Birdsong (Ed.), Second language acquisition and the critical period hypothesis (pp. 133–159). Mahwah, NJ: Lawrence Erlbaum.<\u002Fp>\n<p>Bongaerts, T., Van Summeren, C., Planken, B., &amp; Schils, E. (1997). Age and ultimate attainment in the pronunciation of a foreign language. Studies in Second Language Acquisition, 19, 447–465.<\u002Fp>\n<p>DeKeyser, R. (2000). The robustness of critical period effects in second language acquisition. Studies in Second Language Acquisition, 22, 499–533.<\u002Fp>\n<p>Elman, J.L., Bates, E.A., Johnson, M.H., Karmiloff-Smith, A., Parisi, D., &amp; Plunket, K. (1996). Rethinking innateness. A connectionist perspective on development. Cambridge, MA: MIT Press.<\u002Fp>\n<p>Flege, J.E. (1995). Second language speech learning: Theory, findings, and problems. In W. Strange (Ed.), Speech perception and linguistic experience (pp. 233–277). Baltimore, MD: York.<\u002Fp>\n<p>Flege, J.E. (2012). The role of input in second language (L2) speech learning. Keynote address, VIth International Conference on Native and Non-native Accents of English, Lodz, Poland, December 6–8.<\u002Fp>\n<p>Flege, J.E., Munro, M.J., &amp; Mackay, I.R.A. (1995). Effects of age of second-language learning on the production of English consonants. Speech Communication, 16(1), 1–26.<\u002Fp>\n<p>Ford, F.M. (1924). Joseph Conrad, A personal remembrance. New York: Ecco Press.<\u002Fp>\n<p>Goldring, D. (1943). South Lodge remembrances of Violet Hunt, Ford Madox and the English Circle. London: Constable.<\u002Fp>\n<p>Hyltenstam, K., &amp; Abrahamsson, N. (2003). Maturational constraints in SLA. In C.J. Doughty &amp; M.H. Long (Eds.), The handbook of second language acquisition (pp. 539–588). Oxford: Blackwell.<\u002Fp>\n<p>Ioup, G., Boustagoui, E., Tigi, M., &amp; Moselle, M. (1994). Reexamining the critical period hypothesis: A case of successful adult SLA in a naturalistic environment. Studies in Second Language Acquisition, 16, 73–98.<\u002Fp>\n<p>Johnson, J.S., &amp; Newport, E.L. (1989). Critical period effects in second language learning: The influence of maturational state on acquisition of ESL. Cognitive Psychology, 21, 60–99.<\u002Fp>\n<p>Knudsen, E.I. (2004). Sensitive periods in the development of the brain and behaviour. Journal of Cognitive Neuroscience, 16, 1412–25.<\u002Fp>\n<p>Krashen, S. (1973). Lateralization, language learning, and the critical period. Language Learning, 23, 63–74.<\u002Fp>\n<p>Lenneberg, E. (1967). Biological foundations of language. Oxford: Wiley.<\u002Fp>\n<p>Long, M.H. (1993). Second language acquisition as a function of age: substantive findings and methodological issues. In K. Hyltenstam &amp; A. Viberg (Eds.), Progression and regression in language (pp. 196–221). Cambridge: Cambridge University Press.<\u002Fp>\n<p>Najder, Z. (1983). Joseph Conrad: A chronicle. Smithmark Pub.<\u002Fp>\n<p>Newport, E. (1988). Constraints on learning and their role in language acquisition. Studies of the acquisition of American Sign Language. Language Sciences, 10, 147–172.<\u002Fp>\n<p>Oyama, S. (1976). A sensitive period in the acquisition of a non-native phonological system. Journal of Psycholinguistic Research, 5, 261–85.<\u002Fp>\n<p>Patkowski, M.S. (1980). The sensitive period for the acquisition of syntax in a second language. Language Learning, 30, 449–472.<\u002Fp>\n<p>Penfield, W., &amp; Roberts, L. (1959). Speech and brain mechanisms. Princeton: Princeton University Press.<\u002Fp>\n<p>Pinker, S. (1994). The language instinct: How the mind creates language. New York: HarperCollins.<\u002Fp>\n<p>Pousada, A. (1994). Joseph Conrad’s multilingualism: A case study of language planning in literature. English Studies, 75(4), 335–349.<\u002Fp>\n<p>Ramsay, O., &amp; Hess, E.H. (1954). A laboratory approach to the study of imprinting. Wilson Bulletin, 66, 196–206.<\u002Fp>\n<p>Rymer, R. (1994). Genie: A scientific tragedy. New York: HarperCollins.<\u002Fp>\n<p>Scovel, T. (1988). A time to speak. A psycholinguistic inquiry into the critical period for human speech. Rowley, MA: Newbury House.<\u002Fp>\n<p>Snow, C., &amp; Hoefnagel-Höhle, M. (1978). Critical period for language acquisition: evidence from second language learning. Child Development, 48, 1114–1128.<\u002Fp>\n  <\u002Fsection>\n<\u002Fdiv>\n<script>\n(function(){\n  function normalize(str){if(!str)return '';return str.toLowerCase().trim().replace(/[\\u2018\\u2019]/g,\"'\").replace(/[\\u201C\\u201D]/g,'\"').replace(/\\s+/g,' ');}\n  function checkInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');const answer=wrap.getAttribute('data-answer')||'';const value=input.value;\n    if(!value.trim()){input.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');return null;}\n    const ok=normalize(value)===normalize(answer);input.classList.toggle('correct',ok);input.classList.toggle('wrong',!ok);input.classList.remove('revealed');\n    fb.classList.toggle('ok',ok);fb.classList.toggle('no',!ok);fb.classList.remove('show');return ok;}\n  function revealInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');const answer=wrap.getAttribute('data-answer')||'';\n    input.value=answer;input.classList.remove('correct','wrong');input.classList.add('revealed');fb.classList.remove('ok','no');fb.classList.add('show');}\n  function resetInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');input.value='';input.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');}\n  function updateGlobalStats(){const inputs=document.querySelectorAll('.gap-input');let correct=0;inputs.forEach(inp=>{if(inp.classList.contains('correct'))correct++;});\n    const total=inputs.length;document.getElementById('score-text').textContent=correct+' / '+total+' correct';\n    document.getElementById('score-bar').style.width=(total?(correct/total*100):0)+'%';}\n  document.addEventListener('input',(e)=>{if(e.target.classList.contains('gap-input')){const fb=e.target.parentElement.querySelector('.gap-feedback');\n    e.target.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');updateGlobalStats();}});\n  document.addEventListener('blur',(e)=>{if(e.target.classList.contains('gap-input')&&e.target.value.trim()){checkInput(e.target);updateGlobalStats();}},true);\n  document.addEventListener('keydown',(e)=>{if(e.target.classList.contains('gap-input')&&e.key==='Enter'){e.preventDefault();checkInput(e.target);updateGlobalStats();\n    const inputs=[...document.querySelectorAll('.gap-input')];const idx=inputs.indexOf(e.target);if(idx>=0&&idx+1<inputs.length)inputs[idx+1].focus();}});\n  document.getElementById('btn-check-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(inp=>{if(inp.value.trim())checkInput(inp);});updateGlobalStats();\n    const summary=document.getElementById('summary-top');const total=document.querySelectorAll('.gap-input').length;const correct=document.querySelectorAll('.gap-input.correct').length;\n    summary.innerHTML='<strong>'+correct+' / '+total+' correct.<\u002Fstrong> Review any incorrect answers and try again.';summary.classList.add('show');});\n  document.getElementById('btn-reveal-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(revealInput);updateGlobalStats();});\n  document.getElementById('btn-reset-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(resetInput);document.getElementById('summary-top').classList.remove('show');updateGlobalStats();});\n  updateGlobalStats();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
