  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ide.outline{margin:14px 0 18px;padding:16px 20px;background:#f1ede2;border:1px solid var(--border-strong);border-radius:10px}\n  aside.outline h5{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n  ul.outline-list{margin:0;padding-left:18px;columns:2;column-gap:28px;font-size:14px;color:var(--ink-soft)}\n  ul.outline-list li{margin:3px 0;break-inside:avoid}\n  aside.profile-box{margin:18px 0;padding:16px 20px;background:#f7f4ec;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px}\n  aside.profile-box h5{margin:0 0 8px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n  aside.profile-box p{margin:0}\n  aside.practice-box{margin:18px 0;padding:16px 20px;background:#eef4f8;border:1px solid var(--border);border-left:4px solid #2a6f9a;border-radius:8px}\n  aside.practice-box h5{margin:0 0 8px;font-size:15px;font-weight:700;color:#2a6f9a;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n  aside.practice-box p{margin:0 0 10px}\n  aside.practice-box p:last-child{margin-bottom:0}\n  figure.fig-box{margin:18px 0;padding:14px 18px;background:#fbfaf6;border:1px solid var(--border-strong);border-radius:10px}\n  figure.fig-box figcaption{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\n  .fig-body{font-size:15px}\n  .fig-line{margin:3px 0;padding-left:4px}\n  figure.ch-img{margin:18px auto;text-align:center}\n  figure.ch-img img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px}\n  .saq{margin:14px 0;padding:12px 16px;background:#fafaf6;border:1px solid var(--border);border-radius:8px}\n  .saq-q{margin:0 0 8px}\n  ol.saq-opts{margin:6px 0 2px;padding-left:26px;font-size:16px}\n  ol.saq-opts li{margin:4px 0}\n  .table-wrap{overflow-x:auto;margin:8px 0 16px;border:1px solid var(--border);border-radius:10px}\n  table{border-collapse:collapse;width:100%;font-size:14px}\n  table th,table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}\n  table th{background:#f1ede2;font-weight:600}\n  table th:last-child,table td:last-child{border-right:none}\n  table tr:last-child td{border-bottom:none}\n  .gap-wrap{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap;margin:0 1px}\n  .gap-input{font:inherit;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n    font-size:.95em;width:13ch;padding:2px 8px;border:none;border-bottom:2px solid var(--accent);\n    background:var(--accent-soft);color:var(--ink);border-radius:4px 4px 0 0;outline:none;transition:all .15s ease}\n  .gap-input:focus{background:#fff;border-bottom-color:var(--accent);box-shadow:0 2px 0 var(--accent)}\n  .gap-input.correct{background:var(--correct-soft);border-bottom-color:var(--correct);color:var(--correct);font-weight:500}\n  .gap-input.wrong{background:var(--wrong-soft);border-bottom-color:var(--wrong);color:var(--wrong);font-weight:500}\n  .gap-input.revealed{background:var(--hint-soft);border-bottom-color:var(--hint);color:var(--hint);font-weight:500;font-style:italic}\n  .gap-num{font-size:.78em;color:var(--ink-muted);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;vertical-align:super}\n  .gap-feedback{display:inline-flex;width:16px;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;font-size:.85em;font-weight:600}\n  .gap-feedback.ok::before{content:\"\\2713\";color:var(--correct)}\n  .gap-feedback.no::before{content:\"\\2717\";color:var(--wrong)}\n  .gap-feedback.show::before{content:\"\\2605\";color:var(--hint)}\n  .summary{display:none;margin:14px 0 8px;padding:12px 16px;background:#f7f4ec;border:1px solid var(--border);\n    border-left:4px solid var(--accent);border-radius:8px;font-size:15px}\n  .summary.show{display:block}\n  .summary strong{color:var(--accent)}\n  @media print{body{background:#fff}.toolbar{display:none}\n    section.chapter{box-shadow:none;border:none;padding:0}\n    .gap-input{background:transparent;border-bottom:1px solid #999}}\n  @media (max-width:640px){.page{padding:20px 16px 60px}section.chapter{padding:20px 18px}\n    .toolbar{margin:0 -16px 16px;padding:10px 16px}h2.chap-title{font-size:23px}\n    ul.outline-list{columns:1}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"page\">\n  <header class=\"intro\">\n    <p><strong>Gap-Fill Exercise — Chapter 8 Summary<\u002Fstrong><\u002Fp>\n    <p><em>Individual Differences<\u002Fem><\u002Fp>\n    <p><strong>Instructions:<\u002Fstrong> Each numbered gap targets a key word from the chapter. Type the missing word in each input — press Enter or click out to check. Use the toolbar to check all answers, reveal them, or reset.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"toolbar\" role=\"toolbar\" aria-label=\"Exercise controls\">\n    <div class=\"actions\">\n      <button class=\"btn primary\" id=\"btn-check-all\" type=\"button\">Check all answers<\u002Fbutton>\n      <button class=\"btn\" id=\"btn-reveal-all\" type=\"button\">Reveal all<\u002Fbutton>\n      <button class=\"btn ghost\" id=\"btn-reset-all\" type=\"button\">Reset<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"progress\" aria-live=\"polite\">\n      <span id=\"score-text\">0 / 63 correct<\u002Fspan>\n      <span class=\"progress-bar\"><span id=\"score-bar\"><\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"summary-top\" class=\"summary\" role=\"status\" aria-live=\"polite\"><\u002Fdiv>\n\n  <section class=\"chapter\">\n<h1 class=\"chap-num\">Chapter 8<\u002Fh1>\n<h2 class=\"chap-title\">Individual Differences<\u002Fh2>\n<p class=\"fineprint\">Introducing Second Language Acquisition: Perspectives and Practices, First Edition.<\u002Fp>\n<p class=\"fineprint\">Kirsten M. Hummel.<\u002Fp>\n<p class=\"fineprint\">© 2014 John Wiley &amp; Sons, Inc. Published 2014 by John Wiley &amp; Sons, Inc.<\u002Fp>\n<blockquote class=\"epigraph\">Differences challenge assumptions.<\u002Fblockquote>\n<p class=\"epigraph-attr\">— Anne Wilson Schaef (author, psychotherapist, 1934–)<\u002Fp>\n<aside class=\"outline\"><h5>Chapter outline<\u002Fh5><ul class=\"outline-list\"><li>8.0   Chapter overview   194<\u002Fli><li>8.1   Intelligence   194<\u002Fli><li>8.2   Language learning aptitude   195<\u002Fli><li>8.3   Attitudes and motivation   201<\u002Fli><li>8.4   Personality   205<\u002Fli><li>8.5   Learning style and cognitive style   208<\u002Fli><li>8.6   Learning strategies   211<\u002Fli><li>8.7   Summing up   214<\u002Fli><li>Key concepts   214<\u002Fli><li>Self-assessment questions   215<\u002Fli><li>Discussion questions   216<\u002Fli><li>Exercises/Project ideas   216<\u002Fli><li>Further reading and viewing   217<\u002Fli><li>References   217<\u002Fli><\u002Ful><\u002Faside>\n<h3 class=\"section-h\">8.0 chapter overview<\u002Fh3>\n<p>As in any human learning experience, there are a multitude of individual difference (ID) factors that can play a role. In learning a second language, some of the differences that have been examined are: intelligence, aptitude, attitudes, motivation, personality, learning style, cognitive style, and learning strategies. Some of these have been found to play an important role in various aspects of learning an L2, while others have not been strongly associated with L2 learning and its outcomes. We also need to consider that these factors may interact in various ways, as they are all associated with each individual language learner and cannot be examined in total isolation (for example, when measuring one learner’s motivation, that person also has certain personality <span class=\"gap-wrap\" data-gap=\"1\" data-answer=\"traits\"><input type=\"text\" class=\"gap-input\" data-gap=\"1\" aria-label=\"Gap 1\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(1)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, a characteristic learning style, etc.). It is also difficult to measure such variables in a truly objective way, as many are only accessible through various types of self reports or tests that may not fully tap the targeted ID feature. There may also be various opinions about how to define and therefore properly test a given ID. Keeping these considerations in mind, this chapter will attempt to clarify the role that IDs play in L2 learning.<\u002Fp>\n<h3 class=\"section-h\">8.1 intelligence<\u002Fh3>\n<p>One factor that has been studied for a possible link with L2 learning success, is intelligence.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"f0305cfd-78f9-499f-9ca4-6c4b75fcf789\" alt=\"image1.png\"><\u002Ffigure>\n<p>A predominant view suggests that there is a general intelligence that explains positive <span class=\"gap-wrap\" data-gap=\"2\" data-answer=\"associations\"><input type=\"text\" class=\"gap-input\" data-gap=\"2\" aria-label=\"Gap 2\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(2)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> among a number of cognitive performance measures. The psychologist Charles Spearman’s model used a single common factor, which he referred to as g for “general ability.” It has been suggested that there is a general factor underlying the ability to master and use academic skills, and it is this underlying ability to learn that is supposedly measured by intelligence (IQ) tests.<\u002Fp>\n<p>In contrast to this view of intelligence as a relatively unique trait, and one closely related to academic abilities, another view suggests that numerous types of intelligence exist. For instance, the psychologist Howard Gardner (e.g., 1983; 1993; 1999) has suggested that there are as many as nine different types of intelligence: mathematical-logical, verbal-linguistic, musical-rhythmic, bodily-kinesthetic, interpersonal, intrapersonal, visual-<span class=\"gap-wrap\" data-gap=\"3\" data-answer=\"spatial\"><input type=\"text\" class=\"gap-input\" data-gap=\"3\" aria-label=\"Gap 3\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(3)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, naturalist, and existential intelligences. According to Gardner, the criteria used to identify intelligence include: “the ability to solve problems,” “a biological proclivity,” and “an identifiable neurological core operation or set of operations,” and intelligence “is susceptible to encoding in a symbol system . . . which captures and conveys important forms of information” (Gardner, 1999, pp. 15–16). Gardner’s multiple intelligence proposal holds much appeal, in particular among researchers and practitioners in education. Others (e.g., Sternberg, 1991) dispute the idea of multiple intelligences, arguing that Gardner confuses “talent” with “intelligence.”<\u002Fp>\n<p>Other views of intelligence include Sternberg’s (1985; 1988), in which he identifies three specific characteristics: <span class=\"gap-wrap\" data-gap=\"4\" data-answer=\"componential\"><input type=\"text\" class=\"gap-input\" data-gap=\"4\" aria-label=\"Gap 4\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(4)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> ability for analytic thinking; experiential ability to engage in creative thinking; and contextual ability, i.e., control over one’s environment.<\u002Fp>\n<p>A few studies have specifically included a measure of intelligence in examining possible links with L2 learning. One early study in Canada (Genesee, 1976) sought to examine whether standard intelligence (IQ) test measures correlated with aspects of L2 performance. The participants in this study were English native-speaking children learning French in the province of Quebec at grade levels 4, 7, and 11, enrolled in two types of language programs: immersion and a more traditional language program. The children were tested on L2 French reading skills, French grammar, auditory comprehension and interpersonal communication. The results revealed that performance on the reading, grammar, and math tests were correlated with the IQ test measures, while the <span class=\"gap-wrap\" data-gap=\"5\" data-answer=\"auditory\"><input type=\"text\" class=\"gap-input\" data-gap=\"5\" aria-label=\"Gap 5\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(5)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> comprehension and interpersonal communication tests were not.<\u002Fp>\n<p>Results such as these indicating a relationship between scores on an intelligence test and academic skills can be interpreted in terms of a distinction made by Cummins (1979). Cummins proposed that there are two <span class=\"gap-wrap\" data-gap=\"6\" data-answer=\"fundamentally\"><input type=\"text\" class=\"gap-input\" data-gap=\"6\" aria-label=\"Gap 6\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(6)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> distinct types of skills: 1) cognitive/academic language proficiency (CALP), which consists of skills requiring abstract language abilities (analysis, synthesis, etc.) useful in carrying out academic-related tasks; and 2) basic interpersonal communicative skills (BICS), consisting of skills useful in carrying out face-to-face personal communication, as in conversations. The relationship found in the Genesee (1976) study between IQ scores and reading, grammar, and math tests, but not those involving auditory comprehension or oral production tests suggests that IQ as traditionally measured may play a role in CALP type skills, but not in those involving interpersonal skills, or BICS.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"ba7f387e-f5f9-4bed-b7b2-1c83a6750d9f\" alt=\"image2.png\"><\u002Ffigure>\n<h3 class=\"section-h\">8.2 language learning aptitude<\u002Fh3>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>When Steve was studying Mandarin at his Midwest university before his stay in Beijing, other students often told him he appeared to have a talent for language learning. Whereas some of his fellow students struggled to produce basic sentences of the language, Steve’s simple utterances were close replications of those of the native speaker language instructor. Steve appeared to have an “aptitude” for learning the grammatical patterns of Mandarin.<\u002Fp><\u002Faside>\n<p>A factor that has received considerable attention in relation to L2 learning is language learning aptitude. In any given group of language learners, it is not unusual to note that a few individuals, like Steve learning Mandarin, appear to make rapid progress or <span class=\"gap-wrap\" data-gap=\"7\" data-answer=\"excel\"><input type=\"text\" class=\"gap-input\" data-gap=\"7\" aria-label=\"Gap 7\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(7)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> at one or several aspects of language skill abilities, for example, speaking or listening comprehension, while others appear to struggle under the same learning circumstances and with similar language experience backgrounds.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"fa367acf-f4f5-47c0-8451-a0cd2b5e53ad\" alt=\"image3.png\"><\u002Ffigure>\n<p>Aptitude has been succinctly defined as “language learning ability” (Dornyei, 2005, p. 32) and consists of “basic abilities that are essential to facilitate foreign language learning” (Carroll &amp; Sapon, 1959, p. 14). It has also been described as a characteristic controlling the rate of progress that an individual will make in learning a foreign language (Carroll, 1974) and much of the traditional research in this perspective has tended to explore early learning stages. Aptitude can also be examined in relation to ultimate attainment, i.e., to what degree an individual approaches native-like <span class=\"gap-wrap\" data-gap=\"8\" data-answer=\"proficiency\"><input type=\"text\" class=\"gap-input\" data-gap=\"8\" aria-label=\"Gap 8\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(8)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> with respect to a given L2 skill or skills (pronunciation, grammar, etc.).<\u002Fp>\n<p>The psychologist, John Carroll, a noted authority in describing and testing language learning aptitude, pointed out four distinct characteristics associated with <span class=\"gap-wrap\" data-gap=\"9\" data-answer=\"aptitude\"><input type=\"text\" class=\"gap-input\" data-gap=\"9\" aria-label=\"Gap 9\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(9)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (1981): 1) it must be shown to be separate from general IQ and achievement; 2) it must be shown to be separate from motivation; 3) it is a stable factor, perhaps innate; and 4) it is viewed not as prerequisite for SLA, but as capacity that enhances rate and ease of learning.<\u002Fp>\n<p>A number of test batteries have been constructed in order to evaluate and measure aptitude. The most well known of these, Carroll and Sapon’s Modern Language Aptitude Test (MLAT, 1959) was developed as part of a five-year research project to help the US Army identify individuals who would be able to learn foreign languages very rapidly in the context of traditional formal classrooms. In the full, or long form, the MLAT is considered to measure three different aptitude components through five different subtests: phonetic coding ability, consisting of the ability to analyze and retain new sounds (Part 1, number learning; Part 2, phonetic script; Part 3, spelling clues); grammatical sensitivity, or the ability to identify the functions words play in sentences (Part 4, words in sentences), and <span class=\"gap-wrap\" data-gap=\"10\" data-answer=\"associative\"><input type=\"text\" class=\"gap-input\" data-gap=\"10\" aria-label=\"Gap 10\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(10)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> or rote memory, the ability to memorize new vocabulary items (Part 5: paired associates). Another aptitude component proposed by Carroll “inductive language learning,” the ability to infer rules from language material, was not explicitly measured in the MLAT. A short form of the MLAT consists of only three subtests (Parts III, IV, and V).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"3b13ccf2-5033-46b6-8886-1bc4a9d70c6e\" alt=\"image4.png\"><\u002Ffigure>\n<p>Research on the relation between MLAT scores and language learning achievement shows that approximately 20% to 35% of variance, indicating a fair amount of influence, can be <span class=\"gap-wrap\" data-gap=\"11\" data-answer=\"attributed\"><input type=\"text\" class=\"gap-input\" data-gap=\"11\" aria-label=\"Gap 11\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(11)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to aptitude (see discussions by Carroll, 1981; Dornyei &amp; Skehan, 2003; Sawyer &amp; Ranta, 2001).<\u002Fp>\n<p>Further research on aptitude led to the proposal that the components “grammatical sensitivity” and “inductive language learning” in Carroll’s description of aptitude were basically similar and could be considered as aspects of “language analytic ability.” For instance, Skehan (1989; 1998) proposed that aptitude is essentially composed of three main abilities: phonetic <span class=\"gap-wrap\" data-gap=\"12\" data-answer=\"coding\"><input type=\"text\" class=\"gap-input\" data-gap=\"12\" aria-label=\"Gap 12\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(12)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> ability, language analytic ability, and memory ability. The view that aptitude is comprised of a number of distinct components has been generally accepted (e.g., Sparks, Patton, Ganschow, &amp; Humbach, 2011).<\u002Fp>\n<figure class=\"fig-box\"><figcaption>Figure 8.1  Examples of MLAT items (Carroll and Sapon, 1959)<\u002Ffigcaption><div class=\"fig-body\"><div class=\"fig-line\">Part I: Number learning (phonetic coding ability)<\u002Fdiv><div class=\"fig-line\">Numbers in an invented language are spoken and listener attempts to write down items.<\u002Fdiv><div class=\"fig-line\">“ba” is “one”, ‘baba’ is two, ‘dee’ is three, ‘tu’ is twenty, so ‘tu-ba’ is twenty-one, etc.<\u002Fdiv><div class=\"fig-line\">Write down the number you hear, 23:<\u002Fdiv><div class=\"fig-line\">   a. ti-dee     b. baba     c. ba-dee     d. tu-dee<\u002Fdiv><div class=\"fig-line\">Part II: Phonetic script (phonetic coding ability)<\u002Fdiv><div class=\"fig-line\">Listener must choose item that matches spoken item, after exposure to set of items with similar sounds.<\u002Fdiv><div class=\"fig-line\">Choose spoken item ‘bov’: bok, buk, bov, bof<\u002Fdiv><div class=\"fig-line\">Part III: Spelling cues (phonetic coding ability)<\u002Fdiv><div class=\"fig-line\">Choose item that corresponds most closely in meaning to the disguised word.<\u002Fdiv><div class=\"fig-line\">1. kloz     a. attire     b. nearby     c. stick     d. giant     e. relatives<\u002Fdiv><div class=\"fig-line\">Part IV: Words in sentences (grammatical sensitivity)<\u002Fdiv><div class=\"fig-line\">Choose the letter of the word in the second sentence that plays the same role in that sentence as the underlined word in the key sentence.<\u002Fdiv><div class=\"fig-line\">1. MARY is happy.<\u002Fdiv><div class=\"fig-line\">From the look on your face, I can tell that you must have had a bad day.<\u002Fdiv><div class=\"fig-line\">Part V: Paired Associates (rote memory)<\u002Fdiv><div class=\"fig-line\">Memorize words and their English equivalents.<\u002Fdiv><div class=\"fig-line\">Example: kab = juice<\u002Fdiv><div class=\"fig-line\">kab:     a. juice     b. cart     c. corn     d. tool     e. run<\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<p>L1 skill has been linked with L2 aptitude, and in some research, with L2 proficiency as well. The Bristol Language Project (Wells, 1985) studied a number of aspects of L1 learning in 125 young children in the UK and found important differences in the rate of their L1 development. Skehan (1986; 1989) reports results from a follow-up of approximately 100 students from the original study some 12 years later. While it was found that the high school students’ L2 scores (French, German) were linked with aptitude test results, the more surprising result was that L1 development before age five (e.g., rate of MLU development, sentence complexity) was linked with language aptitude, in particular with language analytic scores, in these 13- to 14-year-old high school students. In a more recent study, researchers found a relationship between L1 skills (such as word decoding and other <span class=\"gap-wrap\" data-gap=\"13\" data-answer=\"literacy\"><input type=\"text\" class=\"gap-input\" data-gap=\"13\" aria-label=\"Gap 13\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(13)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>-related skills) measured in elementary school and later measures of L2 aptitude and L2 proficiency in high school (e.g., Sparks, Patton, Ganschow, &amp; Humbach, 2009).<\u002Fp>\n<p>Aptitude may have different effects on learners at different stages. In this regard, a study by Winke (2005) found that components of aptitude (measured by the MLAT) were associated with learning at beginning levels, but not at advanced levels in English native speakers learning Mandarin. On the other hand, another study (Harley &amp; Hart, 1997) found that aptitude played a role in L2 performance for both more advanced grade 11 immersion students (starting in grade 1) and less advanced (starting in grade 7) immersion students. It is also conceivable that the role of different aptitude components (phonetic coding ability, language <span class=\"gap-wrap\" data-gap=\"14\" data-answer=\"analytic\"><input type=\"text\" class=\"gap-input\" data-gap=\"14\" aria-label=\"Gap 14\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(14)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> ability, memory) may differ according to learning stage. For instance, phonetic coding ability, the ability to process and remember new sounds and sound combinations, may be particularly important at beginning stages.<\u002Fp>\n<p>There is also acknowledgment that different teaching and learning contexts may require different aptitude components. Robinson (2002) has pointed out that predictive validity for the MLAT was originally reached through correlations between the MLAT and results in classrooms characterized by an audiolingual approach to L2 learning. He suggests that today’s greater recourse to communicative classrooms requires “. . . a measure of aptitude that reflects the processing demands of <span class=\"gap-wrap\" data-gap=\"15\" data-answer=\"simultaneous\"><input type=\"text\" class=\"gap-input\" data-gap=\"15\" aria-label=\"Gap 15\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(15)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> attention to form and meaning, with its attendant demands on working memory . . .” (p. 215).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"6e81c8c1-db4c-4a25-bdc0-f9a5c1b4832d\" alt=\"image5.png\"><\u002Ffigure>\n<p>Indeed, one aspect of language learning ability that is not directly assessed in traditional aptitude test batteries is working memory (WM), as well as a subsystem of WM, phonological short-term memory (in short, phonological memory or PM). In terms of memory and aptitude testing, the MLAT includes one <span class=\"gap-wrap\" data-gap=\"16\" data-answer=\"subtest\"><input type=\"text\" class=\"gap-input\" data-gap=\"16\" aria-label=\"Gap 16\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(16)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of associative, or rote, memory, but even Carroll voiced doubts about the validity of that subtest (Carroll, 1990). Other subtests (e.g., phonetic coding, spelling clues) are thought to draw on memory indirectly, requiring at least some use of phonological memory.<\u002Fp>\n<p>WM has been suggested as an aptitude component (Dornyei, 2005; Miyake &amp; Friedman, 1998; Sawyer &amp; Ranta, 2001). WM is considered to be an active system for temporarily storing and manipulating information needed in the <span class=\"gap-wrap\" data-gap=\"17\" data-answer=\"execution\"><input type=\"text\" class=\"gap-input\" data-gap=\"17\" aria-label=\"Gap 17\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(17)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of complex cognitive tasks, such as the comprehension of verbal material (Baddeley, 2003). One can think of it as a mental workspace. An important feature of the WM system is that its overall capacity is limited. A typical example that illustrates its capacity limitations is what happens when a person attempts to carry out several tasks at the same time. For example, you might be perfectly able to write a short newsy text to a friend on your smartphone while at the same time carrying on a conversation with another friend. However, if you have to compose a complicated message you might find yourself needing to drop out of the conversation in order to focus on writing the text message: you need full concentration.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"787d851d-050d-4525-a7ce-e8ed2df16201\" alt=\"image6.png\"><\u002Ffigure>\n<p>The central executive component of WM (see figure 8.2) is thought to be the locus of coordinating all the other components of the system and is responsible for controlling and directing attention. It is often measured by reading <span class=\"gap-wrap\" data-gap=\"18\" data-answer=\"span\"><input type=\"text\" class=\"gap-input\" data-gap=\"18\" aria-label=\"Gap 18\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(18)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> tasks that require both storage and processing functions, i.e., remembering and managing information when interfering information is present (often tested by having a person read increasingly larger sets of sentences and having to remember the final word, while at the same time having to determine whether the sentences are true or false). Some studies have indeed indicated links between WM capacity and L2 proficiency (e.g., Harrington &amp; Sawyer, 1992; Miyake &amp; Friedman, 1998).<\u002Fp>\n<p>Another part of the WM model that is considered important for language learning is phonological memory, the subsystem responsible for temporary maintenance of acoustic or speech-based information (represented by the phonological loop component in the Working Memory Model). Phonological memory has therefore been suggested as another important component of language learning aptitude (e.g., Dornyei &amp; Skehan, 2003; Ellis, 1996; Gathercole &amp; Thorn, 1998; Robinson, 2005). PM can be illustrated by the memory processes that go into effect when trying to remember a 7-digit phone number one has just heard. PM can hold information for only a few seconds and will be lost if not repeated or rehearsed. If the information is <span class=\"gap-wrap\" data-gap=\"19\" data-answer=\"rehearsed\"><input type=\"text\" class=\"gap-input\" data-gap=\"19\" aria-label=\"Gap 19\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(19)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> repeatedly, it can be transferred to long-term memory. PM is sometimes tested by having individuals attempt to remember and repeat back nonwords of various lengths, with the ability to repeat longer nonwords as an indicator of larger PM capacity. A number of studies have found strong links between PM and L2 acquisition. Service (1992; Service &amp; Kohonen, 1995) found that Finnish-speaking children with larger PM capacity were better at learning L2 (English) vocabulary when tested over two and a half years after a first testing. PM has also been found linked to L2 vocabulary learning in adolescents (Cheung, 1996; French, 2006; Hu, 2003) and adults (e.g., Abdallah, 2010; Atkins &amp; Baddeley, 1998). It has also been found to play a role in the acquisition of L2 grammar (Baddeley, Gathercole, &amp; Papagno, 1998; Ellis &amp; Sinclair, 1996; French &amp; O’Brien, 2008), L2 oral fluency (O’Brien, Segalowitz, Freed, &amp; Collentine, 2007) and is linked to general L2 proficiency (Hummel, 2009). Other studies suggest that PM and L2 learning are linked in beginning and intermediate learners while other factors may outweigh the influence of PM in more advanced learners (e.g., Abdallah, 2010; Cheung, 1996).<\u002Fp>\n<aside class=\"practice-box\"><h5>Language learning in practice: WM and the classroom<\u002Fh5><p>Knowing that learners vary in WM capacity, teachers can attempt to adapt classroom-based learning to this fact. For instance, they can make sure that sufficient <span class=\"gap-wrap\" data-gap=\"20\" data-answer=\"exposure\"><input type=\"text\" class=\"gap-input\" data-gap=\"20\" aria-label=\"Gap 20\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(20)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to written material is provided so that learners exposed to new vocabulary and sentence patterns can refresh their memories in ways that they cannot when only exposed to an auditory presentation. Also, tasks can be divided up into shorter segments rather than long, complex exercises that may overtax their memory capacity. Recent research also shows that specific training can lead to greater WM capacity. While a few studies have involved typically developing children (e.g., Loosli, Buschkuehl, Perrig, &amp; Jaeggi, 2012), more studies have been carried out with children diagnosed with ADHD (attention deficit hyperactivity disorder). Researchers (Klingberg et al., 2005) have found that children trained to do computerized WM tasks approximately 30 minutes per day, five days a week, for five weeks, improved their performance on WM tasks and these effects also transferred to tasks not included in the training program. Studies (Holmes, Dunning, &amp; Gathercole, 2009; Klingberg et al., 2005) also found that effects remained significant when children were retested 3 to 6 months later. There is some evidence that phonological memory can also be developed through training (Maridaki-Kassotaki, 2002). Although there is unlikely to be a quick fix to increasing memory capacity, ultimately perhaps training programs will be developed to improve aspects of working memory of learners who appear to have lower capacity, with beneficial effects on L2 learning.<\u002Fp><\u002Faside>\n<p>Much remains to be investigated in the area of aptitude, especially since it is often considered that aptitude is one of the most promising of ID <span class=\"gap-wrap\" data-gap=\"21\" data-answer=\"variables\"><input type=\"text\" class=\"gap-input\" data-gap=\"21\" aria-label=\"Gap 21\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(21)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> for predicting L2 success: “Research makes it clear that in the long run language aptitude is probably the single best predictor of achievement in an L2” (Gardner &amp; MacIntyre, 1992, p. 215).<\u002Fp>\n<h3 class=\"section-h\">8.3 attitudes and motivation<\u002Fh3>\n<figure class=\"ch-img\"><img src=\"ced1256a-b106-4e03-a735-39d638d8155f\" alt=\"image7.png\"><\u002Ffigure>\n<p>Previous research (e.g., Gardner &amp; Lambert, 1972) indicates that the socio-psychological factors of attitudes and motivation are closely related to L2 learning <span class=\"gap-wrap\" data-gap=\"22\" data-answer=\"perseverance\"><input type=\"text\" class=\"gap-input\" data-gap=\"22\" aria-label=\"Gap 22\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(22)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> and success. Motivation, in particular, is commonly cited (see Dornyei, 2001, for a review) as playing a major role in any learning situation, including learning another language.<\u002Fp>\n<p>Attitude can be defined as a predisposition or tendency to respond in an evaluative manner toward someone or something. In terms of L2 learning, some <span class=\"gap-wrap\" data-gap=\"23\" data-answer=\"dimensions\"><input type=\"text\" class=\"gap-input\" data-gap=\"23\" aria-label=\"Gap 23\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(23)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> along which attitudes may vary include: 1) attitudes toward the L2 community and L2 speakers; 2) attitudes toward learning the target language (TL); and 3) attitudes toward languages and language learning in general. A given individual might have favorable attitudes toward L2 speakers, yet hold negative attitudes toward language learning.<\u002Fp>\n<p>The Canadian psychologist Robert Gardner (1979; 1985) has made substantial contributions to describing the role of attitudes and motivation in L2 learning in terms of his socioeducational model (see figure 8.3 for overall schema). He proposes that attitudes are related to motivation by serving as supports to the learner’s overall <span class=\"gap-wrap\" data-gap=\"24\" data-answer=\"orientation\"><input type=\"text\" class=\"gap-input\" data-gap=\"24\" aria-label=\"Gap 24\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(24)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. This suggests a linear relationship in the sense that attitudes affect motivation, which, in turn affects acquisition. Therefore attitudes are presumed to have an important, albeit indirect, effect on acquisition.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"06b6b23c-1c4b-420f-8fd8-848a68574e7e\" alt=\"image8.png\"><\u002Ffigure>\n<p>Motivation in L2 learning has been defined by Gardner (1985) as consisting of effort to learn the language (motivational <span class=\"gap-wrap\" data-gap=\"25\" data-answer=\"intensity\"><input type=\"text\" class=\"gap-input\" data-gap=\"25\" aria-label=\"Gap 25\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(25)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>), desire to learn the language, and attitudes toward learning the language, expressed as a formula:<\u002Fp>\n<p class=\"formula\">Motivation = Effort + Desire to achieve goal + Attitudes toward learning the language<\u002Fp>\n<figure class=\"ch-img\"><img src=\"4f5a2764-710b-4fa4-8253-80b8047fe241\" alt=\"image9.png\"><\u002Ffigure>\n<p>Gardner (1985) developed a tool to measure motivation, the Attitude/Motivation Test Battery (AMTB) that has been widely used and adapted for use in various language learning contexts. It was originally developed for use with English-speaking Canadians learning French as a second language. Applications of various versions of the AMTB in different contexts, as well as studies using other instruments, have generally confirmed that motivation appears to be an important factor in second language <span class=\"gap-wrap\" data-gap=\"26\" data-answer=\"acquisition\"><input type=\"text\" class=\"gap-input\" data-gap=\"26\" aria-label=\"Gap 26\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(26)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (Clément, Dornyei, &amp; Noels, 1994; Clément &amp; Kruidenier, 1985; Gardner &amp; Lambert, 1972; Gardner, Tremblay, &amp; Masgoret, 1997; Noels, 2001; Oxford &amp; Shearin, 1994; Samimy &amp; Tabuse, 1992).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"5a450f76-10bc-4fb7-bacb-3ea55254650c\" alt=\"image10.png\"><\u002Ffigure>\n<p>A frequent distinction made with respect to motivation is one between intrinsic and extrinsic types. Intrinsic motivation is defined as: “<span class=\"gap-wrap\" data-gap=\"27\" data-answer=\"Intrinsically\"><input type=\"text\" class=\"gap-input\" data-gap=\"27\" aria-label=\"Gap 27\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(27)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> motivated behaviours aimed at bringing about internally rewarding consequences . . . feelings of competence and self-determination.” For instance, an intrinsically motivated language learner may desire to become an excellent speaker of the target language, due to a personal desire to excel. Extrinsic motivation is defined as: “Anticipation of reward from outside and beyond the self” (material and nonmaterial rewards). An example of an extrinsically motivated language learner might be someone who considers better language skills will lead to getting higher paying or more prestigious employment.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"732757d7-36bb-45e5-b1e5-00d370a446e7\" alt=\"image11.png\"><\u002Ffigure>\n<p>Related to the notions of intrinsic and extrinsic motivation are what have been referred to as “orientations” to language learning; Gardner (2010, p. 16) defines an orientation as “an overall aim, purpose, direction, and/or goal of the activity. An orientation is an <span class=\"gap-wrap\" data-gap=\"28\" data-answer=\"inclination\"><input type=\"text\" class=\"gap-input\" data-gap=\"28\" aria-label=\"Gap 28\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(28)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, the underlying force directing the choice of the particular reason.” An orientation is therefore not merely groupings of reasons for learning an L2, which is how the term has at times been interpreted. Different underlying orientations within motivation have been identified. In particular, Gardner and Lambert (1972) differentiated between an integrative orientation, involving a desire to know more about and identify with the target language community, and an instrumental orientation, when instrumental reasons primarily motivate the language study. Research has revealed that both integrative and instrumental motivational orientations can be effective, depending on the situation, although an integrative orientation may be particularly effective in the long term. It is recognized that other types of orientations are possible as well (e.g., Clément &amp; Kruidenier, 1983). Distinctions between intrinsic and extrinsic motivation, and integrative and instrumental orientations are illustrated in Table 8.1 (Brown, 2007, p. 175, referring to Bailey, 1986).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"f7ca23fd-dbc3-40ab-aa64-001b3019a896\" alt=\"image12.png\"><\u002Ffigure>\n<p class=\"tbl-caption\">Table 8.1  Distinctions among types of motivation (adapted from Brown, 2007, p. 175).<\u002Fp>\n<div class=\"table-wrap\"><table><tbody><tr><th>Intrinsic<\u002Fth><th>Extrinsic<\u002Fth><\u002Ftr><tr><td>Integrative: L2 learner wishes to integrate with L2 cultural group (e.g., immigration, marriage)<\u002Ftd><td>Integrative: Someone wishes learner to know L2 for integrative reasons (e.g., parents desire child learns heritage language)<\u002Ftd><\u002Ftr><tr><td>Instrumental: L2 learner wishes to achieve goals using L2 (e.g., a career)<\u002Ftd><td>Instrumental: External agent wants L2 learner to learn L2 (e.g., the goal of one’s employer)<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>The distinction between intrinsic and extrinsic motivation is related to research pursued in self-determination theory (Deci &amp; Ryan, 1985) which studies the <span class=\"gap-wrap\" data-gap=\"29\" data-answer=\"interplay\"><input type=\"text\" class=\"gap-input\" data-gap=\"29\" aria-label=\"Gap 29\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(29)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> between external and internal sources of motivation. Self-determination theory has been applied to L2 research (e.g., Noels, Pelletier, Clément, &amp; Vallerand, 2000), and the development of measurement instruments such as The Language Learning Orientations Scale (Noels et al., 2000) has allowed researchers to measure the degree to which language learners are more or less intrinsically or extrinsically motivated.<\u002Fp>\n<p>It is important to note that motivation is not static, but is something that can change over time. The fact that language learning requires a long-term investment has led to an emphasis on the ebb and flow of motivation across time. In a process-oriented approach, it is proposed that there are distinct phases in which factors influencing motivation may play different roles (e.g., Dornyei &amp; Ottó, 1998). For instance, Dornyei and Ottó proposed an initial “preactional stage” in which motivation is generated, an “actional stage” during which motivation is actively maintained, and a “postactional stage” in which learners retroactively evaluate their experiences. In a subsequent description Dornyei (2001) uses the terms “choice motivation,” “executive motivation,” and “motivational <span class=\"gap-wrap\" data-gap=\"30\" data-answer=\"retrospection\"><input type=\"text\" class=\"gap-input\" data-gap=\"30\" aria-label=\"Gap 30\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(30)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>” for these three phases, respectively. He points out that “executive motivation,” the phase when motivation needs to be maintained and protected, has particular importance for classroom learning, given student tendencies to be distracted by other interests or obligations. Dornyei also emphasizes the critical role played by motivational strategies on the part of teachers, defined as “motivational influences that are consciously exerted to achieve some systematic and enduring positive effect” (Dornyei, 2001, p. 28).<\u002Fp>\n<figure class=\"ch-img\"><img src=\"99af9371-196a-47a0-9a30-2978a140e8fd\" alt=\"image13.png\"><\u002Ffigure>\n<p>The context of learning can have an important effect on degree and type of motivation (e.g., Belmechri &amp; Hummel, 1998; Dornyei, 2000; Dornyei &amp; Skehan, 2003). Some possible contextual factors include the degree of formality of the learning environment, as well as whether the target language is spoken in the surrounding community or not. The important role played by social context in motivation, and, in particular, active involvement with target language speakers, has been widely recognized: “The major motivation to learn another language is to develop a <span class=\"gap-wrap\" data-gap=\"31\" data-answer=\"communicative\"><input type=\"text\" class=\"gap-input\" data-gap=\"31\" aria-label=\"Gap 31\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(31)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> relationship with people from another cultural group” (MacIntyre, 2007, p. 566).<\u002Fp>\n<p>In a recent framework for considering L2 motivation, Dornyei (2005) proposes what he terms the “L2 motivational self system,” composed of three dimensions: the ideal L2 self, the ought-to self, and the L2 learning experience. In particular, Dornyei proposes that Gardner’s central notion of “integrativeness” would fit into the motivational self system, as part of the “ideal L2 self” dimension. For Dornyei: “If the person we would like to become speaks an L2, the Ideal L2 Self is a powerful motivator to learn the L2 because of the desire to reduce the <span class=\"gap-wrap\" data-gap=\"32\" data-answer=\"discrepancy\"><input type=\"text\" class=\"gap-input\" data-gap=\"32\" aria-label=\"Gap 32\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(32)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> between our actual and ideal selves” (Dornyei, 2005, p. 105). The “ought-to self” corresponds to characteristics one considers he or she should have, and in this respect is similar to the notion of extrinsic or instrumental motivation. Finally, Dornyei’s proposed third component, the “L2 learning experience” refers to motives that stem from specific learning environments and situations. As the L2 motivational self system is a fairly recent proposal, further research will indicate more precisely how the concept may advance our understanding of L2 motivation.<\u002Fp>\n<aside class=\"practice-box\"><h5>Language learning in practice: 10 commandments to motivate language learners (from Dornyei &amp; Csizér, 1998)<\u002Fh5><p>1. Set a personal example with your own behavior.2. Create a pleasant, relaxed atmosphere in the classroom.3. Present the tasks properly.4. Develop a good relationship with the learners.5. Increase the learners’ linguistic self-confidence.6. Make the language classes interesting.7. Promote learner autonomy.8. Personalize the learning process.9. Increase the learners’ goal-orientedness.10. Familiarize learners with the target language culture.<\u002Fp><\u002Faside>\n<h3 class=\"section-h\">8.4 personality<\u002Fh3>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>Xia Mei, the immersion student of English in Hong Kong, has an exuberant personality. She was often the first to volunteer for class presentations and as a result she gained increasing practice in speaking English in front of groups. Her teachers considered her to have an extraverted personality and some of them thought that her personality contributed to her relatively rapid acquisition of oral fluency. On the other hand, Mila, the immigrant from Bosnia, has a reflective, introverted personality. She rarely volunteered answers in her ESL classes during the months following her immigration to the US. She was quick to explain that her shy personality made it more difficult for her to acquire fluency in English, but in contrast she was often the best in her language class when it came to written grammar and reading comprehension exercises.<\u002Fp><\u002Faside>\n<p>Another factor that has been examined for possible links with L2 learning outcomes is personality. It is not unusual for people to suggest that a given language learner’s personality plays a role in his or her success, as exemplified by the connections teachers made between Xia Mei’s outgoing personality and her English fluency. Individuals themselves are often quite aware of their own personality characteristics and, rightly or wrongly, might <span class=\"gap-wrap\" data-gap=\"33\" data-answer=\"attribute\"><input type=\"text\" class=\"gap-input\" data-gap=\"33\" aria-label=\"Gap 33\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(33)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> their success or lack of success in language learning to those factors, as we see in Mila’s case.<\u002Fp>\n<p>Personality variables are sometimes poorly defined, and overlap with other variables, but there are increasingly more precise descriptive models along with more specific measurement instruments being developed. Some of the aspects of personality that have been studied include: inhibition, risk-taking, anxiety, empathy, and <span class=\"gap-wrap\" data-gap=\"34\" data-answer=\"extraversion\"><input type=\"text\" class=\"gap-input\" data-gap=\"34\" aria-label=\"Gap 34\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(34)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>/introversion.<\u002Fp>\n<p>There tends to be support for the view that personality can affect L2 learning. In one survey (Griffiths, 1991) carried out among 98 ESL/EFL teachers in Great Britain, Japan, and Oman, the teachers gave an average score of “4” on a 1 to 5 scale for the importance of <span class=\"gap-wrap\" data-gap=\"35\" data-answer=\"personality\"><input type=\"text\" class=\"gap-input\" data-gap=\"35\" aria-label=\"Gap 35\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(35)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in second language learning, a score that was slightly higher than that given to IQ and slightly lower than memory.<\u002Fp>\n<p>The Myers-Briggs Type Indicator (MBTI) questionnaire is often used to measure personality. It includes 16 personality types, and based on the test, individuals score on four dimensions:<\u002Fp>\n<p>1. Introversion vs Extraversion<\u002Fp>\n<p>2. Intuition vs Sensing<\u002Fp>\n<p>3. Thinking vs Feeling<\u002Fp>\n<p>4. Judging vs. Perceiving<\u002Fp>\n<p>For example, an individual could be characterized as ESTJ, that is, comprised of the dimensions: Extraversion, Sensing, Thinking, and Judging.<\u002Fp>\n<p>There are two main models that propose an examination of personality through the identification of basic personality components, referred to as “traits,” i.e., personality features that are relatively stable and perhaps innately determined. One of these descriptive models is known as the “Big Five” view (Costa &amp; McCrae, 1985; Norman, 1963) which developed out of psychologist Raymond Cattell’s research (Cattell, 1946; 1957) identifying 16 personality factors which ultimately were reduced to five basic factors: extraversion (E), <span class=\"gap-wrap\" data-gap=\"36\" data-answer=\"agreeableness\"><input type=\"text\" class=\"gap-input\" data-gap=\"36\" aria-label=\"Gap 36\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(36)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (A), conscientiousness (C), neuroticism (N), and openness to experience (O).<\u002Fp>\n<p>A second model grew out of the research of the German psychologist Hans Eysenck who ultimately proposed three bi-polar dimensions representing possible extremes for each dimension: 1) psychoticism (P); 2) extraversion (E); 3) neuroticism (N). Eysenck (1967) hypothesized that personality has a biological basis. In particular, he proposed that the extraversion/introversion dimension has a direct link to specific neurophysiological mechanisms associated with arousal in the central nervous system. According to this view, the reticulo-cortical circuit produces <span class=\"gap-wrap\" data-gap=\"37\" data-answer=\"overarousal\"><input type=\"text\" class=\"gap-input\" data-gap=\"37\" aria-label=\"Gap 37\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(37)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> in the introvert’s brain, while the extraverted individual is underaroused. This leads to the introvert’s tendency to avoid additional sources of stimulation, and the extravert’s proclivity to find highly stimulating activities.<\u002Fp>\n<p>Eysenck (Eysenck &amp; Eysenck, 1985) proposed further links between these different degrees of arousal and memory. Because of the introvert’s ongoing higher state of nervous system arousal, although the arousal interferes with short-term memory (STM), it is presumed to be facilitative for long-term memory (LTM) since high arousal allows a memory trace to last longer, allowing introverts to encode for long-term retention. L2 researchers (Dewaele &amp; Furnham, 1999) have proposed specific <span class=\"gap-wrap\" data-gap=\"38\" data-answer=\"repercussions\"><input type=\"text\" class=\"gap-input\" data-gap=\"38\" aria-label=\"Gap 38\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(38)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of this view for L2 performance. They suggest that the introvert’s limited STM capacity in stressful conditions (when the arousal level is overstimulated), as in formal situations, leads to lower oral production scores which depend more on STM. On the other hand, extraverted individuals’ lower overall arousal allows full STM capacity, which ultimately gives them an advantage in output, as in conversational interactions. Extraverts are thus aided in conversational activities due to their better resistance to physiological stress and lower anxiety. In contrast, introverts are at an advantage in activities requiring reflective attention and recourse to LTM (as in performance on grammatical tasks). The review of previous studies carried out by Dewaele and Furnham supported these hypotheses (1999, p. 532): “extraverts were found to be generally more fluent than the introverts both in the L1 and L2.” Furthermore, these researchers suggest that there may be a trade-off between speed and accuracy, such that the extravert’s oral production speed is at the cost of lesser accuracy.<\u002Fp>\n<p>Other studies have also examined aspects of personality in relation to L2 abilities. In a small-scale study of the social styles of 13 Spanish-speaking kindergarten children, Strong (1983) found that a social style such as “talkativeness” observed in the L1 was associated with L2 oral proficiency. A study with EFL learners in Indonesia (Carrell, Prince, &amp; Astika, 1996) examined the relation between the extraversion–introversion personality dimension and L2 proficiency, measured by vocabulary tests and the final course grade. Results revealed that students who were tagged as introverts had higher results than extraverts. The best students were the introverts, although taken as a whole, there were few differences associated with personality. The researchers proposed that it may be that the <span class=\"gap-wrap\" data-gap=\"39\" data-answer=\"academic\"><input type=\"text\" class=\"gap-input\" data-gap=\"39\" aria-label=\"Gap 39\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(39)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> system corresponds better with introverted individuals or that these latter are simply more persistent in their academic studies.<\u002Fp>\n<p>Other research has examined communicative competence and its relation with personality. Researchers (Verhoeven &amp; Vermeer, 2002) focused on the communicative competence of 6th grade L1 and L2 learners and personality dimensions based on the “Big Five” factors, described above. Their study showed that three basic components characterized L1 and L2 learners’ communicative competence: organizational competence, <span class=\"gap-wrap\" data-gap=\"40\" data-answer=\"pragmatic\"><input type=\"text\" class=\"gap-input\" data-gap=\"40\" aria-label=\"Gap 40\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(40)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> competence, and strategic competence. As for the personality dimensions, the researchers found that L2 learning depended largely on “openness to experience, and, to a lesser extent, conscientiousness in building basic and pragmatic skills and monitoring strategies” (Verhoeven &amp; Vermeer, 2002, p. 372). The authors point out that the “openness to experience” factor is likely to facilitate the development of integrative motivation.<\u002Fp>\n<p>While there are intriguing findings linking aspects of personality with L2 performance, in particular with regard to the <span class=\"gap-wrap\" data-gap=\"41\" data-answer=\"hypothesized\"><input type=\"text\" class=\"gap-input\" data-gap=\"41\" aria-label=\"Gap 41\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(41)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> relation between nervous system arousal and the extraversion/introversion personality dimension, there are many other background variables that need to be taken into consideration in interpreting research, including the learner’s age, the type of learning context, and the linguistic aspect of L2 performance. All of these factors are likely to influence the role of personality in L2 acquisition.<\u002Fp>\n<h3 class=\"section-h\">8.5 learning style and cognitive style<\u002Fh3>\n<figure class=\"ch-img\"><img src=\"8feb087f-7a9c-4e71-bdd1-20208ccaa8ac\" alt=\"image14.png\"><\u002Ffigure>\n<p>Individuals may also differ in the ways they approach L2 learning. In this regard, a distinction can be made between learning style and cognitive style (Dornyei &amp; Skehan, 2003). “Learning style” refers to approaches to learning in a more general sense and applies to all aspects of learning; learning style has been defined as “an individual’s natural, habitual, and preferred way of absorbing, processing, and retaining new information and skills” (Kinsella, 1995, p. 171). Ellis points out (2008, p. 660) that in contrast to “. . . abilities [which] relate <span class=\"gap-wrap\" data-gap=\"42\" data-answer=\"linearly\"><input type=\"text\" class=\"gap-input\" data-gap=\"42\" aria-label=\"Gap 42\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(42)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> to language achievement . . . learning styles are typically bi-polar, with both styles affording advantages and disadvantages for learning.” The other term, “cognitive style,” is generally defined as a predisposition to process information in a characteristic manner, and is generally restricted to individual preferences in the processing of information.<\u002Fp>\n<p>There may be a physiological basis to the concept of learning style, as well as some overlap between learning style and personality variables. In contrast to cognitive style, learning style is seen as more changeable, and possibly subject to training effects. There are therefore practical implications associated with the <span class=\"gap-wrap\" data-gap=\"43\" data-answer=\"identification\"><input type=\"text\" class=\"gap-input\" data-gap=\"43\" aria-label=\"Gap 43\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(43)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> of learning styles. If one is able to identify a learner’s learning style, the instructor can attempt to adapt teaching methods and techniques to that learner’s style profile.<\u002Fp>\n<p>Learning style research that specifically targets L2 learning is not abundant. Research that examines learning style differences in general, however, is substantial. For instance, in the experiential learning approach, Kolb (1976; 1984) suggested that individuals rely on concrete experience (CE) or abstract conceptualization (AC), together with a preference for active experimentation (AE) or reflective observation (RO). Kolb describes these styles as divergent (CE/RO), <span class=\"gap-wrap\" data-gap=\"44\" data-answer=\"assimilative\"><input type=\"text\" class=\"gap-input\" data-gap=\"44\" aria-label=\"Gap 44\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(44)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (RO/AC), convergent (AC/AE), and accommodative (AE/CE). Kolb proposed the ideal learning cycle, with the suggestion that learners may devote more time to one stage or another, depending on their learning style. In this approach, the ideal learning cycle consists of:<\u002Fp>\n<ul>\n<li>Concrete experience<\u002Fli>\n<li><span class=\"gap-wrap\" data-gap=\"45\" data-answer=\"Reflective\"><input type=\"text\" class=\"gap-input\" data-gap=\"45\" aria-label=\"Gap 45\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(45)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> observation<\u002Fli>\n<li>Abstract conceptualization<\u002Fli>\n<li>Active experimentation<\u002Fli>\n<\u002Ful>\n<p>Therefore, the learner with a style that favors concrete experience would be thought to spend more time in that stage of the cycle. There has been at least one attempt to relate Kolb’s influential model to L2 learning. Drawing on Kolb’s (1976) model, as well as the field independence/field dependence distinction in the cognitive style literature, Willing (1988) identified four learning style distinctions in an adult migrant population learning English as target language in Australia: communicative, analytical, authority-oriented and concrete. Learner responses to a <span class=\"gap-wrap\" data-gap=\"46\" data-answer=\"questionnaire\"><input type=\"text\" class=\"gap-input\" data-gap=\"46\" aria-label=\"Gap 46\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(46)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>-based survey allowed Willing to associate learner styles with specific learning strategy preferences. For instance, a learner with an analytical style was characterized by a preference for studying alone, while an authority-oriented learner preferred having the instructor supervise study.<\u002Fp>\n<p>L2 learning style has also been explored along perceptual dimensions. Reid (1987) developed a measure of perceptual learning styles in the form of the “Perceptual Learning Style Preference Questionnaire” (PLSPQ). This test was developed to identify various perceptual types: visual, auditive, kinesthetic, tactile, group, and individual. Research based on this questionnaire (Reid, 1987) involving over 1000 participants revealed that preferences differed between speakers of various languages and native English speakers in the US, with many non-English speakers favoring <span class=\"gap-wrap\" data-gap=\"47\" data-answer=\"kinesthetic\"><input type=\"text\" class=\"gap-input\" data-gap=\"47\" aria-label=\"Gap 47\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(47)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> and tactile learning styles, but no relationship with language proficiency was found. However, Wong and Nunan (2011) report results from another study (Wang, 1992) involving close to 500 undergraduate students of English in China who completed the PLSPQ, which revealed that learning styles were in fact related to EFL achievement.<\u002Fp>\n<p>Despite some progress, the factor “learning style” does not appear to be particularly promising as an <span class=\"gap-wrap\" data-gap=\"48\" data-answer=\"avenue\"><input type=\"text\" class=\"gap-input\" data-gap=\"48\" aria-label=\"Gap 48\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(48)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> toward a deeper understanding of the L2 learning process, or in understanding the source of L2 learner differences. Ellis (2008, p. 672) refers to his remarks made in an earlier publication (1994, p. 508), pointing out that they continue to reflect his views 14 years later:<\u002Fp>\n<p>One of the major problems is that the concept of “learning style” is ill-defined, apparently overlapping with other individual differences of both an affective and cognitive nature. It is unlikely that much progress will be made until researchers know what it is they want to measure.<\u002Fp>\n<p>At the core of learning style is the notion of cognitive style. Cognitive style is considered to be a stable, internalized manner of processing information, approaching problem solving, and in perceiving the world. It is considered to be midway between personality and intelligence, and to have a biological component. It is in part a reflection of personal preference and not <span class=\"gap-wrap\" data-gap=\"49\" data-answer=\"exclusively\"><input type=\"text\" class=\"gap-input\" data-gap=\"49\" aria-label=\"Gap 49\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(49)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> innately determined, and therefore differs from other ID variables such as IQ and aptitude.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"e382c643-f5da-4d72-8ad5-ae9069c19ced\" alt=\"image15.png\"><\u002Ffigure>\n<p>The most researched dimension of cognitive style in the SLA literature is the distinction between field independence (FI) and field dependence (FD), which originated in the study of the physical disorientation of pilots in World War II. Based on research on psychological differentiation (Witkin, Dyk, Faterson, Goodenough, &amp; Karp, 1962), the field independence/dependence dimension involves the individual’s ability to separate a subset from its background, in a perceptual sense. The perceptual ability has been thought to have a link with a similar ability relating to cognitive or intellectual approaches to problem solving. FI has been linked to L2 learning aspects such as the ability to restructure the L2 interlanguage, use analytic strategies, infer grammatical rules, and the ability to learn formal rules. FI is considered to reflect an impersonal <span class=\"gap-wrap\" data-gap=\"50\" data-answer=\"orientation\"><input type=\"text\" class=\"gap-input\" data-gap=\"50\" aria-label=\"Gap 50\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(50)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> with the user being analytic, independent, and having little social awareness. On the other hand, field dependence is considered to reflect a holistic approach to problem solving, and the FD individual is thought less able to perceive the parts of a whole, and is more other-oriented. It has been suggested that those with a higher degree of FD would be more adept at interpersonal relationships and therefore better suited for L2 communicative functions.<\u002Fp>\n<p>The main testing instrument used to determine FI is the EFT (Embedded Figures Test) or the GEFT (Group Embedded Figures Test, administered in a group setting). This test is thought to measure FI, but a weak performance does not necessarily indicate FD, since it does not include a separate measure of that end of the <span class=\"gap-wrap\" data-gap=\"51\" data-answer=\"continuum\"><input type=\"text\" class=\"gap-input\" data-gap=\"51\" aria-label=\"Gap 51\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(51)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>. The test consists of a series of increasingly more complex forms and the test taker is asked to find an embedded form in each.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"47a7a0eb-7499-46f2-a445-bbb1902be7f3\" alt=\"image16.png\"><\u002Ffigure>\n<p>A number of studies have investigated the role of FI in L2 learning. Researchers (Genesee &amp; Hamayan, 1980) found si
