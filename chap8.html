gnificant correlations between the EFT and performance by children on a test of general French L2 proficiency and auditory <span class=\"gap-wrap\" data-gap=\"52\" data-answer=\"comprehension\"><input type=\"text\" class=\"gap-input\" data-gap=\"52\" aria-label=\"Gap 52\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(52)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, but not on oral production. Bialystok and Frohlich (1978) failed to find any significant correlations and suggested that FI plays only a minor, if any, role in L2 learning. Kagan (1980) found significant correlations between syntactic complexity (writing samples of high school students) and FI. Chapelle and Roberts (1986) found a significant correlation between L2 proficiency (at the beginning and end of the school term) and FI.<\u002Fp>\n<p>The EFT test has been criticized for actually being a measure of mental ability (i.e., non-verbal intelligence) and not of cognitive style, and that therefore it is actually a disguised measure of intelligence. The validity of the EFT is thus questioned since not all agree that it actually measures what it purports to measure. In addition, it has been criticized for only targeting one aspect of FI; according to Chapelle and Green (1992, p. 51): “It is apparent that the EFT measures only the restructuring ability component,” suggesting it is closer to a measure of <span class=\"gap-wrap\" data-gap=\"53\" data-answer=\"aptitude\"><input type=\"text\" class=\"gap-input\" data-gap=\"53\" aria-label=\"Gap 53\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(53)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> than cognitive style.<\u002Fp>\n<p>The main critique concerning use of the EFT as an indicator of the role of cognitive style in L2 learning is that there is substantial difference between a visual perception test and verbal behavior. One of the sharpest criticisms was articulated by Griffiths and Sheen (1992, p. 142): “. . . the origins of the concept are considerably removed from language learning, and there is no apparent justification for extrapolating from disembedding <span class=\"gap-wrap\" data-gap=\"54\" data-answer=\"geometric\"><input type=\"text\" class=\"gap-input\" data-gap=\"54\" aria-label=\"Gap 54\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(54)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> shapes to linguistic rule induction. Rather than being particularly germane to L2 learning the concept is both remote and irrelevant.”<\u002Fp>\n<p>Witkin himself appears not to offer any support for links between the EFT and verbal learning (Witkin &amp; Goodenough, 1981, p. 31): “Most factor analytic studies in the literature suggest that restructuring abilities in the verbal and visuo-<span class=\"gap-wrap\" data-gap=\"55\" data-answer=\"perceptual\"><input type=\"text\" class=\"gap-input\" data-gap=\"55\" aria-label=\"Gap 55\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(55)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> domains are not related very highly if at all.” Still, a few L2 researchers continue to find value in exploring the notion of FI–FD. In summing up the implications of research on learning styles and cognitive styles in L2 learning Skehan (1998, p. 256) remarked: “. . . the area seems ripe for investigation. It is only by such work that we can discover whether style is both separable from ability and important for L2 learners.” Further research will no doubt determine whether cognitive style, and in particular, the FI/FD distinction, merits further investigation as an important factor in L2 learning.<\u002Fp>\n<h3 class=\"section-h\">8.6 learning strategies<\u002Fh3>\n<aside class=\"profile-box\"><h5>Profile<\u002Fh5><p>During her stay in Tuscany, Linda was very methodical in attempting to apply her Italian lessons both inside and outside the classroom. Inside the classroom, she studied the vocabulary lists her teacher provided, and attempted to commit the new words to memory, by repeating them silently over and over in her head. Outside the classroom, she made concerted efforts to use the new words with the Italian friends she was making in her neighborhood. In addition, she frequently watched Italian TV and although she wasn’t particularly fond of some of the variety shows she found on TV, she made herself watch them since the language tended to be very conversational and picturesque.<\u002Fp><\u002Faside>\n<p>Second language learning strategies have been defined as “specific actions, behaviors, steps, or techniques students use—often consciously—to improve their progress in apprehending, <span class=\"gap-wrap\" data-gap=\"56\" data-answer=\"internalizing\"><input type=\"text\" class=\"gap-input\" data-gap=\"56\" aria-label=\"Gap 56\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(56)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, and using the L2” (Oxford, 1990). As Ellis (2008, p. 705) points out: “Strategies refer to both general approaches and specific actions or techniques used to learn an L2.” Some debate revolves around the question of whether the learner is necessarily aware of the strategies he or she is using, but it is generally acknowledged that some awareness is usually associated with their use. For instance, Linda was quite aware of her strategy when she deliberately repeated new Italian words in her head.<\u002Fp>\n<figure class=\"ch-img\"><img src=\"c8baf6ff-6c89-4f90-b3e3-d55a99b1923b\" alt=\"image17.png\"><\u002Ffigure>\n<p>In addition, learning strategies may be specifically language-based, as when Linda repeated new words, or they may be more indirectly related to language, as exemplified by Linda’s various attempts to immerse herself in the L2 culture. Strategies may be <span class=\"gap-wrap\" data-gap=\"57\" data-answer=\"observable\"><input type=\"text\" class=\"gap-input\" data-gap=\"57\" aria-label=\"Gap 57\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(57)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> as in a learner’s resorting to a dictionary to look up a meaning, or non-observable, as when a learner mentally memorizes a definition.<\u002Fp>\n<p>Over the years there have been a number of attempts to classify the various types of strategies. One of the better known classification systems proposed a three-way distinction: <span class=\"gap-wrap\" data-gap=\"58\" data-answer=\"metacognitive\"><input type=\"text\" class=\"gap-input\" data-gap=\"58\" aria-label=\"Gap 58\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(58)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan>, cognitive, and social mediation types (see Table 8.2, O’Malley &amp; Chamot, 1990). In this classification, metacognitive strategies include those related to planning for learning and thinking about the learning process as it takes place. Cognitive strategies are considered those limited to specific learning tasks and more direct manipulation of learning material. Socio-affective strategies consist of those involving interaction and social activities.<\u002Fp>\n<p>Quite a few studies have looked at whether strategy use has any relation to L2 outcomes (e.g., Griffiths, 2003; Politzer &amp; McGroaty, 1985). One self-report questionnaire that has often been used in this regard is the “Strategy Inventory for Language Learning” (SILL), developed by Rebecca Oxford (1990). Although there is disagreement about its <span class=\"gap-wrap\" data-gap=\"59\" data-answer=\"appropriateness\"><input type=\"text\" class=\"gap-input\" data-gap=\"59\" aria-label=\"Gap 59\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(59)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> (e.g., Tseng, Dornyei, &amp; Schmidt, 2006), it remains one of the most often used strategy questionnaires.<\u002Fp>\n<p>Some studies have revealed correlations between use of specific strategies and aspects of L2 learning. In a study with ESL secondary school learners in Hong Kong, researchers (Wong &amp; Nunan, 2011) found that the more effective students, as measured by results on a <span class=\"gap-wrap\" data-gap=\"60\" data-answer=\"standardized\"><input type=\"text\" class=\"gap-input\" data-gap=\"60\" aria-label=\"Gap 60\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(60)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> language test, primarily used strategies involving interpersonal communication. The less effective students appeared to use strategies reflecting more dependence on the teacher and course materials.<\u002Fp>\n<p>Other studies have shown that the variety of strategies is not necessarily the most important factor as learners need to use strategies appropriately (e.g., Vann &amp; Abraham, 1990). Still other studies have focused on whether learners can be trained to use certain strategies in an effective manner. Gu’s (1996) review of the literature suggests that strategy instruction has not produced <span class=\"gap-wrap\" data-gap=\"61\" data-answer=\"unambiguously\"><input type=\"text\" class=\"gap-input\" data-gap=\"61\" aria-label=\"Gap 61\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(61)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> positive results. On the other hand, some studies show positive training effects (e.g., Bialystok, 1983). For instance, Cohen (2011) discusses a study using the SILL which was carried out with 55 intermediate learners of ESL at the University of Minnesota. This study’s results revealed the experimental group, exposed to strategy instruction, outperformed the comparison group in speaking performance at the end of a 10-week language course when post-test results were compared with those from a pre-test.<\u002Fp>\n<p>The research on learning strategies suggests that many factors intervene in determining whether their use will be beneficial to a specific learner or not. For instance, some strategies may be more beneficial for children than for adults, or for beginners than for more advanced learners. Different aspects of language learning (reading comprehension, vocabulary acquisition, etc.) may be <span class=\"gap-wrap\" data-gap=\"62\" data-answer=\"enhanced\"><input type=\"text\" class=\"gap-input\" data-gap=\"62\" aria-label=\"Gap 62\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(62)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> by certain strategies but not others. Learners in some learning contexts (e.g., formal classrooms) may gain by using particular strategies, while the same strategies may not be helpful for learners in other contexts (e.g., informal conversations). Similarly, ID variables such as personality may also affect the role that strategies play in L2 learning. Further research may help clarify which strategies or sets of strategies are in fact effective in specific situations and/or with certain types of learners, and, importantly, whether learners can be taught to use those most effective strategies.<\u002Fp>\n<p class=\"tbl-caption\">Table 8.2  Learning Strategies Classification (adapted from O’Malley &amp; Chamot, 1990, Table 2.1, p. 46).<\u002Fp>\n<div class=\"table-wrap\"><table><tbody><tr><th>Category<\u002Fth><th>Strategy<\u002Fth><th>Description<\u002Fth><\u002Ftr><tr><td>Metacognitive strategies<\u002Ftd><td>Selective attention<\u002Ftd><td>Focusing on special aspects of learning tasks, as in planning to listen for key words or phrases.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Planning<\u002Ftd><td>Planning for the organization of either written or spoken discourse.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Monitoring<\u002Ftd><td>Reviewing attention to a task, comprehension of information that should be remembered, or production while it is occurring.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Evaluation<\u002Ftd><td>Checking comprehension after completion of a receptive language activity, or evaluating language production after it has taken place.<\u002Ftd><\u002Ftr><tr><td>Cognitive strategies<\u002Ftd><td>Rehearsal<\u002Ftd><td>Repeating names of items or objects to be remembered.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Organization<\u002Ftd><td>Grouping and classifying words, terminology, or concepts according to their semantic or syntactic attributes.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Inferencing<\u002Ftd><td>Using information in text to guess meanings of new linguistic items, predict outcomes, or complete missing parts.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Summarizing<\u002Ftd><td>Intermittently synthesizing what one has heard to ensure the information has been retained.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Deducing<\u002Ftd><td>Applying rules to the understanding of language.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Imagery<\u002Ftd><td>Using visual images (either generated or actual) to understand and remember new verbal information.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Transfer<\u002Ftd><td>Using known linguistic information to facilitate a new learning task.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Elaboration<\u002Ftd><td>Linking ideas contained in new information, or integrating new ideas with known information.<\u002Ftd><\u002Ftr><tr><td>Social/affective strategies<\u002Ftd><td>Cooperation<\u002Ftd><td>Working with peers to solve a problem, pool information, check notes, or get feedback on a learning activity.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Questioning for clarification<\u002Ftd><td>Eliciting from a teacher or peer additional explanation, rephrasing, or examples.<\u002Ftd><\u002Ftr><tr><td><\u002Ftd><td>Self-talk<\u002Ftd><td>Using mental redirection of thinking to assure oneself that a learning activity will be successful or to reduce anxiety about a task.<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h3 class=\"section-h\">8.7 summing up<\u002Fh3>\n<p>The research on the role of various IDs and L2 learning outcomes has led to a number of intriguing findings. While some ID variables appear not to have a strong effect on overall L2 proficiency (e.g., IQ, learning style, cognitive style), in contrast, others have been found to play a significant role in certain situations (e.g., aptitude, motivation). Still others reveal a complex relationship, in that specific combinations of learner variables and learning contexts show important effects (e.g., personality, learning strategies). The study of IDs in L2 learning is a promising area of research. In addition to enriching our knowledge of the L2 learning process in general, it may lead to specific practical applications, such as the ability to adapt classrooms procedures and materials to better <span class=\"gap-wrap\" data-gap=\"63\" data-answer=\"harmonize\"><input type=\"text\" class=\"gap-input\" data-gap=\"63\" aria-label=\"Gap 63\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"><span class=\"gap-num\">(63)<\u002Fspan><span class=\"gap-feedback\" aria-live=\"polite\"><\u002Fspan><\u002Fspan> with learners’ specific profiles.<\u002Fp>\n<h3 class=\"section-h\">key concepts<\u002Fh3>\n<ul>\n<li>Intelligence<\u002Fli>\n<li>Cognitive-Academic Language Proficiency (CALP)<\u002Fli>\n<li>Basic Interpersonal Communication Skills (BICS)<\u002Fli>\n<li>Aptitude (language learning)<\u002Fli>\n<li>Modern Language Aptitude Test (MLAT)<\u002Fli>\n<li>Working memory (WM)<\u002Fli>\n<li>Phonological short-term memory (phonological memory, PM)<\u002Fli>\n<li>Motivation<\u002Fli>\n<li>Attitude/Motivation Test Battery (AMTB)<\u002Fli>\n<li>Intrinsic motivation<\u002Fli>\n<li>Extrinsic motivation<\u002Fli>\n<li>Orientation<\u002Fli>\n<li>Instrumental orientation<\u002Fli>\n<li>Integrative orientation<\u002Fli>\n<li>Learning style<\u002Fli>\n<li>Cognitive style<\u002Fli>\n<li>Field independence<\u002Fli>\n<li>Field dependence<\u002Fli>\n<li>Learning strategy<\u002Fli>\n<\u002Ful>\n<h3 class=\"section-h\">self-assessment questions<\u002Fh3>\n<div class=\"saq\"><p class=\"saq-q\"><strong>1.<\u002Fstrong> Research indicates that intelligence is<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>closely related to L2 basic interpersonal communication skill (BICS)<\u002Fli><li>closely related to L2 cognitive/academic language proficiency (CALP)<\u002Fli><li>closely related to both BICS and CALP<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<p>2. What are the three components that recent views suggest are part of language learning aptitude? a. auditory skill, linguistic analysis skill and memory b. auditory skill, learning strategies, and memory c. communication strategies, learning strategies, and memory d. metalinguistic skill, inductive auditory skill, and associative memory.<\u002Fp>\n<div class=\"saq\"><p class=\"saq-q\"><strong>3.<\u002Fstrong> Physiological explanations for links between personality and L2 learning suggest<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>extraverts are advantaged for short-term memory due to low nervous system arousal and therefore perform better in oral production<\u002Fli><li>introverts are disadvantaged for short-term memory due to high nervous system arousal and therefore perform less well in oral production<\u002Fli><li>neither a nor b<\u002Fli><li>both a and b<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>4.<\u002Fstrong> Instrumental and integrative motivational orientations<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>cannot both be present in the same individual<\u002Fli><li>may both be present in the same individual<\u002Fli><li>are the only types of motivation possible<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>5.<\u002Fstrong> Gardner’s (1985) formulaic definition of motivation is<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>Motivation = Effort + Intelligence + Attitudes toward goal achievement<\u002Fli><li>Motivation = Effort + Desire to achieve a goal + Attitudes toward learning the language<\u002Fli><li>Motivation = Effort + Desire to achieve a goal + Cognitive style<\u002Fli><li>Motivation = Effort + Attitudes toward language instructor + Reasons for language study (orientations)<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>6.<\u002Fstrong> Field independence (FI) has been linked to all of the following characteristics except<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>an independent orientation<\u002Fli><li>use of analytic strategies<\u002Fli><li>inferring of grammatical rules<\u002Fli><li>interpersonal skills<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>7.<\u002Fstrong> O’Malley and Chamot’s three-way classification of learning strategies is<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>cognitive, metacognitive, and socio-affective<\u002Fli><li>metalinguistic, socio-cultural, cognitive<\u002Fli><li>communicative, socio-affective, cognitive<\u002Fli><li>none of the above<\u002Fli><\u002Fol><\u002Fdiv>\n<div class=\"saq\"><p class=\"saq-q\"><strong>8.<\u002Fstrong> All of the following are general findings in the learning strategies literature except<\u002Fp><ol type=\"a\" class=\"saq-opts\"><li>children and adults use the same strategies<\u002Fli><li>there are differences in how strategies are defined and classified<\u002Fli><li>learners use a variety of strategies<\u002Fli><li>strategy training is not always successful<\u002Fli><\u002Fol><\u002Fdiv>\n<h3 class=\"section-h\">discussion questions<\u002Fh3>\n<p>1. Which ID factor do you consider to be the most important in L2 learning? Is your judgment based on your own personal experience or observations of other learners? Can you provide examples?<\u002Fp>\n<p>2. Do you think certain ID factors might play a stronger role at different L2 learning stages, or in different learning contexts? Give examples.<\u002Fp>\n<p>3. Do you think classroom L2 teaching can benefit from knowing more about the IDs of learners? In what specific ways might this information be helpful?<\u002Fp>\n<p>4. Referring to O’Malley and Chamot’s classification of learning strategies in Table 8.2, what L2 learning strategy types do you prefer using? Which types of strategies do you not use, but think might be helpful?<\u002Fp>\n<h3 class=\"section-h\">exercises/project ideas<\u002Fh3>\n<p>1. Find a copy of Gardner’s AMTB (Attitude/Motivation Test Battery) and arrange to have a number of L2 learners complete it. What do the results tell you about their L2 learning motivation? Do you detect interesting differences or similarities in responses?<\u002Fp>\n<p>2. If you can get a copy of the short version of the MLAT (Modern Language Aptitude Test), arrange for several L2 learners to complete it. Are you able to identify any interesting differences among their results?<\u002Fp>\n<p>3. Find up-to-date information on more recent views of L2 motivation, including Dornyei’s (2005) construct the “L2 motivation self system.” Compare with Gardner’s model. Do you see any important differences or distinctions?<\u002Fp>\n<h3 class=\"section-h\">further reading and viewing<\u002Fh3>\n<p>Cohen, A.D. (2011). Strategies in learning and using a second language. (2nd ed.). New York: Pearson.<\u002Fp>\n<p>A comprehensive overview of language learning strategies.<\u002Fp>\n<p>Dornyei, Z. (2001). Motivational strategies in the classroom. Cambridge: Cambridge University Press.<\u002Fp>\n<p>A readable and clear presentation of ways to enhance motivation in the classroom.<\u002Fp>\n<p>Dornyei, Z. (2005). The psychology of the language learner: Individual differences in second language acquisition. Mahwah, NJ: Lawrence Erlbaum.<\u002Fp>\n<p>A comprehensive look at various ID variables by renowned scholar Z. Dornyei.<\u002Fp>\n<p>Dornyei, Z., &amp; Skehan, P. (2003). Individual differences in second language learning. In C.J. Doughty &amp; M.H. Long (Eds.), The handbook of second language acquisition (pp. 589–630). Oxford: Blackwell.<\u002Fp>\n<p>A detailed overview of the role of individual differences in SLA written by two noted authorities in the area.<\u002Fp>\n<p>Gardner, R.C. (2010). Motivation and second language acquisition: The socioeducational model. New York: Peter Lang Publishing.<\u002Fp>\n<p>Gardner presents an overview of his views on motivation, including his own replies to critics.<\u002Fp>\n<p>O’Malley, J.M., &amp; Chamot, A.U. (1990). Learning strategies in second language acquisition. Cambridge: Cambridge University Press.<\u002Fp>\n<p>This book is an excellent introduction to the basic issues in the study of L2 learning strategies.<\u002Fp>\n<h3 class=\"section-h\">Video links<\u002Fh3>\n<p>Edutopia (1997). Big thinkers: Howard Gardner on multiple intelligences. Available at: http://www.edutopia.org/multiple-intelligences-howard-gardner-video<\u002Fp>\n<p>Anaheimu (2008) David Nunan TESOL seminar: Motivating young learners. Available at: http://www.youtube.com/watch?v=T9WuUPuyo24<\u002Fp>\n<h3 class=\"section-h . New approaches to assessing strategic learning: The case of self-regulation in vocabulary acquisition. Applied Linguistics, 27(1), 78–102.<\u002Fp>\n<p>Vann, R., &amp; Abraham, R. (1990). Strategies of unsuccessful language learners. TESOL Quarterly, 24, 177–197.<\u002Fp>\n<p>Verhoeven, L., &amp; Vermeer, A. (2002). Communicative competence and personality dimensions in first and second language learners. Applied Psycholinguistics, 23, 361–374.<\u002Fp>\n<p>Wang, C.M. (1992). A study of English major students’ learning styles in China. In S.C. Gui (Ed.), The psychology of Chinese Learners of English (pp. 72–89). Changsha: Hunan Education Press.<\u002Fp>\n<p>Wells, C.G. (1985). Language, learning and education: Selected papers from the Bristol study, language at home and at school. Philadelphia: Windsor.<\u002Fp>\n<p>Willing, K. (1988). Learning styles in adult migrant education. Adelaide, South Australia: National Curriculum Research Council.<\u002Fp>\n<p>Winke, P. (2005). Individual differences in adult Chinese second language acquisition: The relationships among aptitude, memory and strategies for learning. Unpublished PhD dissertation, Georgetown University.<\u002Fp>\n<p>Witkin, H.A., Dyk, R.B., Faterson, H.F., Goodenough, D.R., &amp; Karp, S.A. (1962). Psychological differentiation. New York: Wiley.<\u002Fp>\n<p>Witkin, H.A., &amp; Goodenough, D.R. (1981). Cognitive styles—essence and origins: Field dependence and field independence. New York: Wiley.<\u002Fp>\n<p>Witkin, H.A., Oltman, P.K., Raskin, E., &amp; Karp, S.A. (1971). A manual for the embedded figures tests. Palo Alto, CA: Consulting Psychologists Press.<\u002Fp>\n<p>Wong, L.L.C., &amp; Nunan, D. (2011). The learning styles and strategies of effective language learners. System, 39, 144–163.<\u002Fp>\n  <\u002Fsection>\n<\u002Fdiv>\n<script>\n(function(){\n  function normalize(str){if(!str)return '';return str.toLowerCase().trim().replace(/[\\u2018\\u2019]/g,\"'\").replace(/[\\u201C\\u201D]/g,'\"').replace(/\\s+/g,' ');}\n  function checkInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');const answer=wrap.getAttribute('data-answer')||'';const value=input.value;\n    if(!value.trim()){input.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');return null;}\n    const ok=normalize(value)===normalize(answer);input.classList.toggle('correct',ok);input.classList.toggle('wrong',!ok);input.classList.remove('revealed');\n    fb.classList.toggle('ok',ok);fb.classList.toggle('no',!ok);fb.classList.remove('show');return ok;}\n  function revealInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');const answer=wrap.getAttribute('data-answer')||'';\n    input.value=answer;input.classList.remove('correct','wrong');input.classList.add('revealed');fb.classList.remove('ok','no');fb.classList.add('show');}\n  function resetInput(input){const wrap=input.parentElement;const fb=wrap.querySelector('.gap-feedback');input.value='';input.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');}\n  function updateGlobalStats(){const inputs=document.querySelectorAll('.gap-input');let correct=0;inputs.forEach(inp=>{if(inp.classList.contains('correct'))correct++;});\n    const total=inputs.length;document.getElementById('score-text').textContent=correct+' / '+total+' correct';\n    document.getElementById('score-bar').style.width=(total?(correct/total*100):0)+'%';}\n  document.addEventListener('input',(e)=>{if(e.target.classList.contains('gap-input')){const fb=e.target.parentElement.querySelector('.gap-feedback');\n    e.target.classList.remove('correct','wrong','revealed');fb.classList.remove('ok','no','show');updateGlobalStats();}});\n  document.addEventListener('blur',(e)=>{if(e.target.classList.contains('gap-input')&&e.target.value.trim()){checkInput(e.target);updateGlobalStats();}},true);\n  document.addEventListener('keydown',(e)=>{if(e.target.classList.contains('gap-input')&&e.key==='Enter'){e.preventDefault();checkInput(e.target);updateGlobalStats();\n    const inputs=[...document.querySelectorAll('.gap-input')];const idx=inputs.indexOf(e.target);if(idx>=0&&idx+1<inputs.length)inputs[idx+1].focus();}});\n  document.getElementById('btn-check-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(inp=>{if(inp.value.trim())checkInput(inp);});updateGlobalStats();\n    const summary=document.getElementById('summary-top');const total=document.querySelectorAll('.gap-input').length;const correct=document.querySelectorAll('.gap-input.correct').length;\n    summary.innerHTML='<strong>'+correct+' / '+total+' correct.<\u002Fstrong> Review any incorrect answers and try again.';summary.classList.add('show');});\n  document.getElementById('btn-reveal-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(revealInput);updateGlobalStats();});\n  document.getElementById('btn-reset-all').addEventListener('click',()=>{document.querySelectorAll('.gap-input').forEach(resetInput);document.getElementById('summary-top').classList.remove('show');updateGlobalStats();});\n  updateGlobalStats();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
